name: Build Pocket APK

# Dibina oleh GitHub supaya tiada apa perlu dipasang pada komputer sesiapa.
# APK siap muncul sebagai artifact pada larian ini.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Imej ubuntu-latest sudah membawa SDK Android dengan lesen diterima,
      # jadi memasangnya semula hanya menambah satu titik kegagalan.
      - name: Show the SDK we were given
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Log penuh disekat di belakang storan blob, yang tidak semua orang
      # boleh capai. Ringkasan langkah boleh dibaca melalui API, jadi ralat
      # diletakkan di situ dan bukan hanya dalam log.
      - name: Put the errors somewhere readable
        if: always()
        working-directory: android
        run: |
          {
            echo '### Build output'
            echo '```'
            grep -nE "^e: |error:|FAILURE|What went wrong|Caused by|Could not|Unresolved reference|> Task .* FAILED" build.log | head -80 || echo '(tiada baris ralat dipadankan)'
            echo '```'
            echo '### Last 60 lines'
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: android/build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocket-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
