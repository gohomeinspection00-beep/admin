name: Build Pocket APK

# Dibina oleh GitHub supaya tiada apa perlu dipasang pada komputer sesiapa.
# APK siap muncul sebagai artifact pada larian ini.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Imej ubuntu-latest sudah membawa SDK Android dengan lesen diterima,
      # jadi memasangnya semula hanya menambah satu titik kegagalan.
      - name: Show the SDK we were given
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log

      # Log penuh disekat di belakang storan blob, yang tidak semua orang
      # boleh capai. Ringkasan langkah boleh dibaca melalui API, jadi ralat
      # diletakkan di situ dan bukan hanya dalam log.
      # Ringkasan langkah untuk dibaca manusia, dan anotasi untuk dibaca
      # melalui API: log penuh dan artifact kedua-duanya duduk di belakang
      # storan blob yang tidak semua rangkaian boleh capai.
      - name: Put the errors somewhere readable
        if: always()
        working-directory: android
        run: |
          {
            echo '### Build output'
            echo '```'
            grep -nE "^e: |error:|FAILURE|What went wrong|Caused by|Could not|Unresolved reference|> Task .* FAILED" build.log | head -80 || echo '(tiada baris ralat dipadankan)'
            echo '```'
            echo '### Last 60 lines'
            echo '```'
            tail -60 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |error:|What went wrong|Caused by|Could not|Unresolved reference" build.log \
            | head -40 | while IFS= read -r line; do
              printf '::error::%s\n' "${line//$'\r'/}"
            done
          tail -25 build.log | while IFS= read -r line; do
              printf '::warning::%s\n' "${line//$'\r'/}"
            done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: android/build.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pocket-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Artifact ialah zip yang perlukan log masuk, yang menyusahkan dari
      # telefon. Keluaran memberi pautan .apk terus yang boleh diketik dan
      # dipasang terus.
      - name: Publish the APK as a direct download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          cp "$APK" GoXpertPocket.apk
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest GoXpertPocket.apk \
            --title "Pocket APK (terkini)" \
            --notes "Dibina dari ${{ github.sha }}. Muat turun GoXpertPocket.apk, pasang, kemudian menu tiga titik > Muat fail Pocket."
