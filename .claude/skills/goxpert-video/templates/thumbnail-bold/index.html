<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Thumbnail Floor Trap</title>
    <style>
      :root { --navy: #161b2e; --yellow: #fcd116; --red: #e63b3b; --white: #ffffff; --heavy: "Montserrat", "Poppins", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--navy); }
      #bg { position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(14px) saturate(0.7); }
      #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(22,27,46,0.95) 0%, rgba(22,27,46,0.55) 30%, rgba(22,27,46,0.35) 55%, rgba(22,27,46,0.85) 75%, rgba(22,27,46,1) 100%); }

      #logo { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); display: block; padding: 18px 30px; background: var(--white); border-radius: 26px; box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
      #logo img { display: block; width: 300px; height: 104px; }

      #head { position: absolute; left: 0; right: 0; top: 315px; display: flex; flex-direction: column; align-items: center; }
      .h { display: block; font-family: var(--heavy); font-weight: 900; line-height: 1.0; text-transform: uppercase; white-space: nowrap; letter-spacing: -0.01em;
           -webkit-text-stroke: 6px #10131f; paint-order: stroke fill; text-shadow: 0 10px 0 #10131f, 0 18px 30px rgba(0,0,0,0.45); }
      #h1 { font-size: 138px; color: var(--white); }
      #h2 { font-size: 215px; color: var(--yellow); margin-top: 4px; }

      #card { position: absolute; left: 190px; top: 735px; width: 700px; height: 600px; transform: rotate(-3deg); }
      #card-shadow { position: absolute; left: 22px; top: 22px; right: -22px; bottom: -22px; background: rgba(0,0,0,0.4); }
      #card-in { position: absolute; inset: 0; border: 12px solid var(--red); overflow: hidden; background: #000; }
      #card-in img { display: block; width: 100%; height: 100%; object-fit: cover; }
      #sticker { position: absolute; left: 520px; top: 1170px; display: block; padding: 18px 40px 14px; background: var(--red); color: var(--white); border: 8px solid var(--white); border-radius: 16px; transform: rotate(-7deg);
                 font-family: var(--heavy); font-weight: 900; font-size: 96px; line-height: 1; text-transform: uppercase; box-shadow: 0 14px 0 rgba(0,0,0,0.3); }

      #small { position: absolute; left: 0; right: 0; top: 1385px; text-align: center; font-family: var(--heavy); font-weight: 800; font-size: 64px; color: var(--white);
               -webkit-text-stroke: 4px #10131f; paint-order: stroke fill; text-shadow: 0 6px 0 #10131f; }
      #pill { position: absolute; left: 50px; right: 50px; top: 1470px; display: flex; justify-content: center; padding: 22px 20px 18px; background: var(--yellow); border-radius: 28px; box-shadow: 0 12px 0 rgba(0,0,0,0.35);
              font-family: var(--heavy); font-weight: 900; font-size: 68px; line-height: 1; color: #10131f; text-transform: uppercase; white-space: nowrap; letter-spacing: -0.01em; }
      #sub { position: absolute; left: 0; right: 0; top: 1640px; text-align: center; font-family: var(--heavy); font-weight: 700; font-size: 46px; color: #c9d1ea; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-no-timeline data-start="0" data-width="1080" data-height="1920" data-duration="1">
      <div id="scene" class="clip" data-start="0" data-duration="1" data-track-index="0" style="position:absolute;inset:0" data-layout-allow-overflow>
        <img id="bg" src="assets/bg.jpg" alt="" data-layout-allow-overflow />
        <div id="shade"></div>
        <div id="logo"><img src="assets/logo.png" alt="GoXpert Solutions" /></div>
        <div id="head">
          <span id="h1" class="h">Air Lambat</span>
          <span id="h2" class="h">Turun?</span>
        </div>
        <div id="card"><div id="card-shadow"></div><div id="card-in"><img src="assets/trap.jpg" alt="" /></div></div>
        <span id="sticker">Awas!</span>
        <div id="small">Defect apa harini??</div>
        <div id="pill">Floor Trap Tersumbat</div>
        <div id="sub">Semak sebelum tamat DLP</div>
      </div>
    </div>
  </body>
</html>
