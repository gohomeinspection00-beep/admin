<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>GoXpert Thumbnail</title>
    <script src="vendor/gsap.min.js"></script>
    <style>
      :root {
        --ink: #1d1a33;
        --paper: #f6f2e7;
        --accent: #f6c33b;
        --display: "League Gothic", "Oswald", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
      #bg { position: absolute; inset: -60px; width: calc(100% + 120px); height: calc(100% + 120px); object-fit: cover; filter: blur(16px); }
      #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(29, 26, 51, 0.92) 0%, rgba(29, 26, 51, 0.7) 45%, rgba(29, 26, 51, 0.55) 70%, rgba(29, 26, 51, 0.95) 100%); }
      #bar { position: absolute; left: 0; top: 0; width: 100%; height: 14px; background: var(--accent); }
      #kicker { position: absolute; left: 60px; top: 290px; display: block; padding: 12px 24px 10px; background: var(--accent); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 44px; letter-spacing: 0.06em; }
      #headline { position: absolute; left: 50px; right: 30px; top: 378px; display: flex; flex-direction: column; }
      .hl { display: block; font-family: var(--display); line-height: 0.88; text-transform: uppercase; color: var(--paper); }
      #hl1 { font-size: 236px; white-space: nowrap; }
      #hl2 { font-size: 212px; color: var(--accent); white-space: nowrap; }
      #subject { position: absolute; right: -190px; bottom: 0; width: 840px; height: 1492px; object-fit: contain; object-position: bottom; filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.55)); }
      #inset { position: absolute; left: 60px; top: 1010px; padding: 16px 16px 20px; background: #ffffff; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }
      #inset img { display: block; width: 380px; height: 380px; object-fit: cover; }
      #inset-label { position: absolute; left: -14px; top: -34px; display: block; padding: 10px 20px 8px; background: var(--accent); color: var(--ink); font-family: var(--mono); font-weight: 700; font-size: 32px; letter-spacing: 0.05em; white-space: nowrap; }
      #warn { position: absolute; left: 60px; top: 1470px; display: flex; align-items: center; gap: 14px; padding: 14px 24px 12px; background: var(--ink); color: var(--paper); border: 4px solid var(--accent); font-family: var(--mono); font-weight: 700; font-size: 40px; white-space: nowrap; }
      #warn svg { display: block; width: 40px; height: 40px; color: var(--accent); }
      #footer { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; background: var(--ink); border-top: 8px solid var(--accent); }
      #logo-card { display: flex; align-items: center; padding: 16px 26px; background: #ffffff; border-radius: 18px; }
      #logo-card img { display: block; width: 400px; height: 139px; }
      #cta { display: flex; flex-direction: column; align-items: flex-end; color: var(--paper); font-family: var(--mono); font-weight: 700; }
      #cta-label { display: block; font-size: 28px; letter-spacing: 0.14em; color: var(--accent); }
      #cta-num { display: block; font-size: 52px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1080" data-height="1920" data-duration="1">
      <img id="bg" data-layout-allow-overflow src="assets/frame.png" alt="" />
      <div id="shade"></div>
      <span id="bar"></span>
      <span id="kicker">INSPECTION KALI KE-3</span>
      <div id="headline">
        <span id="hl1" class="hl">Sebelum</span>
        <span id="hl2" class="hl">Ke Tribunal</span>
      </div>
      <img id="subject" data-layout-allow-overflow src="assets/subject.png" alt="" />
      <div id="inset">
        <img src="assets/before-tile-crack.jpg" alt="" />
        <span id="inset-label">BEFORE · DEFECT</span>
      </div>
      <div id="warn">
        <svg viewBox="0 0 24 24"><path d="M12 2.5L23 21.5H1z" fill="currentColor"/><path d="M12 9v6M12 17.2v1.6" stroke="#1d1a33" stroke-width="2.6"/></svg>
        DEFECT MASIH ADA
      </div>
      <div id="footer">
        <div id="logo-card"><img src="assets/logo.png" alt="GoXpert Solutions" /></div>
        <div id="cta"><span id="cta-label">WHATSAPP</span><span id="cta-num">011-3144 6591</span></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#inset", { rotation: -5 }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
