function htmlResit(r) { return htmlDokumen(r); }

function simpananDok(data, jenis) { return jenis === "invois" ? data.invois : data.resit; }

function dapatDok(jenis, id) {
  var senarai = simpananDok(baca(), jenis);
  return senarai.filter(function (x) { return x.id === id; })[0] || null;
}

function cetakDok(jenis, id) {
  var r = dapatDok(jenis, id);
  if (!r) return;
  var kertas = $("#kertasResit");
  kertas.innerHTML = htmlDokumen(r);
  document.body.classList.add("cetak-resit");
  var selesai = function () {
    document.body.classList.remove("cetak-resit");
    kertas.innerHTML = "";
    window.removeEventListener("afterprint", selesai);
  };
  window.addEventListener("afterprint", selesai);
  setTimeout(function () {
    try { window.print(); } catch (e) { toast("Pelayar tidak dapat membuka dialog cetak.", "bad"); }
    // Sandaran: jika afterprint tidak berlaku, skrin mesti kembali normal.
    setTimeout(selesai, 800);
  }, 250);                                            // beri masa logo dimuatkan
}

function cetakResit(id) { cetakDok("resit", id); }

function teksDok(r) {
  var k = kiraResit(r);
  var c = r.syarikat || TETAPAN_ASAL.resit;
  var invois = r.dokJenis === "invois";
  var templat = (invois ? c.teksInvois : c.teksResit) ||
    (invois ? TETAPAN_ASAL.resit.teksInvois : TETAPAN_ASAL.resit.teksResit);

  var nilai = {
    "{syarikat}": c.namaSyarikat,
    "{no}": r.no,
    "{tarikh}": fmtTarikh(r.tarikh),
    "{tarikhAkhir}": r.tarikhAkhir ? fmtTarikh(r.tarikhAkhir) : "-",
    "{nama}": r.client.nama,
    "{telefon}": r.client.telefon || "",
    "{servis}": r.servis,
    "{jenis}": invois ? "Invois" : r.jenis,
    "{jumlah}": rm(invois ? r.jumlahPerluBayar : r.jumlahDiterima),
    "{subtotal}": rm(k.sub),
    "{dibayar}": rm(k.terdahulu),
    "{baki}": rm(k.baki),
    "{bank}": c.bank,
    "{akaun}": c.noAkaun,
    "{namaAkaun}": c.namaAkaun,
    "{tarikhInspeksi}": r.insp.tarikh
      ? fmtTarikh(r.insp.tarikh) + (r.insp.masa ? " (" + r.insp.masa + ")" : "") : "-"
  };
  return Object.keys(nilai).reduce(function (teks, kunci) {
    return teks.split(kunci).join(nilai[kunci]);
  }, templat);
}

function teksResit(r) { return teksDok(r); }

function salinTeks(kotak) {
  kotak.select();
  kotak.setSelectionRange(0, 99999);
  var berjaya = false;
  try { berjaya = document.execCommand("copy"); } catch (e) { berjaya = false; }
  if (berjaya) return toast("Teks disalin.", "ok");
  if (navigator.clipboard) {
    navigator.clipboard.writeText(kotak.value).then(function () { toast("Teks disalin.", "ok"); },
      function () { toast("Tidak dapat salin automatik — salin sendiri dari kotak teks.", "warn", 5000); });
    return;
  }
  toast("Tidak dapat salin — salin sendiri dari kotak teks.", "warn", 5000);
}

function lihatDok(jenis, id) {
  var r = dapatDok(jenis, id);
  if (!r) return;
  var invois = jenis === "invois";
  var label = invois ? "Invois" : "Resit";

  var data = baca();
  var st = invois ? statusInvois(data, r) : null;
  var resitBerkait = r.resitId ? data.resit.filter(function (x) { return x.id === r.resitId; })[0] : null;

  var m = modal(label + " " + r.no,
    (invois
      ? '<div class="baris-medan" style="margin-bottom:6px">' +
          medan("Status Bayaran", "<select id='statusInvois'>" +
            ["(automatik)", "Belum Bayar", "Bayar Sebahagian", "Sudah Bayar", "Batal"].map(function (x) {
              var nilai = x === "(automatik)" ? "" : x;
              return '<option value="' + esc(nilai) + '"' +
                ((r.statusManual || "") === nilai ? " selected" : "") + ">" + esc(x) + "</option>";
            }).join("") + "</select>") +
          medan("Status Semasa", '<div style="padding-top:8px"><span class="badge badge-' + st.warna +
            '">' + esc(st.teks) + "</span>" +
            (resitBerkait ? ' <button type="button" class="btn btn-lembut btn-kecil" id="btnResitInvois">Resit ' +
              esc(resitBerkait.no) + "</button>" : "") + "</div>") +
        "</div>" +
        (resitBerkait ? "" :
          '<p class="kecil" style="margin:0 0 10px">Bila client sudah bayar, tekan ' +
          "<b>Terima Bayaran &amp; Jana Resit</b> — bayaran akan direkod pada jualan dan resit dijana terus.</p>")
      : "") +
    '<div class="pratonton">' + htmlDokumen(r) + "</div>" +
    '<div class="tajuk-seksyen">Teks untuk WhatsApp</div>' +
    '<textarea id="teksResitKotak" style="min-height:150px">' + esc(teksDok(r)) + "</textarea>" +
    '<div class="baris-butang modal-kaki">' +
      '<button type="button" class="btn btn-bad" id="btnPadamResit">Padam</button>' +
      '<button type="button" class="btn btn-lembut" id="btnSuntingResit">Sunting</button>' +
      (invois && !resitBerkait
        ? '<button type="button" class="btn btn-ok" id="btnBayarInvois">Terima Bayaran &amp; Jana Resit</button>' : "") +
      '<button type="button" class="btn btn-lembut" id="btnSalinResit">Salin Teks</button>' +
      '<button type="button" class="btn btn-ok" id="btnWaResit">WhatsApp</button>' +
      '<button type="button" class="btn btn-utama" id="btnCetakResit">Cetak / Simpan PDF</button>' +
    "</div>", 760);

  $("#btnCetakResit", m.el).onclick = function () { cetakDok(jenis, id); };
  $("#btnSalinResit", m.el).onclick = function () { salinTeks($("#teksResitKotak", m.el)); };
  $("#btnWaResit", m.el).onclick = function () {
    var teks = $("#teksResitKotak", m.el).value;
    var no = String(r.client.telefon || "").replace(/[^\d]/g, "");
    if (no.charAt(0) === "0") no = "6" + no;
    window.open("https://wa.me/" + (no.length > 8 ? no : "") + "?text=" + encodeURIComponent(teks), "_blank");
  };
  $("#btnSuntingResit", m.el).onclick = function () { m.tutup(); borangDok(jenis, { dokId: id }); };
  if ($("#btnBayarInvois", m.el)) {
    $("#btnBayarInvois", m.el).onclick = function () {
      m.tutup();
      if (r.saleId) borangBayaran(r.saleId, null, { jumlah: r.jumlahPerluBayar, invoisId: r.id });
      else borangDok("resit", { invoisId: r.id });      // invois manual tanpa rekod jualan
    };
  }
  if ($("#btnResitInvois", m.el)) {
    $("#btnResitInvois", m.el).onclick = function () { m.tutup(); lihatResit(resitBerkait.id); };
  }
  if ($("#statusInvois", m.el)) {
    $("#statusInvois", m.el).onchange = function (e) {
      var d = baca();
      d.invois = d.invois.map(function (x) {
        if (x.id === id) x.statusManual = e.target.value;
        return x;
      });
      if (!simpan(d)) return;
      toast(e.target.value ? "Status ditetapkan: " + e.target.value
                           : "Status kembali automatik.", "ok");
      lukis();
    };
  }
  $("#btnPadamResit", m.el).onclick = function () {
    sahkan("Padam " + label.toLowerCase() + " " + r.no + "? Nombor ini tidak akan digunakan semula.")
      .then(function (ya) {
        if (!ya) return;
        var d = baca();
        if (invois) d.invois = d.invois.filter(function (x) { return x.id !== id; });
        else d.resit = d.resit.filter(function (x) { return x.id !== id; });
        simpan(d);
        m.tutup();
        toast(label + " dipadam.", "ok");
        lukis();
      });
  };
}

function lihatResit(id) { lihatDok("resit", id); }
function lihatInvois(id) { lihatDok("invois", id); }

/* ------------------- borang resit / invois ---------------------------- */
function borangDok(jenis, opsi) {
  opsi = opsi || {};
  var invois = jenis === "invois";
  var label = invois ? "Invois" : "Resit";
  var data = baca();
  var r = opsi.dokId ? simpananDok(data, jenis).filter(function (x) { return x.id === opsi.dokId; })[0] : null;
  var baru = !r;
  var sale = opsi.saleId ? data.sale.filter(function (x) { return x.id === opsi.saleId; })[0]
    : (r && r.saleId ? data.sale.filter(function (x) { return x.id === r.saleId; })[0] : null);

  var awal;
  if (r) {
    awal = JSON.parse(JSON.stringify(r));
  } else {
    var inv = opsi.invoisId
      ? data.invois.filter(function (x) { return x.id === opsi.invoisId; })[0] : null;
    var k = sale ? kiraSale(sale) : null;
    // Urutan ledger = urutan bayaran direkod. Jangan susun ikut tarikh, kerana
    // deposit boleh bertarikh lain daripada tarikh ia dimasukkan.
    var senarai = sale ? (sale.bayaran || []) : [];
    var kedudukan = opsi.bayaranId
      ? senarai.map(function (x) { return x.id; }).indexOf(opsi.bayaranId) : -1;
    var bayaran = kedudukan !== -1 ? senarai[kedudukan] : null;
    var sebelum = invois ? senarai : (kedudukan !== -1 ? senarai.slice(0, kedudukan) : senarai);
    var jumlahSebelum = sebelum.reduce(function (j, x) { return j + nom(x.jumlah); }, 0);
    var hargaAwal = k ? k.total : 0;
    var tempoh = new Date();
    tempoh.setDate(tempoh.getDate() + Math.max(0, parseInt(data.tetapan.resit.tempohHari, 10) || 7));

    awal = {
      no: (invois ? nomborInvoisBaharu(data) : nomborResitBaharu(data)).no,
      tarikh: bayaran && !invois ? bayaran.tarikh : kunciTarikh(),
      tarikhAkhir: kunciTarikh(tempoh),
      jenis: bayaran ? bayaran.jenis : (sale ? "Deposit" : "Bayaran Penuh"),
      jumlahDiterima: bayaran ? nom(bayaran.jumlah) : 0,
      jumlahPerluBayar: Math.max(hargaAwal - jumlahSebelum, 0),
      bayaranId: opsi.bayaranId || null,
      sebelum: sebelum.map(function (x) {
        return { jenis: x.jenis, tarikh: x.tarikh, jumlah: nom(x.jumlah) };
      }),
      bayaranTerdahulu: jumlahSebelum,
      servis: sale && (nom(sale.water) > 0 || nom(sale.electric) > 0)
        ? "Home Inspection + Water & Electrical Test" : "Home Inspection",
      qty: 1,
      harga: hargaAwal,
      diskaun: 0,
      catatan: "",
      penuh: false,
      client: {
        nama: sale ? sale.nama : "", telefon: sale ? sale.telefon : "", email: sale ? sale.email : "",
        alamat: sale ? [sale.unit, sale.projek].filter(Boolean).join(", ") : "",
        bandar: "", poskod: "", negeri: ""
      },
      prop: {
        size: sale ? sale.size : "", jenis: "",
        water: sale && nom(sale.water) > 0 ? "Yes (" + rm(sale.water) + ")" : "-",
        electric: sale && nom(sale.electric) > 0 ? "Yes (" + rm(sale.electric) + ")" : "-"
      },
      insp: {
        bookDate: sale ? (sale.createdAt || "").slice(0, 10) : "",
        tarikh: sale ? sale.tarikh : "",
        masa: sale ? (sale.masaMula || "") + (sale.masaTamat ? " – " + sale.masaTamat : "") : "",
        inspector: sale ? (sale.inspector || []).join(", ") : ""
      }
    };

    // Resit yang dijana dari invois tanpa rekod jualan: salin terus dari invois.
    if (inv && !sale) {
      awal.client = JSON.parse(JSON.stringify(inv.client));
      awal.prop = JSON.parse(JSON.stringify(inv.prop));
      awal.insp = JSON.parse(JSON.stringify(inv.insp));
      awal.servis = inv.servis;
      awal.qty = inv.qty;
      awal.harga = inv.harga;
      awal.diskaun = inv.diskaun;
      awal.sebelum = inv.sebelum || [];
      awal.bayaranTerdahulu = nom(inv.bayaranTerdahulu);
      awal.jumlahDiterima = nom(inv.jumlahPerluBayar);
      awal.jenis = "Bayaran Penuh";
      awal.penuh = inv.penuh;
    }
  }

  var m = modal(baru ? label + " Baharu" : "Sunting " + label + " " + r.no,
    '<form id="borangResit">' +
      '<div class="tajuk-seksyen">' + label + "</div>" +
      '<div class="baris-medan">' +
        medan("No. " + label + " *", '<input type="text" name="no" value="' + esc(awal.no) + '" required>') +
        medan("Tarikh *", '<input type="date" name="tarikh" value="' + esc(awal.tarikh) + '" required>') +
        (invois
          ? medan("Tarikh Akhir Bayaran",
              '<input type="date" name="tarikhAkhir" value="' + esc(awal.tarikhAkhir || "") + '">')
          : medan("Jenis Bayaran", "<select name='jenis'>" + JENIS_BAYARAN.map(function (x) {
              return "<option" + (awal.jenis === x ? " selected" : "") + ">" + esc(x) + "</option>";
            }).join("") + "</select>")) +
      "</div>" +
      (invois
        ? medan("Jumlah Perlu Dibayar (RM) *",
            '<input type="number" step="0.01" min="0" name="jumlahPerluBayar" value="' +
            esc(awal.jumlahPerluBayar) + '" required>')
        : medan("Jumlah Diterima (RM) *",
            '<input type="number" step="0.01" min="0" name="jumlahDiterima" value="' +
            esc(awal.jumlahDiterima) + '" required>')) +

      '<div class="tajuk-seksyen">Client</div>' +
      '<div class="baris-medan">' +
        medan("Nama *", '<input type="text" name="c_nama" value="' + esc(awal.client.nama) + '" required>') +
        medan("Telefon", '<input type="tel" name="c_telefon" value="' + esc(awal.client.telefon) + '">') +
        medan("Email", '<input type="email" name="c_email" value="' + esc(awal.client.email) + '">') +
      "</div>" +
      medan("Alamat Property", '<textarea name="c_alamat" style="min-height:60px">' + esc(awal.client.alamat) + "</textarea>") +
      '<div class="baris-medan">' +
        medan("Bandar", '<input type="text" name="c_bandar" value="' + esc(awal.client.bandar) + '">') +
        medan("Poskod", '<input type="text" name="c_poskod" value="' + esc(awal.client.poskod) + '">') +
        medan("Negeri", '<input type="text" name="c_negeri" value="' + esc(awal.client.negeri) + '">') +
      "</div>" +

      '<div class="tajuk-seksyen">Servis & Caj</div>' +
      medan("Servis", '<input type="text" name="servis" value="' + esc(awal.servis) + '">') +
      '<div class="baris-medan">' +
        medan("Kuantiti", '<input type="number" min="1" name="qty" value="' + esc(awal.qty) + '">') +
        medan("Harga (RM)", '<input type="number" step="0.01" min="0" name="harga" value="' + esc(awal.harga) + '">') +
        medan("Diskaun (%)", '<input type="number" step="0.01" min="0" name="diskaun" value="' + esc(awal.diskaun) + '">') +
      "</div>" +
      ((awal.sebelum && awal.sebelum.length)
        ? '<div class="kad" style="box-shadow:none;margin:0 0 14px;padding:12px">' +
            '<div class="kecil" style="margin-bottom:6px"><b>' +
            (invois ? "Bayaran sudah diterima (ditolak dalam invois)" : "Bayaran terdahulu (ditolak dalam resit)") +
            "</b></div>" +
            awal.sebelum.map(function (x) {
              return '<div class="jumlah-baris"><span>' + esc(x.jenis) +
                (x.tarikh ? ' <span class="kecil">' + esc(fmtTarikh(x.tarikh)) + "</span>" : "") +
                "</span><b>" + esc(rm(x.jumlah)) + "</b></div>";
            }).join("") +
          "</div>" +
          '<input type="hidden" name="bayaranTerdahulu" value="' + esc(awal.bayaranTerdahulu) + '">'
        : medan((invois ? "Bayaran Sudah Diterima (RM)" : "Bayaran Terdahulu (RM)"),
            '<input type="number" step="0.01" min="0" name="bayaranTerdahulu" value="' +
            esc(awal.bayaranTerdahulu || 0) + '">')) +
      '<div class="baris-medan">' +
        medan(invois ? "Baki Selepas Invois Ini" : "Baki Selepas Resit Ini",
          '<input type="text" id="bakiResit" readonly value="">') +
      "</div>" +
      medan("Catatan (pilihan)", '<input type="text" name="catatan" value="' + esc(awal.catatan) + '">') +

      '<div class="tajuk-seksyen">Maklumat Inspeksi (muka surat 2)</div>' +
      '<label class="chip pilih-chip" style="margin-bottom:12px"><input type="checkbox" name="penuh"' +
        (awal.penuh ? " checked" : "") + ">Sertakan muka surat Inspection Information</label>" +
      '<div class="baris-medan">' +
        medan("Built-Up Size", '<input type="text" name="p_size" value="' + esc(awal.prop.size) + '">') +
        medan("Jenis Property", '<input type="text" name="p_jenis" value="' + esc(awal.prop.jenis) + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Water Supply", '<input type="text" name="p_water" value="' + esc(awal.prop.water) + '">') +
        medan("Electrical Supply", '<input type="text" name="p_electric" value="' + esc(awal.prop.electric) + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Tarikh Booking", '<input type="date" name="i_bookDate" value="' + esc(awal.insp.bookDate) + '">') +
        medan("Tarikh Inspeksi", '<input type="date" name="i_tarikh" value="' + esc(awal.insp.tarikh) + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Masa Inspeksi", '<input type="text" name="i_masa" value="' + esc(awal.insp.masa) + '">') +
        medan("Inspector", '<input type="text" name="i_inspector" value="' + esc(awal.insp.inspector) + '">') +
      "</div>" +

      '<div class="baris-butang modal-kaki">' +
        '<button type="button" class="btn btn-lembut" data-batal>Batal</button>' +
        '<button type="submit" class="btn btn-utama">' +
          (baru ? "Jana " + label : "Kemas Kini") + "</button>" +
      "</div>" +
    "</form>", 720);

  var borang = $("#borangResit", m.el);
  function kiraPapar() {
    var v = ambilNilai(borang);
    var k = kiraResit({ qty: v.qty, harga: v.harga, diskaun: v.diskaun,
      sebelum: awal.sebelum, bayaranTerdahulu: v.bayaranTerdahulu,
      jumlahDiterima: invois ? v.jumlahPerluBayar : v.jumlahDiterima });
    $("#bakiResit", m.el).value = rm(k.baki) + "  (sub-total " + rm(k.sub) +
      ", terdahulu " + rm(k.terdahulu) + ")";
  }
  borang.addEventListener("input", kiraPapar);
  kiraPapar();

  $("[data-batal]", m.el).onclick = m.tutup;
  borang.onsubmit = function (e) {
    e.preventDefault();
    var v = ambilNilai(borang);
    var d = baca();
    if (!v.no) return toast("Sila isi nombor " + label.toLowerCase() + ".", "bad");
    if (invois && nom(v.jumlahPerluBayar) <= 0) {
      return toast("Jumlah perlu dibayar mesti lebih daripada RM 0.", "bad", 4500);
    }
    if (!invois && nom(v.jumlahDiterima) <= 0) {
      return toast("Resit mesti ada jumlah diterima. Rekod bayaran dahulu, " +
        "kemudian tekan Buat Resit pada bayaran itu.", "bad", 6000);
    }
    var bertindih = simpananDok(d, jenis).some(function (x) {
      return x.no === v.no && x.id !== (r ? r.id : null);
    });
    if (bertindih) return toast("Nombor " + v.no + " sudah digunakan.", "bad", 5000);

    var rekod = {
      id: r ? r.id : id(),
      dokJenis: jenis,
      no: v.no,
      tarikh: v.tarikh,
      tarikhAkhir: invois ? v.tarikhAkhir : null,
      jenis: invois ? "Invois" : v.jenis,
      jumlahDiterima: invois ? 0 : nom(v.jumlahDiterima),
      jumlahPerluBayar: invois ? nom(v.jumlahPerluBayar) : 0,
      statusManual: r ? (r.statusManual || "") : "",
      resitId: r ? (r.resitId || null) : null,
      saleId: sale ? sale.id : (r ? r.saleId : null),
      servis: v.servis,
      qty: nom(v.qty) || 1,
      harga: nom(v.harga),
      diskaun: nom(v.diskaun),
      bayaranId: r ? r.bayaranId : (opsi.bayaranId || null),
      invoisId: r ? r.invoisId : (opsi.invoisId || null),
      sebelum: r ? r.sebelum : awal.sebelum,
      bayaranTerdahulu: nom(v.bayaranTerdahulu),
      catatan: v.catatan,
      penuh: $("[name=penuh]", borang).checked,
      client: { nama: v.c_nama, telefon: v.c_telefon, email: v.c_email, alamat: v.c_alamat,
                bandar: v.c_bandar, poskod: v.c_poskod, negeri: v.c_negeri },
      prop: { size: v.p_size, jenis: v.p_jenis, water: v.p_water, electric: v.p_electric },
      insp: { bookDate: v.i_bookDate, tarikh: v.i_tarikh, masa: v.i_masa, inspector: v.i_inspector },
      syarikat: r ? r.syarikat : JSON.parse(JSON.stringify(d.tetapan.resit)),
      createdAt: r ? r.createdAt : new Date().toISOString()
    };

    var senarai = simpananDok(d, jenis);
    if (r) {
      var digantikan = senarai.map(function (x) { return x.id === r.id ? rekod : x; });
      if (invois) d.invois = digantikan; else d.resit = digantikan;
    } else {
      senarai.push(rekod);
      // Naikkan kaunter hanya bila nombor auto yang dicadangkan digunakan.
      if (v.no === awal.no) {
        var padanan = String(v.no).match(/(\d+)\s*$/);
        if (padanan) {
          var seterusnya = parseInt(padanan[1], 10) + 1;
          if (invois) d.tetapan.resit.nomborInvois = seterusnya;
          else d.tetapan.resit.nombor = seterusnya;
        }
      }
    }

    // Sambungkan resit dengan invois asalnya.
    if (!invois && rekod.invoisId) {
      d.invois = d.invois.map(function (x) {
        if (x.id === rekod.invoisId) x.resitId = rekod.id;
        return x;
      });
    }
    // Sambungkan resit dengan bayaran supaya senarai bayaran tunjuk nombor resit.
    if (!invois && rekod.bayaranId && rekod.saleId) {
      d.sale = d.sale.map(function (x) {
        if (x.id !== rekod.saleId) return x;
        x.bayaran = (x.bayaran || []).map(function (y) {
          if (y.id === rekod.bayaranId) y.resitId = rekod.id;
          return y;
        });
        return x;
      });
    }
    if (!simpan(d)) return;
    m.tutup();
    toast(r ? label + " dikemas kini." : label + " " + rekod.no + " dijana.", "ok");
    lihatDok(jenis, rekod.id);
    lukis();
  };
}

function borangResit(opsi) { borangDok("resit", opsi); }
function borangInvois(opsi) { borangDok("invois", opsi); }

/* ------------------------- halaman invois ----------------------------- */
var invoisBulan = "";
var invoisCari = "";
var resitBulan = "";
var resitCari = "";

// Status invois dikira dari bayaran sebenar dalam rekod jualan.
function statusInvois(data, r) {
  if (r.statusManual) {
    return { teks: r.statusManual,
      warna: r.statusManual === "Sudah Bayar" ? "ok" : (r.statusManual === "Batal" ? "bad" : "warn") };
  }
  var sale = r.saleId ? data.sale.filter(function (x) { return x.id === r.saleId; })[0] : null;
  if (!sale) return { teks: "Manual", warna: "muted" };
  var k = kiraSale(sale);
  if (k.baki <= 0.005) return { teks: "Sudah Bayar", warna: "ok" };
  if (k.dibayar > nom(r.bayaranTerdahulu) + 0.005) return { teks: "Bayar Sebahagian", warna: "warn" };
  var lewat = r.tarikhAkhir && r.tarikhAkhir < kunciTarikh();
  return lewat ? { teks: "Lewat", warna: "bad" } : { teks: "Belum Bayar", warna: "muted" };
}

// Baki semasa bagi semua jualan yang berkaitan dengan satu kumpulan dokumen.
function bakiKumpulan(data, kumpulan) {
  var idJualan = [];
  kumpulan.senarai.forEach(function (r) {
    if (r.saleId && idJualan.indexOf(r.saleId) === -1) idJualan.push(r.saleId);
  });
  return idJualan.reduce(function (j, sid) {
    var sale = data.sale.filter(function (x) { return x.id === sid; })[0];
    return j + (sale ? kiraSale(sale).baki : 0);
  }, 0);
}

function tapisDok(senarai, bulan, cari) {
  var teks = String(cari || "").trim().toLowerCase();
  return senarai.filter(function (r) {
    if (bulan && String(r.tarikh).slice(0, 7) !== bulan) return false;
    if (teks) {
      var gabung = [r.no, r.client.nama, r.client.telefon, r.client.email, r.servis].join(" ").toLowerCase();
      if (gabung.indexOf(teks) === -1) return false;
    }
    return true;
  }).sort(function (a, b) { return String(b.tarikh + b.no).localeCompare(String(a.tarikh + a.no)); });
}

/* ======================================================================
   SUB JOB — kerja yang disubkan; tidak dikira dalam jualan syarikat
   ================================================================== */
var subBulan = "";
var subCari = "";

function kiraSub(j) {
  var harga = nom(j.harga);
  var agih = (j.agihan || []).reduce(function (t, a) { return t + nom(a.jumlah); }, 0);
  return { harga: harga, agih: agih, syarikat: Math.round((harga - agih) * 100) / 100 };
}

function barisAgihan(a, i) {
  a = a || {};
  return '<div class="baris-agih" data-baris>' +
    medan("Staf / Rakan", '<input list="senaraiAgih" class="agihNama" value="' + esc(a.nama || "") + '">') +
    medan("Dapat (RM)", '<input type="number" step="0.01" min="0" class="agihJumlah" value="' +
      esc(a.jumlah !== undefined ? a.jumlah : "") + '">') +
    medan("Peranan / Catatan", '<input type="text" class="agihNota" placeholder="Contoh: buat inspection" value="' +
      esc(a.nota || "") + '">') +
    '<button type="button" class="btn-buang-baris" data-buang-baris title="Buang baris">&times;</button>' +
  "</div>";
}

function borangSubJob(subId, tarikhAsal) {
  var data = baca();

  var baru = !j;

  var m = modal(baru ? "Sub Job Baharu" : "Sunting Sub Job",
    '<p class="kecil" style="margin:0 0 12px">Sub job direkod berasingan — ia <b>tidak masuk</b> ' +

    '<form id="borangSub">' +

        medan("Tarikh *", '<input type="date" name="tarikh" value="' + esc(j.tarikh || "") + '" required>') +
        medan("Masa Mula", '<input type="text" name="masaMula" placeholder="9.30am" value="' + esc(j.masaMula || "") + '">') +
        medan("Masa Tamat", '<input type="text" name="masaTamat" placeholder="12.30pm" value="' + esc(j.masaTamat || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Nama Client *", '<input type="text" name="nama" value="' + esc(j.nama || "") + '" required>') +
        medan("No. Telefon", '<input type="tel" name="telefon" value="' + esc(j.telefon || "") + '">') +
        medan("Email", '<input type="email" name="email" value="' + esc(j.email || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Projek / Daerah", '<input list="senaraiProjekSub" name="projek" value="' + esc(j.projek || "") + '">') +
        medan("No. Unit", '<input type="text" name="unit" value="' + esc(j.unit || "") + '">') +
        medan("Size", '<input type="text" name="size" value="' + esc(j.size || "") + '">') +
      "</div>" +
      '<datalist id="senaraiProjekSub">' + (data.tetapan.projek || []).map(function (x) {
        return "<option>" + esc(x) + "</option>";
      }).join("") + "</datalist>" +

      '<div class="tajuk-seksyen">Bayaran &amp; Agihan</div>' +
      '<div class="baris-medan">' +
        medan("Harga Client (RM) *",
          '<input type="number" step="0.01" min="0" name="harga" value="' + esc(j.harga || "") + '" required>') +
        medan("Status Kerja", "<select name='statusKerja'>" + statusSenarai(data.tetapan).map(function (x) {
          return "<option" + ((j.statusKerja || "") === x ? " selected" : "") + ">" + esc(x) + "</option>";
        }).join("") + "</select>") +
        medan("Bahagian Syarikat", '<input type="text" id="paparSyarikat" readonly value="">') +
      "</div>" +
      '<p class="kecil" style="margin:-6px 0 10px">Bahagian syarikat dikira automatik: ' +
        "harga client tolak jumlah yang diberi kepada staf/rakan.</p>" +
      '<div id="senaraiAgihan">' + (j.agihan && j.agihan.length ? j.agihan : [{}])
        .map(barisAgihan).join("") + "</div>" +
      '<datalist id="senaraiAgih">' + data.staf.filter(function (x) { return x.status === "aktif"; })
        .map(function (x) { return "<option>" + esc(x.nama) + "</option>"; }).join("") + "</datalist>" +
      '<button type="button" class="btn btn-lembut btn-kecil" id="btnTambahAgih">+ Tambah Staf</button>' +
      '<div class="jumlah-baris" style="margin-top:12px"><span>Jumlah diagihkan</span><b id="paparAgih">RM 0.00</b></div>' +

      medan("Catatan", '<textarea name="catatan" style="min-height:60px">' + esc(j.catatan || "") + "</textarea>") +
      '<div class="baris-butang modal-kaki">' +
        (baru ? "" : '<button type="button" class="btn btn-bad" id="btnPadamSub">Padam</button>') +
        '<button type="button" class="btn btn-lembut" data-batal>Batal</button>' +
        '<button type="submit" class="btn btn-utama">' + (baru ? "Simpan Sub Job" : "Kemas Kini") + "</button>" +
      "</div>" +
    "</form>", 720);

  var borang = $("#borangSub", m.el);

  function bacaAgihan() {
    return $$("[data-baris]", m.el).map(function (b) {
      return { nama: $(".agihNama", b).value.trim(),
               jumlah: nom($(".agihJumlah", b).value),
               nota: $(".agihNota", b).value.trim() };
    }).filter(function (a) { return a.nama || a.jumlah; });
  }
  function kiraPapar() {
    var agih = bacaAgihan().reduce(function (t, a) { return t + nom(a.jumlah); }, 0);
    var harga = nom($("[name=harga]", borang).value);
    $("#paparAgih", m.el).textContent = rm(agih);
    $("#paparSyarikat", m.el).value = rm(harga - agih) +
      (agih > harga ? "  (lebih agihan!)" : "");
  }
  function pasangBaris() {
    $$("[data-buang-baris]", m.el).forEach(function (b) {
      b.onclick = function () {
        if ($$("[data-baris]", m.el).length <= 1) return toast("Perlu sekurang-kurangnya satu baris.", "warn");
        b.parentElement.remove();
        kiraPapar();
      };
    });
  }
  pasangBaris();
  kiraPapar();
  borang.addEventListener("input", kiraPapar);
  $("#btnTambahAgih", m.el).onclick = function () {
    $("#senaraiAgihan", m.el).insertAdjacentHTML("beforeend", barisAgihan({}));
    pasangBaris();
  };

  $("[data-batal]", m.el).onclick = m.tutup;

        var d = baca();

        toast("Sub job dipadam.", "ok");
        lukis();

    if (!v.nama) return toast("Sila isi nama client.", "bad");
    var rekod = {
      id: subId || id(),
      tarikh: v.tarikh, masaMula: v.masaMula, masaTamat: v.masaTamat,
      nama: v.nama, telefon: telefonKemas(v.telefon), email: v.email,
      projek: v.projek, unit: v.unit, size: v.size,
      harga: nom(v.harga), statusKerja: v.statusKerja, catatan: v.catatan,
      agihan: bacaAgihan(),
      createdAt: j.createdAt || new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    var d = baca();
    if (subId) d.subjob = d.subjob.map(function (x) { return x.id === subId ? rekod : x; });
    else d.subjob.push(rekod);
    if (!simpan(d)) return;
    m.tutup();
    toast(subId ? "Sub job dikemas kini." : "Sub job direkod.", "ok");
    lukis();
  };
}

    "</div>" +
    '<div class="tajuk-seksyen">Butiran</div>' +
    '<dl class="kunci-nilai">' +
      baris("Tarikh", fmtTarikh(j.tarikh) + " (" + namaHari(j.tarikh) + ")") +
      baris("Masa", (j.masaMula || "-") + (j.masaTamat ? " – " + j.masaTamat : "")) +
      baris("Client", j.nama) + baris("Telefon", j.telefon) + baris("Email", j.email) +
      baris("Projek", j.projek) + baris("Unit", j.unit) + baris("Size", j.size) +
      baris("Catatan", j.catatan) +
    "</dl>" +
    '<div class="tajuk-seksyen">Agihan</div>' +
    '<div class="jumlah-baris"><span>Harga client</span><b>' + esc(rm(k.harga)) + "</b></div>" +
    (j.agihan || []).map(function (a) {
      return '<div class="jumlah-baris"><span>' + esc(a.nama || "-") +
        (a.nota ? ' <span class="kecil">' + esc(a.nota) + "</span>" : "") + "</span><b>" +
        esc(rm(a.jumlah)) + "</b></div>";
    }).join("") +
    '<div class="jumlah-baris"><span><b>Bahagian syarikat</b></span><b>' + esc(rm(k.syarikat)) + "</b></div>" +
    '<div class="baris-butang modal-kaki">' +
      '<button type="button" class="btn btn-lembut" id="btnTutupSub">Tutup</button>' +
      '<button type="button" class="btn btn-utama" id="btnSuntingSub">Sunting</button>' +
    "</div>", 560);

  $("#btnTutupSub", m.el).onclick = m.tutup;
  $("#btnSuntingSub", m.el).onclick = function () { m.tutup(); borangSubJob(subId); };
  $("#statusSub", m.el).onchange = function (e) {
    var d = baca();
    d.subjob = d.subjob.map(function (x) {
      if (x.id === subId) { x.statusKerja = e.target.value; x.updatedAt = new Date().toISOString(); }
      return x;
    });
    if (!simpan(d)) return;
    toast("Status sub job dikemas kini.", "ok");
    lukis();
  };
}

function lukisSubJob(bekas) {
  var data = baca();
  var teks = subCari.trim().toLowerCase();
  var senarai = data.subjob.filter(function (j) {
    if (subBulan && String(j.tarikh).slice(0, 7) !== subBulan) return false;
    if (teks) {
      var gabung = [j.nama, j.telefon, j.projek, j.unit, j.catatan,
        (j.agihan || []).map(function (a) { return a.nama; }).join(" ")].join(" ").toLowerCase();
      if (gabung.indexOf(teks) === -1) return false;
    }
    return true;
  }).sort(function (a, b) { return String(b.tarikh).localeCompare(String(a.tarikh)); });

  var jum = senarai.reduce(function (t, j) {
    var k = kiraSub(j);
    t.harga += k.harga; t.agih += k.agih; t.syarikat += k.syarikat;
    return t;
  }, { harga: 0, agih: 0, syarikat: 0 });

  // Pendapatan setiap staf dari sub job.
  var peta = {};
  senarai.forEach(function (j) {
    (j.agihan || []).forEach(function (a) {
      var n = (a.nama || "Tanpa nama").trim() || "Tanpa nama";
      peta[n] = peta[n] || { nama: n, jumlah: 0, bil: 0 };
      peta[n].jumlah += nom(a.jumlah);
      peta[n].bil++;
    });
  });
  var ikutStaf = Object.keys(peta).map(function (n) { return peta[n]; })
    .sort(function (a, b) { return b.jumlah - a.jumlah; });

  bekas.innerHTML =
    '<div class="grid grid-4">' +
      kadStat("Sub Job", String(senarai.length), subBulan ? fmtBulan(subBulan) : "semua bulan") +
      kadStat("Nilai Client", rm(jum.harga), "harga dikutip dari client") +
      kadStat("Diagihkan ke Staf", rm(jum.agih), ikutStaf.length + " orang terlibat") +
      kadStat("Bahagian Syarikat", rm(jum.syarikat), "selepas tolak agihan") +
    "</div>" +

    '<div class="kad">' +
      '<div class="kad-tajuk"><h3>Senarai Sub Job</h3>' +
        '<div class="aksi">' +
          '<button class="btn btn-utama" id="btnSubBaru">Sub Job Baharu</button>' +
          '<button class="btn btn-lembut" id="btnEksportSub">Eksport CSV</button>' +
        "</div>" +
      "</div>" +
      '<p class="kecil" style="margin:-4px 0 12px">Sub job tidak dikira dalam jualan syarikat, ' +
      "target bulanan, resit atau invois. Ia dipapar dalam kalendar dengan tanda <b>SUB</b>.</p>" +
      '<div class="penapis">' +
        '<label>Bulan<input type="month" id="fBulanSub" value="' + esc(subBulan) + '"></label>' +
        '<label style="min-width:220px">Cari<input type="search" id="fCariSub" placeholder="Client, projek, nama staf…" value="' + esc(subCari) + '"></label>' +
        '<button class="btn btn-lembut" id="btnResetSub">Reset</button>' +
      "</div>" +
      '<div class="jadual-bungkus">' +
      (senarai.length ? "<table><thead><tr><th>Tarikh</th><th>Client</th><th>Projek / Unit</th>" +
        "<th class='num'>Harga</th><th>Agihan</th><th class='num'>Syarikat</th><th>Status</th><th></th>" +
        "</tr></thead><tbody>" +
        senarai.map(function (j) {
          var k = kiraSub(j);
          return "<tr>" +
            "<td>" + esc(fmtTarikh(j.tarikh)) + '<div class="kecil">' +
              esc(j.masaMula || "-") + "</div></td>" +
            '<td class="bungkus"><b>' + esc(j.nama) + "</b>" +
              (j.telefon ? '<div class="kecil">' + esc(j.telefon) + "</div>" : "") + "</td>" +
            '<td class="bungkus">' + esc(j.projek || "-") +
              '<div class="kecil">' + esc(j.unit || "-") + "</div></td>" +
            '<td class="num">' + esc(rm(k.harga)) + "</td>" +
            '<td class="bungkus kecil">' + ((j.agihan || []).length
              ? esc(j.agihan.map(function (a) { return a.nama + " " + rmPendek(a.jumlah); }).join(", "))
              : "belum diagih") + "</td>" +
            '<td class="num"><b>' + esc(rm(k.syarikat)) + "</b></td>" +
            "<td>" + lencanaKerja(j.statusKerja, data.tetapan) + "</td>" +
            '<td><div class="aksi">' +
              '<button class="btn btn-lembut" data-sub="' + esc(j.id) + '">Buka</button>' +
            "</div></td></tr>";
        }).join("") + "</tbody></table>"
        : kosong("Belum ada sub job. Tekan “Sub Job Baharu”, atau klik kanan pada tarikh dalam kalendar.")) +
      "</div>" +
    "</div>" +

    '<div class="kad">' +
      '<div class="kad-tajuk"><h3>Pendapatan Staf dari Sub Job</h3>' +
        '<span class="kecil">' + (subBulan ? fmtBulan(subBulan) : "semua bulan") + "</span></div>" +
      cartaMendatar(ikutStaf.map(function (x) {
        return { nama: x.nama, nilai: x.jumlah, teks: rm(x.jumlah) + " · " + x.bil + " job" };
      })) +
    "</div>";

  $("#btnSubBaru").onclick = function () { borangSubJob(null); };
  $("#fBulanSub").onchange = function (e) { subBulan = e.target.value; lukisSubJob(bekas); };
  $("#btnResetSub").onclick = function () { subBulan = ""; subCari = ""; lukisSubJob(bekas); };
  var kotak = $("#fCariSub");
  kotak.oninput = function (e) {
    var pos = e.target.selectionStart;
    subCari = e.target.value;
    lukisSubJob(bekas);
    var baharu = $("#fCariSub", bekas);
    baharu.focus();
    baharu.setSelectionRange(pos, pos);
  };
  $("#btnEksportSub").onclick = function () {
    if (!senarai.length) return toast("Tiada sub job untuk dieksport.", "warn");
    csv("sub-job" + (subBulan ? "-" + subBulan : ""),
      ["Tarikh", "Masa", "Client", "Telefon", "Projek", "Unit", "Harga",
       "Agihan Staf", "Jumlah Agihan", "Bahagian Syarikat", "Status"],
      senarai.map(function (j) {
        var k = kiraSub(j);
        return [j.tarikh, (j.masaMula || "") + (j.masaTamat ? "-" + j.masaTamat : ""),
          j.nama, j.telefon, j.projek, j.unit, k.harga,
          (j.agihan || []).map(function (a) { return a.nama + ": " + a.jumlah; }).join(" | "),
          k.agih, k.syarikat, j.statusKerja];
      }));
  };
  $$("[data-sub]", bekas).forEach(function (b) {
    b.onclick = function () { lihatSubJob(b.getAttribute("data-sub")); };
  });
}

/* ======================================================================
   HALAMAN 3 — OPERASI (siapa bergerak hari ini)
   ================================================================== */
var opTarikh = kunciTarikh();

function tambahHari(tarikh, langkah) {
  var d = keDate(tarikh);
  d.setDate(d.getDate() + langkah);
  return kunciTarikh(d);
}

function susunMasa(a, b) {
  return masaMinit(a.masaMula) - masaMinit(b.masaMula);
}

function lukisOperasi(bekas) {
  var data = baca();
  var semua = data.sale.filter(function (s) { return s.tarikh === opTarikh; });
  var job = semua.filter(function (s) { return s.statusKerja !== "Batal"; }).sort(susunMasa);
  var staf = data.staf.filter(function (x) {
    return x.status === "aktif" && x.kumpulan === "Operasi";
  });

  var peta = {};
  staf.forEach(function (x) { peta[x.nama] = []; });
  job.forEach(function (s) {
    (s.inspector || []).forEach(function (n) { (peta[n] = peta[n] || []).push(s); });
  });

  var bergerak = Object.keys(peta).filter(function (n) { return peta[n].length; });
  var lapang = Object.keys(peta).filter(function (n) { return !peta[n].length; });
  var belumTugas = job.filter(function (s) { return !(s.inspector || []).length; });
  var nilai = ringkasan(job);
  var siap = job.filter(function (s) {
    return ["Inspection Siap", "Report Submit", "Selesai"].indexOf(s.statusKerja) !== -1;
  }).length;
  var cutiInfo = cutiPada(opTarikh, data);

  // Prestasi inspector untuk bulan tarikh yang dipilih.
  var bulanOp = opTarikh.slice(0, 7);
  var jobBulan = data.sale.filter(function (x) {
    return String(x.tarikh).slice(0, 7) === bulanOp && x.statusKerja !== data.tetapan.statusBatal;
  });
  var prestasi = staf.map(function (x) {
    var milik = jobBulan.filter(function (j) { return (j.inspector || []).indexOf(x.nama) !== -1; });
    var nilai = milik.reduce(function (t, j) { return t + kiraSale(j).total; }, 0);
    return { nama: x.nama, jawatan: x.jawatan || "Staf", bil: milik.length, nilai: nilai,
             projek: milik.map(function (j) { return j.projek; }) };
  }).sort(function (a, b) { return b.bil - a.bil || b.nilai - a.nilai; });
  var jobTanpaStaf = jobBulan.filter(function (j) { return !(j.inspector || []).length; }).length;

  bekas.innerHTML =
    '<div class="papar-cetak"><h2>' + esc(data.tetapan.namaSyarikat) + " — Jadual Operasi " +
      esc(fmtTarikh(opTarikh)) + "</h2></div>" +

    '<div class="kal-bar">' +
      '<div class="kal-nav">' +
        '<button type="button" id="opSebelum" aria-label="Hari sebelum">&#8249;</button>' +
        "<h3>" + esc(namaHari(opTarikh)) + ", " + esc(fmtTarikh(opTarikh)) + "</h3>" +
        '<button type="button" id="opSelepas" aria-label="Hari seterusnya">&#8250;</button>' +
        '<button type="button" id="opIni" style="width:auto;padding:0 12px">Hari Ini</button>' +
      "</div>" +
      '<div class="aksi">' +
        '<input type="date" id="opPilihTarikh" value="' + esc(opTarikh) + '" style="width:auto;margin:0">' +
        '<button class="btn btn-lembut" id="opCetak">Cetak Jadual</button>' +
      "</div>" +
    "</div>" +

    (cutiInfo ? '<div class="kad" style="border-color:#fca5a5;background:#fdf1f1;margin-bottom:14px">' +
      "<b style='color:var(--bad)'>" + esc(cutiInfo.sebab) + "</b>" +
      '<div class="kecil">Hari ini ditanda cuti dalam kalendar.</div></div>' : "") +

    '<div class="grid grid-4">' +
      kadStat("Job Hari Ini", String(job.length), siap + " sudah selesai inspection") +
      kadStat("Staf Bergerak", bergerak.length + " / " + staf.length,
        lapang.length ? lapang.length + " staf operasi tiada tugasan" : "semua staf operasi bertugas") +
      kadStat("Belum Ditugaskan", String(belumTugas.length),
        belumTugas.length ? "job perlu staf" : "semua job ada staf") +
      kadStat("Nilai Job Hari Ini", rm(nilai.total), "baki " + rm(nilai.baki)) +
    "</div>" +

    '<div class="kad">' +
      '<div class="kad-tajuk"><h3>Jadual Hari Ini</h3>' +
        '<button class="btn btn-utama btn-kecil" id="opTambahJob">Key-in Sale Hari Ini</button></div>' +
      '<div class="jadual-bungkus">' +
      (job.length ? "<table><thead><tr><th>Masa</th><th>Client</th><th>Projek / Unit</th>" +
        "<th>Staf Inspection</th><th>Status Kerja</th><th class='num'>Nilai</th><th></th></tr></thead><tbody>" +
        job.map(function (s) {
          var k = kiraSale(s);
          return "<tr>" +
            "<td><b>" + esc(s.masaMula || "-") + "</b>" +
              (s.masaTamat ? '<div class="kecil">hingga ' + esc(s.masaTamat) + "</div>" : "") + "</td>" +
            '<td class="bungkus"><b>' + esc(s.nama || "-") + "</b>" +
              (s.telefon ? '<div class="kecil">' + esc(s.telefon) + "</div>" : "") + "</td>" +
            '<td class="bungkus">' + esc(s.projek || "-") +
              '<div class="kecil">' + esc(s.unit || "-") + "</div></td>" +
            "<td>" + ((s.inspector || []).length
              ? esc(s.inspector.join(", "))
              : '<span class="badge badge-warn">Belum ditugaskan</span>') + "</td>" +
            "<td><select class=\"opStatus\" data-id=\"" + esc(s.id) + "\" style=\"margin:0;padding:6px 8px\">" +
              statusSenarai(data.tetapan).map(function (x) {
                return "<option" + ((s.statusKerja || "Tempahan") === x ? " selected" : "") + ">" + esc(x) + "</option>";
              }).join("") + "</select></td>" +
            '<td class="num">' + esc(rm(k.total)) + "</td>" +
            '<td><div class="aksi">' +
              '<button class="btn btn-lembut" data-tugas="' + esc(s.id) + '">Tugaskan</button>' +
              '<button class="btn btn-ok" data-hantar-op="' + esc(s.id) + '">Hantar</button>' +
              '<button class="btn btn-lembut" data-lihat="' + esc(s.id) + '">Butiran</button>' +
            "</div></td></tr>";
        }).join("") + "</tbody></table>"
        : kosong("Tiada job pada tarikh ini.")) +
      "</div>" +
    "</div>" +

    '<div class="grid grid-2">' +
      '<div class="kad tanpa-margin">' +
        '<div class="kad-tajuk"><h3>Pergerakan Staf Hari Ini</h3></div>' +
        (staf.length ? staf.map(function (x) {
          var senarai = (peta[x.nama] || []).slice().sort(susunMasa);
          return '<div class="senarai-item">' +
            '<div class="jumlah-baris" style="border:0;padding:0 0 4px">' +
              "<span><b>" + esc(x.nama) + '</b> <span class="kecil">· ' + esc(x.jawatan || "Staf") + "</span></span>" +
              (senarai.length
                ? '<span class="badge badge-ok">' + senarai.length + " job</span>"
                : '<span class="badge badge-muted">Tiada tugasan</span>') +
            "</div>" +
            (senarai.length ? senarai.map(function (s) {
              return '<div class="kecil" style="padding-left:2px">' +
                esc(s.masaMula || "-") + (s.masaTamat ? " – " + esc(s.masaTamat) : "") + " · " +
                esc(s.nama) + " · " + esc(s.projek || "-") + "</div>";
            }).join("") : "") +
          "</div>";
        }).join("") : kosong("Belum ada staf kumpulan Operasi. Tambah di menu Staf.")) +
      "</div>" +

      '<div class="kad tanpa-margin">' +
        '<div class="kad-tajuk"><h3>Beban Kerja 7 Hari</h3></div>' +
        '<div class="jadual-bungkus">' + jadualBeban(data, staf) + "</div>" +
        '<div class="tajuk-seksyen">Job belum ditugaskan (7 hari)</div>' +
        (function () {
          var akan = data.sale.filter(function (s) {
            return s.statusKerja !== "Batal" && !(s.inspector || []).length &&
              s.tarikh >= opTarikh && s.tarikh <= tambahHari(opTarikh, 6);
          }).sort(function (a, b) { return String(a.tarikh).localeCompare(String(b.tarikh)); });
          return akan.length ? akan.map(function (s) {
            return '<div class="jumlah-baris"><span>' + esc(fmtTarikh(s.tarikh)) + " · " +
              esc(s.masaMula || "-") + " · " + esc(s.nama) + "</span>" +
              '<button class="btn btn-lembut btn-kecil" data-tugas="' + esc(s.id) + '">Tugaskan</button></div>';
          }).join("") : '<div class="kecil">Semua job dalam 7 hari sudah ada staf.</div>';
        })() +
      "</div>" +
    "</div>" +

      '<div class="kad">' +
        '<div class="kad-tajuk"><h3>Tugasan Inspector — ' + esc(fmtBulan(bulanOp)) + "</h3>" +
          '<span class="kecil">' + jobBulan.length + " job" +
          (jobTanpaStaf ? " · " + jobTanpaStaf + " belum ditugaskan" : "") + "</span></div>" +
        cartaMendatar(prestasi.map(function (x) {
          return { nama: x.nama, nilai: x.bil, teks: x.bil + " job" };
        })) +
        '<div class="tajuk-seksyen">Tugasan Report &amp; Submission (belum selesai)</div>' +
        (function () {
          var belum = data.sale.filter(function (j) {
            var st = j.statusKerja || statusSenarai(data.tetapan)[0];
            return st !== data.tetapan.statusSelesai && st !== data.tetapan.statusBatal;
          });
          var peta = {};
          var tambah = function (nama, jenis, job) {
            if (!nama) nama = "Belum ditugaskan";
            peta[nama] = peta[nama] || { report: [], submit: [] };
            peta[nama][jenis].push(job);
          };
          belum.forEach(function (j) {
            tambah(j.tugasReport, "report", j);
            tambah(j.tugasSubmit, "submit", j);
          });
          var kunci = Object.keys(peta);
          if (!kunci.length) return '<div class="kecil">Tiada tugasan tertunggak.</div>';
          return '<div class="jadual-bungkus"><table><thead><tr><th>Staf</th>' +
            "<th class='num'>Report</th><th class='num'>Submission</th><th>Butiran</th>" +
            "</tr></thead><tbody>" +
            kunci.sort().map(function (n) {
              var x = peta[n];
              var butiran = x.submit.map(function (j) {
                return j.nama + (j.jenisSubmit ? " (" + j.jenisSubmit + ")" : "");
              }).concat(x.report.map(function (j) { return j.nama + " — report"; }));
              return "<tr><td><b>" + esc(n) + "</b></td>" +
                '<td class="num">' + x.report.length + "</td>" +
                '<td class="num">' + x.submit.length + "</td>" +
                '<td class="bungkus kecil">' + esc(butiran.slice(0, 3).join(", ")) +
                (butiran.length > 3 ? " +" + (butiran.length - 3) : "") + "</td></tr>";
            }).join("") + "</tbody></table></div>";
        })() +

        '<div class="tajuk-seksyen">Nilai Site Ditugaskan</div>' +
        '<div class="jadual-bungkus"><table><thead><tr><th>Inspector</th>' +
          "<th class='num'>Site</th><th class='num'>Nilai Site</th><th class='num'>Purata / Site</th>" +
          "</tr></thead><tbody>" +
          (prestasi.length ? prestasi.map(function (x) {
            return "<tr><td><b>" + esc(x.nama) + '</b><div class="kecil">' + esc(x.jawatan) + "</div></td>" +
              '<td class="num">' + x.bil + "</td>" +
              '<td class="num"><b>' + esc(rm(x.nilai)) + "</b></td>" +
              '<td class="num">' + esc(x.bil ? rm(x.nilai / x.bil) : "-") + "</td></tr>";
          }).join("")
            : '<tr><td colspan="4" class="kecil">Tiada staf operasi.</td></tr>') +
          "</tbody></table></div>" +
      "</div>";

  $("#opSebelum").onclick = function () { opTarikh = tambahHari(opTarikh, -1); lukisOperasi(bekas); };
  $("#opSelepas").onclick = function () { opTarikh = tambahHari(opTarikh, 1); lukisOperasi(bekas); };
  $("#opIni").onclick = function () { opTarikh = kunciTarikh(); lukisOperasi(bekas); };
  $("#opPilihTarikh").onchange = function (e) { opTarikh = e.target.value; lukisOperasi(bekas); };
  $("#opCetak").onclick = function () { window.print(); };
  $("#opTambahJob").onclick = function () { borangSale(null, opTarikh); };

  $$(".opStatus", bekas).forEach(function (pilih) {
    pilih.onchange = function () {
      var d = baca();
      d.sale = d.sale.map(function (x) {
        if (x.id !== pilih.getAttribute("data-id")) return x;
        x.statusKerja = pilih.value;
        x.updatedAt = new Date().toISOString();
        return x;
      });
      if (!simpan(d)) return;
      toast("Status dikemas kini.", "ok");
      lukisOperasi(bekas);
    };
  });
  $$("[data-tugas]", bekas).forEach(function (b) {
    b.onclick = function () { borangInspektor(b.getAttribute("data-tugas"), bekas); };
  });
  $$("[data-lihat]", bekas).forEach(function (b) {
    b.onclick = function () { lihatSale(b.getAttribute("data-lihat")); };
  });
  $$("[data-hantar-op]", bekas).forEach(function (b) {
    b.onclick = function () { borangTugasan(b.getAttribute("data-hantar-op"), "inspection", null); };
  });
}

function jadualBeban(data, staf) {
  if (!staf.length) return kosong("Tiada staf aktif.");
  var hari = [];
  for (var i = 0; i < 7; i++) hari.push(tambahHari(opTarikh, i));

  return "<table><thead><tr><th>Staf</th>" +
    hari.map(function (t) {

function lukisStaf(bekas) {
  var data = baca();
  var staf = data.staf.slice().sort(function (a, b) {
    return String(a.nama || "").localeCompare(String(b.nama || ""));
  });
  var bulan = bulanKini();
  var jualan = kumpul(saleBulan(data, bulan), "closedBy");
  var petaJualan = {};
  jualan.forEach(function (x) { petaJualan[x.nama] = x; });

  bekas.innerHTML =
    '<div class="kad">' +
      '<div class="kad-tajuk"><h3>Senarai Staf</h3>' +
        '<div class="aksi"><button class="btn btn-utama" id="btnStafBaru">+ Tambah Staf</button>' +
        '<button class="btn btn-lembut" id="btnEksportStaf">Eksport CSV</button></div>' +
      "</div>" +
      '<p class="kecil">Staf kumpulan <b>Operasi</b> boleh ditugaskan untuk inspection; ' +
      "semua staf aktif muncul dalam pilihan “Closed By”. Jualan di bawah adalah untuk bulan " +
      esc(fmtBulan(bulan)) + ".</p>" +
      '<div class="jadual-bungkus">' +
      (staf.length ? "<table><thead><tr><th>Nama</th><th>Jawatan</th><th>Kumpulan</th>" +
        "<th>Telefon</th><th>Email</th><th>Mula Kerja</th><th class='num'>Jualan Bulan Ini</th>" +
        "<th>Status</th><th></th></tr></thead><tbody>" +
        staf.map(function (p) {
          var j = petaJualan[p.nama];
          return "<tr>" +
            "<td><b>" + esc(p.nama) + "</b></td>" +
            "<td>" + esc(p.jawatan || "-") + "</td>" +
            '<td><span class="badge ' + (p.kumpulan === "Operasi" ? "badge-ok" : "badge-muted") + '">' +
              esc(p.kumpulan || "-") + "</span></td>" +
            "<td>" + esc(p.telefon || "-") + "</td>" +
            '<td class="bungkus">' + esc(p.email || "-") + "</td>" +
            "<td>" + (p.tarikhMula ? esc(fmtTarikh(p.tarikhMula)) : "-") + "</td>" +
            '<td class="num">' + esc(rm(j ? j.total : 0)) +
              '<div class="kecil">' + (j ? j.bil : 0) + " job</div></td>" +
            '<td><span class="badge ' + (p.status === "aktif" ? "badge-ok" : "badge-muted") + '">' +
              (p.status === "aktif" ? "Aktif" : "Tidak Aktif") + "</span></td>" +
            '<td><div class="aksi">' +
              '<button class="btn btn-lembut" data-sunting-staf="' + esc(p.id) + '">Sunting</button>' +
              '<button class="btn btn-lembut" data-buang-staf="' + esc(p.id) + '">Padam</button>' +
            "</div></td></tr>";
        }).join("") + "</tbody></table>"
        : kosong("Belum ada staf. Tekan “+ Tambah Staf”.")) +
      "</div></div>";

  $("#btnStafBaru").onclick = function () { borangStaf(null); };
  $("#btnEksportStaf").onclick = function () {
    if (!staf.length) return toast("Tiada staf untuk dieksport.", "warn");
    csv("senarai-staf", ["Nama", "Jawatan", "Kumpulan", "Jabatan", "Telefon", "Email", "Mula Kerja", "Status"],
      staf.map(function (p) {
        return [p.nama, p.jawatan, p.kumpulan, p.jabatan, p.telefon, p.email, p.tarikhMula, p.status];
      }));
  };
  $$("[data-sunting-staf]", bekas).forEach(function (b) {
    b.onclick = function () { borangStaf(b.getAttribute("data-sunting-staf")); };
  });
  $$("[data-buang-staf]", bekas).forEach(function (b) {
    b.onclick = function () {
      var sid = b.getAttribute("data-buang-staf");
      sahkan("Padam staf ini? Rekod jualan lama tidak akan terjejas.").then(function (ya) {
        if (!ya) return;
        var d = baca();
        d.staf = d.staf.filter(function (x) { return x.id !== sid; });
        simpan(d);
        toast("Staf dipadam.", "ok");
        lukis();
      });
    };
  });
}

function borangStaf(stafId) {
  var data = baca();
  var p = stafId ? data.staf.filter(function (x) { return x.id === stafId; })[0] : null;
  var baru = !p;
  p = p || { status: "aktif" };

  var m = modal(baru ? "Tambah Staf" : "Sunting Staf",
    '<form id="borangStaf">' +
      '<div class="baris-medan">' +
        medan("Nama Penuh *", '<input type="text" name="nama" value="' + esc(p.nama || "") + '" required>') +
        medan("Jawatan", '<input type="text" name="jawatan" placeholder="Sales / Inspector / Admin" value="' + esc(p.jawatan || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Kumpulan *", "<select name='kumpulan'>" + KUMPULAN.map(function (g) {
          return "<option" + ((p.kumpulan || "Operasi") === g ? " selected" : "") + ">" + esc(g) + "</option>";
        }).join("") + "</select>") +
        medan("No. Telefon", '<input type="tel" name="telefon" value="' + esc(p.telefon || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Email", '<input type="email" name="email" value="' + esc(p.email || "") + '">') +
        medan("Tarikh Mula Kerja", '<input type="date" name="tarikhMula" value="' + esc(p.tarikhMula || "") + '">') +
      "</div>" +
      '<p class="kecil" style="margin:-6px 0 14px">Kumpulan <b>Operasi</b> = staf yang turun ke site ' +
      "(boleh ditugaskan untuk inspection). Kumpulan <b>Management</b> = pejabat, jualan, pentadbiran." +
      "</p>" +
      '<div class="baris-medan">' +
      "</div>" +
      medan("Status", "<select name='status'>" +
        "<option value='aktif'" + (p.status === "aktif" ? " selected" : "") + ">Aktif</option>" +
        "<option value='nonaktif'" + (p.status !== "aktif" ? " selected" : "") + ">Tidak Aktif</option></select>") +
      '<div class="baris-butang"><button type="button" class="btn btn-lembut" data-batal>Batal</button>' +
      '<button type="submit" class="btn btn-utama">' + (baru ? "Tambah" : "Kemas Kini") + "</button></div>" +
    "</form>", 560);

  $("[data-batal]", m.el).onclick = m.tutup;
  $("#borangStaf", m.el).onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangStaf", m.el));
    if (!nilai.nama) return toast("Sila isi nama staf.", "bad");
    nilai.telefon = telefonKemas(nilai.telefon);
    var d = baca();
    if (baru) {
      nilai.id = id();
      d.staf.push(nilai);
    } else {
      nilai.id = stafId;
      d.staf = d.staf.map(function (x) { return x.id === stafId ? nilai : x; });
    }
    if (!simpan(d)) return;
    m.tutup();
    toast(baru ? "Staf ditambah." : "Maklumat staf dikemas kini.", "ok");
    lukis();
  };
}

        '<p class="kecil">Logo dan tandatangan menggunakan URL gambar. Resit yang sudah dijana ' +
        "menyimpan salinan tetapan ini, jadi resit lama tidak berubah bila tetapan diubah.</p>" +
        '<div class="baris-butang"><button type="submit" class="btn btn-utama">Simpan Tetapan Resit</button></div>' +
      "</form>" +
    "</div>";

  $("#borangTetapan").onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangTetapan"));
    var d = baca();
    d.tetapan.namaSyarikat = nilai.namaSyarikat || "Syarikat Saya";
    d.tetapan.targetHarian = nom(nilai.targetHarian);
    d.tetapan.hariBekerja = $$(".hariBekerja").filter(function (c) { return c.checked; })
      .map(function (c) { return parseInt(c.value, 10); });
    d.tetapan.projek = pecahBaris(nilai.projek);
    d.tetapan.sumber = pecahBaris(nilai.sumber);
    var statusBaharu = pecahBaris(nilai.statusKerja);
    if (statusBaharu.length < 2) return toast("Senarai status perlu sekurang-kurangnya 2 status.", "bad");
    d.tetapan.statusKerja = statusBaharu;
    d.tetapan.statusSelesai = statusBaharu.indexOf(nilai.statusSelesai) !== -1
      ? nilai.statusSelesai : statusBaharu[statusBaharu.length - 2];
    d.tetapan.statusBatal = statusBaharu.indexOf(nilai.statusBatal) !== -1
      ? nilai.statusBatal : statusBaharu[statusBaharu.length - 1];
    d.tetapan.tempohPendingHari = Math.max(0, nom(nilai.tempohPendingHari));
    if (!simpan(d)) return;
    toast("Tetapan disimpan.", "ok");
    lukis();
  };

  $("#borangResitTetapan").onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangResitTetapan"));
    var d = baca();
    Object.keys(nilai).forEach(function (kunci) {
      d.tetapan.resit[kunci] = ["nombor", "nomborInvois"].indexOf(kunci) !== -1
        ? Math.max(1, nom(nilai[kunci]))
        : (kunci === "tempohHari" ? Math.max(0, nom(nilai[kunci])) : nilai[kunci]);
    });
    if (!simpan(d)) return;
    toast("Tetapan resit disimpan.", "ok");
    lukis();
  };

  $("#borangTargetBulan").onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangTargetBulan"));
    if (!nilai.bulan) return toast("Sila pilih bulan.", "bad");
    var d = baca();
    d.tetapan.targetBulan = d.tetapan.targetBulan || {};
    d.tetapan.targetBulan[nilai.bulan] = nom(nilai.jumlah);
    if (!simpan(d)) return;
    toast("Target " + fmtBulan(nilai.bulan) + " ditetapkan: " + rm(nilai.jumlah), "ok", 4000);
    lukis();
  };
  $$("[data-buang-target]").forEach(function (b) {
    b.onclick = function () {
      var d = baca();
      delete d.tetapan.targetBulan[b.getAttribute("data-buang-target")];
      simpan(d);
      toast("Target khas dibuang. Bulan itu kembali ke kiraan automatik.", "ok", 4000);
      lukis();
    };
  });

  $("#borangCuti").onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangCuti"));
    if (!nilai.tarikh) return toast("Sila pilih tarikh.", "bad");
    var d = baca();
    d.tetapan.cuti = (d.tetapan.cuti || []).filter(function (c) { return c.tarikh !== nilai.tarikh; });
    d.tetapan.cuti.push({ tarikh: nilai.tarikh, sebab: nilai.sebab || "Offday" });
    if (!simpan(d)) return;
    toast("Hari cuti ditambah.", "ok");
    lukis();
  };

  $$("[data-buang-cuti]").forEach(function (b) {
    b.onclick = function () {
      var d = baca();
      d.tetapan.cuti = (d.tetapan.cuti || []).filter(function (c) {
        return c.tarikh !== b.getAttribute("data-buang-cuti");
      });
      simpan(d);
      lukis();
    };
  });

  $("#btnBackup").onclick = function () {
    muatTurun("backup-sistem-" + kunciTarikh() + ".json",
      JSON.stringify(baca(), null, 2), "application/json");
    toast("Backup dimuat turun.", "ok");
  };

  $("#btnPulih").onclick = function () { $("#failPulih").click(); };
  $("#failPulih").onchange = function (e) {
    var fail = e.target.files[0];
    if (!fail) return;
    var pembaca = new FileReader();
    pembaca.onload = function () {
      try {
        var masuk = JSON.parse(pembaca.result);
        if (!masuk || !Array.isArray(masuk.sale)) throw new Error("Format fail tidak dikenali.");
        sahkan("Pulih data dari fail ini? Semua data semasa akan diganti.").then(function (ya) {
          if (!ya) return;
          simpan(masuk);
          toast("Data dipulihkan.", "ok");
          lukis();
        });
      } catch (err) {
        toast("Gagal baca fail: " + err.message, "bad", 5000);
      }
    };
    pembaca.readAsText(fail);
    e.target.value = "";
  };

  $("#btnPadamSemua").onclick = function () {
    sahkan("Padam SEMUA data jualan, staf dan tetapan? Buat backup dahulu jika perlu.").then(function (ya) {
      if (!ya) return;
      localStorage.removeItem(KUNCI);
      benihkan();
      toast("Semua data dipadam.", "ok");
      lukis();
    });
  };
}

function pecahBaris(teks) {
  return String(teks || "").split("\n").map(function (x) { return x.trim(); })
    .filter(function (x, i, arr) { return x && arr.indexOf(x) === i; });
}

/* ======================================================================
   MENU & PENGHALAAN
   ================================================================== */
var IKON = {
  papan: '<svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  sale: '<svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15l-2.5-1.5L14 21l-2.5-1.5L9 21l-2.5-1.5L4 21V4a1 1 0 0 1 1-1z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  operasi: '<svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
  subjob: '<svg viewBox="0 0 24 24"><path d="M3 7h7l2 2h9v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M8 13h8"/></svg>',
  invois: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>',
  resit: '<svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>',
  staf: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6"/><path d="M17.5 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>',
  tetapan: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.54h.09A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.46 9v.09a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>'
};

var HALAMAN = [
  { id: "papan",   label: "Papan Utama",  ikon: IKON.papan,   lukis: lukisPapan },
  { id: "sale",    label: "Key-in Sale",  ikon: IKON.sale,    lukis: lukisSale },
  { id: "operasi", label: "Operasi",      ikon: IKON.operasi, lukis: lukisOperasi },
  { id: "subjob",  label: "Sub Job",      ikon: IKON.subjob,  lukis: lukisSubJob },
  { id: "invois",  label: "Invois",       ikon: IKON.invois,  lukis: lukisInvois },
  { id: "resit",   label: "Resit",        ikon: IKON.resit,   lukis: lukisResit },
  { id: "staf",    label: "Staf",         ikon: IKON.staf,    lukis: lukisStaf },
  { id: "tetapan", label: "Tetapan",      ikon: IKON.tetapan, lukis: lukisTetapan }
];

function halamanSemasa() {
  var h = (location.hash || "").replace(/^#\/?/, "") || "papan";
  return HALAMAN.filter(function (x) { return x.id === h; })[0] || HALAMAN[0];
}

function binaMenu() {
  var data = baca();
  var hariIni = kunciTarikh();
  var perluTindakan = data.sale.filter(function (s) {
    return s.tarikh <= hariIni && ["Selesai", "Batal", "Report Submit"].indexOf(s.statusKerja || "Tempahan") === -1;
  }).length;

  $("#navMenu").innerHTML = HALAMAN.map(function (h) {
    return '<a class="nav-item" href="#/' + h.id + '" data-nav="' + h.id + '">' +
      '<span class="nav-ikon">' + h.ikon + "</span><span>" + esc(h.label) + "</span>" +
      (h.id === "sale" && perluTindakan ? '<span class="lencana-menu">' + perluTindakan + "</span>" : "") +
      "</a>";
  }).join("");
  $$("#navMenu a").forEach(function (a) {
    a.onclick = function () { $("#sisi").classList.remove("buka"); };
  });
  $("#sisiSyarikat").textContent = data.tetapan.namaSyarikat;
}

function lukis() {
  CFG = null;                     // tetapan mungkin berubah antara paparan
  var h = halamanSemasa();
  binaMenu();
  $$("[data-nav]").forEach(function (a) {
    a.classList.toggle("aktif", a.getAttribute("data-nav") === h.id);
  });
  $("#tajukHalaman").textContent = h.label;
  var bekas = $("#kandungan");
  bekas.innerHTML = "";
  try {
    h.lukis(bekas);
  } catch (err) {
    bekas.innerHTML = '<div class="kad ralat"><h3>Ralat memaparkan halaman</h3><p>' +
      esc(err.message) + "</p></div>";
    console.error(err);
  }
}

function mulakan() {
  benihkan();
  $("#btnMenu").onclick = function () { $("#sisi").classList.toggle("buka"); };
  $("#litup").onclick = function () { $("#sisi").classList.remove("buka"); };
  window.addEventListener("hashchange", lukis);
  lukis();
}

mulakan();
</script>
</body>
</html>
