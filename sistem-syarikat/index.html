<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sistem Pengurusan Syarikat</title>
<style>
/* ============================ GAYA ============================ */
:root{
  --bg:#f1f5f9; --kad:#fff; --teks:#0f172a; --lembut:#64748b; --garis:#e2e8f0;
  --utama:#2563eb; --utama2:#1d4ed8; --gelap:#0f172a;
  --ok:#16a34a; --okbg:#dcfce7; --warn:#d97706; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2;
  --bayang:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06); --bulat:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0 0 12px;line-height:1.25}
a{color:var(--utama)}
[hidden]{display:none!important}

/* --- skrin log masuk --- */
.skrin-log{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#1e293b,#0f172a 55%,#1e3a8a)}
.kad-log{width:100%;max-width:420px;background:var(--kad);border-radius:18px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.kad-log.tengah{text-align:center}
.log-jenama{text-align:center;margin-bottom:22px}
.log-jenama h1{font-size:20px;margin:12px 0 4px}
.log-jenama p{margin:0;color:var(--lembut);font-size:13px}
.logo{width:54px;height:54px;margin:0 auto;border-radius:16px;background:var(--utama);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.logo.kecil{width:38px;height:38px;font-size:14px;border-radius:11px;margin:0}
.tab-baris{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font:inherit;font-weight:600;color:var(--lembut);cursor:pointer}
.tab.aktif{background:var(--kad);color:var(--teks);box-shadow:var(--bayang)}

/* --- borang --- */
label{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--lembut)}
input,select,textarea{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--garis);border-radius:10px;font:inherit;color:var(--teks);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--utama);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:middle}
.nota{font-size:12px;color:var(--lembut);text-align:center;margin:14px 0 0}
.baris-medan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* --- butang --- */
.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--bg);color:var(--teks)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-utama{background:var(--utama);color:#fff}
.btn-utama:hover:not(:disabled){background:var(--utama2)}
.btn-lembut{background:#fff;border-color:var(--garis)}
.btn-lembut:hover:not(:disabled){background:var(--bg)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-kecil{padding:6px 11px;font-size:13px;border-radius:8px}
.penuh{width:100%;display:block}
.baris-butang{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn-ikon{border:0;background:transparent;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;color:var(--teks)}

/* --- rangka --- */
.rangka{display:flex;min-height:100vh}
.sisi{width:252px;flex:0 0 252px;background:var(--gelap);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sisi-atas{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid #1e293b}
.sisi-syarikat{font-weight:700;color:#fff;font-size:14px}
.sisi-sub{font-size:11px;color:#64748b}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:500;margin-bottom:3px}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.aktif{background:var(--utama);color:#fff}
.nav-ikon{width:20px;text-align:center}
.lencana-menu{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.sisi-bawah{padding:14px;border-top:1px solid #1e293b}
.pengguna{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--utama);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 36px}
.pengguna-nama{color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pengguna-peranan{font-size:11px;color:#64748b}
.litup{display:none}
.utama{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-atas{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--kad);border-bottom:1px solid var(--garis);position:sticky;top:0;z-index:10}
.bar-atas h2{margin:0;font-size:18px}
.bar-atas .btn-ikon{display:none}
.kandungan{padding:22px;flex:1}

/* --- kad & jadual --- */
.kad{background:var(--kad);border:1px solid var(--garis);border-radius:var(--bulat);padding:18px;box-shadow:var(--bayang);margin-bottom:18px}
.kad-tajuk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kad-tajuk h3{margin:0;font-size:16px}
.grid{display:grid;gap:14px;margin-bottom:18px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--kad);border:1px solid var(--garis);border-radius:var(--bulat);padding:16px;box-shadow:var(--bayang)}
.stat-label{font-size:12px;color:var(--lembut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat-nilai{font-size:26px;font-weight:700;margin-top:6px}
.stat-nota{font-size:12px;color:var(--lembut);margin-top:4px}
.jadual-bungkus{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--garis);white-space:nowrap;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--lembut);background:#f8fafc}
tbody tr:hover{background:#f8fafc}
td.bungkus{white-space:normal;min-width:130px;max-width:210px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-ok{background:var(--okbg);color:var(--ok)}
.badge-warn{background:var(--warnbg);color:var(--warn)}
.badge-bad{background:var(--badbg);color:var(--bad)}
.badge-muted{background:var(--bg);color:var(--lembut)}
.kosong{padding:30px;text-align:center;color:var(--lembut)}
.kecil{font-size:12px;color:var(--lembut)}
.penapis{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.penapis label{margin:0}
.senarai-item{padding:12px 0;border-bottom:1px solid var(--garis)}
.senarai-item:last-child{border-bottom:0}

/* --- jam --- */
.jam-kad{text-align:center}
.jam-besar{font-size:40px;font-weight:700;letter-spacing:1px}
.jam-tarikh{color:var(--lembut);margin-bottom:16px}
.jam-butang{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.jam-butang .btn{min-width:150px;padding:14px 18px;font-size:16px}

/* --- modal & toast --- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal-kad{width:100%;background:var(--kad);border-radius:16px;max-height:90vh;overflow-y:auto}
.modal-tajuk{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--garis);position:sticky;top:0;background:var(--kad)}
.modal-tajuk h3{margin:0;font-size:16px}
.modal-tutup{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--lembut)}
.modal-isi{padding:18px}
.toast-box{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;display:grid;gap:8px}
.toast{background:var(--gelap);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:var(--bayang);font-size:14px;max-width:90vw;animation:naik .2s ease}
.toast-ok{background:var(--ok)}.toast-bad{background:var(--bad)}.toast-warn{background:var(--warn)}
@keyframes naik{from{opacity:0;transform:translateY(8px)}}

/* --- ikon & kawalan paparan --- */
.nav-ikon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px}
.nav-ikon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.suis{display:inline-flex;background:var(--bg);border:1px solid var(--garis);border-radius:10px;padding:3px}
.suis button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--lembut);cursor:pointer}
.suis button.aktif{background:#fff;color:var(--teks);box-shadow:0 1px 2px rgba(15,23,42,.1)}

/* --- kalendar --- */
.kal-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kal-nav{display:flex;align-items:center;gap:8px}
.kal-nav h3{margin:0;font-size:17px;min-width:170px;text-align:center}
.kal-nav button{border:1px solid var(--garis);background:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1;color:var(--teks)}
.kal-nav button:hover{background:var(--bg)}
.petunjuk{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--lembut);align-items:center}
.petunjuk i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kal-luar-bungkus{overflow-x:auto}
.kal{display:grid;grid-template-columns:repeat(7,minmax(132px,1fr));gap:1px;background:var(--garis);border:1px solid var(--garis);border-radius:12px;overflow:hidden}
.kal-kepala{background:#f8fafc;padding:9px 10px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--lembut);text-align:center}
.kal-hari{background:#fff;min-height:118px;padding:8px;position:relative;cursor:pointer;transition:background .12s}
.kal-hari:hover{background:#f8fafc}
.kal-hari.kal-luar{background:#fafbfc;color:#cbd5e1;cursor:default}
.kal-hari.kal-luar:hover{background:#fafbfc}
.kal-hari.kal-cuti{background:#fbfcfd}
.kal-hari.kal-ini{box-shadow:inset 0 0 0 2px var(--utama)}
.kal-hari.kal-capai{box-shadow:inset 3px 0 0 var(--ok)}
.kal-atas{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:6px}
.kal-tarikh{font-size:13px;font-weight:700}
.kal-nama-hari{display:none;margin-left:7px;font-weight:500;color:var(--lembut)}
.kal-nav button{white-space:nowrap}
.kal-hari.kal-ini .kal-tarikh{color:var(--utama)}
.kal-sasar{font-size:10px;color:var(--lembut);text-transform:uppercase;letter-spacing:.3px}
.kal-job{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--utama);background:#eff6ff;border-radius:0 6px 6px 0;padding:4px 6px;margin-bottom:4px;font:inherit;font-size:11.5px;line-height:1.35;cursor:pointer;color:var(--teks)}
.kal-job:hover{background:#dbeafe}
.kal-job.j-selesai{border-left-color:var(--ok);background:#f0fdf4}
.kal-job.j-selesai:hover{background:#dcfce7}
.kal-job.j-submit{border-left-color:var(--warn);background:#fffbeb}
.kal-job.j-submit:hover{background:#fef3c7}
.kal-job.j-batal{border-left-color:var(--bad);background:#fef2f2;text-decoration:line-through;opacity:.7}
.kal-job b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kal-job span{color:var(--lembut)}
.kal-lagi{font-size:11px;color:var(--utama);font-weight:600;padding:2px 6px}
.kal-jumlah{position:absolute;left:8px;right:8px;bottom:6px;font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kal-jumlah.kurang{color:var(--lembut)}
.kal-jumlah.capai{color:var(--ok)}
.kal-hari.ada-job{padding-bottom:22px}
.kal-cuti-label{font-size:10px;font-weight:700;color:var(--lembut);text-transform:uppercase;letter-spacing:.4px}
@media(max-width:760px){
  .kal{grid-template-columns:1fr;gap:0}
  .kal-kepala{display:none}
  .kal-hari{min-height:0;border-bottom:1px solid var(--garis);display:flex;flex-direction:column}
  .kal-hari.kal-luar{display:none}
  .kal-hari.kal-lompang{display:none}
  .kal-nama-hari{display:inline;font-size:12px}
  .kal-nav{width:100%;justify-content:space-between}
  .kal-nav h3{min-width:0;flex:1}
  .kal-jumlah{position:static;text-align:left;margin-top:4px}
  .kal-hari.ada-job{padding-bottom:8px}
}
@media print{.kal-hari{break-inside:avoid}.suis,.kal-nav button{display:none!important}}

/* --- telefon --- */
@media(max-width:860px){
  .sisi{position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .22s ease}
  .sisi.buka{transform:none}
  .sisi.buka~.litup{display:block;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:30}
  .bar-atas .btn-ikon{display:block}
  .kandungan{padding:14px}
  .jam-besar{font-size:34px}
}
@media print{.sisi,.bar-atas,.btn,.penapis{display:none!important}.kandungan{padding:0}.kad{box-shadow:none;page-break-inside:avoid}}

/* --- tambahan --- */
.bar-progres{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:10px}
.bar-progres > span{display:block;height:100%;background:var(--utama);border-radius:999px;transition:width .3s}
.bar-progres.penuh > span{background:var(--ok)}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--garis);font-size:12px;font-weight:600;margin:0 6px 6px 0}
.aksi{display:flex;gap:6px}
.aksi .btn{padding:5px 8px;font-size:12px;border-radius:7px;white-space:nowrap}
.tajuk-seksyen{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--lembut);margin:18px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--garis)}
.tajuk-seksyen:first-child{margin-top:0}
.jumlah-baris{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--garis);font-size:14px}
.jumlah-baris:last-child{border-bottom:0}
.jumlah-baris b{font-variant-numeric:tabular-nums}
.kunci-nilai{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kunci-nilai dt{color:var(--lembut);font-weight:600}
.kunci-nilai dd{margin:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tanpa-margin{margin-bottom:0}
.senarai-cuti{display:flex;flex-wrap:wrap;gap:8px}
.senarai-cuti .chip button{border:0;background:transparent;color:var(--bad);cursor:pointer;font-weight:700;margin-left:4px}
.papar-cetak{display:none}
@media print{
  .papar-cetak{display:block;margin-bottom:14px}
  .kad-tajuk .penapis,.aksi,.kad-tajuk .btn{display:none!important}
  body{background:#fff}
}
</style>
</head>
<body>

<div class="rangka">
  <aside id="sisi" class="sisi">
    <div class="sisi-atas">
      <div class="logo kecil">GH</div>
      <div>
        <div id="sisiSyarikat" class="sisi-syarikat">Syarikat</div>
        <div class="sisi-sub">Sistem Pengurusan</div>
      </div>
    </div>
    <nav id="navMenu" class="nav"></nav>
    <div class="sisi-bawah">
      <div class="pengguna">
        <div class="avatar">A</div>
        <div>
          <div class="pengguna-nama">Admin</div>
          <div class="pengguna-peranan">Pentadbir</div>
        </div>
      </div>
      <div class="kecil" style="color:#64748b">Data disimpan dalam pelayar ini</div>
    </div>
  </aside>

  <div id="litup" class="litup"></div>

  <main class="utama">
    <header class="bar-atas">
      <button id="btnMenu" class="btn-ikon" type="button" aria-label="Menu">&#9776;</button>
      <h2 id="tajukHalaman">Papan Utama</h2>
    </header>
    <div id="kandungan" class="kandungan"></div>
  </main>
</div>

<script>
"use strict";
/* =========================================================================
   SISTEM PENGURUSAN SYARIKAT — satu fail, tiada pemasangan.
   Data disimpan dalam localStorage pelayar. Gunakan Tetapan > Backup untuk
   simpan salinan fail JSON.
   ====================================================================== */

var KUNCI = "sps_data_v1";

var TETAPAN_ASAL = {
  namaSyarikat: "Go Home Inspection",
  targetHarian: 600,
  hariBekerja: [1, 2, 3, 4, 5, 6],           // 0=Ahad, 1=Isnin ... 6=Sabtu
  projek: ["Panorama", "Impian Emas", "Pulai Mutiara 2", "Clover Pulai Mutiara",
           "Sierra Height", "Midas Seri Alam", "Kempas Utama", "Batu Pahat", "Jasin Melaka"],
  sumber: ["Facebook", "WhatsApp", "Referral", "Walk-in", "Google", "Repeat Client"],
  cuti: []                                    // [{tarikh:"2025-01-29", sebab:"Tahun Baru Cina"}]
};

var STATUS_KERJA = ["Tempahan", "Inspection Siap", "Report Submit", "Selesai", "Batal"];

/* ----------------------------- simpanan ------------------------------- */
function baca() {
  var mentah = null;
  try { mentah = JSON.parse(localStorage.getItem(KUNCI)); } catch (e) { mentah = null; }
  if (!mentah || typeof mentah !== "object") {
    mentah = { tetapan: {}, staf: [], sale: [] };
  }
  mentah.tetapan = Object.assign({}, TETAPAN_ASAL, mentah.tetapan || {});
  mentah.staf = mentah.staf || [];
  mentah.sale = mentah.sale || [];
  return mentah;
}

function simpan(data) {
  try {
    localStorage.setItem(KUNCI, JSON.stringify(data));
    return true;
  } catch (e) {
    toast("Gagal simpan data: " + e.message, "bad", 6000);
    return false;
  }
}

function benihkan() {
  if (localStorage.getItem(KUNCI)) return;
  var data = { tetapan: Object.assign({}, TETAPAN_ASAL), staf: [
    { id: id(), nama: "Dastie", jawatan: "Sales", jabatan: "Jualan", telefon: "", email: "", status: "aktif", tarikhMula: "" },
    { id: id(), nama: "Ummi", jawatan: "Sales", jabatan: "Jualan", telefon: "", email: "", status: "aktif", tarikhMula: "" }
  ], sale: [] };
  simpan(data);
}

/* ------------------------------ bantuan ------------------------------- */
function id() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function nom(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

function rm(n) {
  return "RM " + nom(n).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function kunciTarikh(d) {
  d = d || new Date();
  var p = function (x) { return String(x).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

var NAMA_HARI = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
var NAMA_BULAN = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai",
                  "Ogos", "September", "Oktober", "November", "Disember"];

function keDate(t) { var d = new Date(t + "T00:00:00"); return isNaN(d) ? null : d; }
function namaHari(t) { var d = keDate(t); return d ? NAMA_HARI[d.getDay()] : "-"; }

function fmtTarikh(t) {
  var d = keDate(t);
  if (!d) return "-";
  return d.getDate() + " " + NAMA_BULAN[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
}

function fmtBulan(b) {
  var bhg = String(b || "").split("-");
  if (bhg.length < 2) return b;
  return NAMA_BULAN[parseInt(bhg[1], 10) - 1] + " " + bhg[0];
}

function bulanKini() { return kunciTarikh().slice(0, 7); }

function telefonKemas(t) {
  var bersih = String(t || "").replace(/[^\d+]/g, "");
  if (/^01\d{8,9}$/.test(bersih)) return bersih.slice(0, 3) + "-" + bersih.slice(3);
  if (/^0\d{8,9}$/.test(bersih)) return bersih.slice(0, 2) + "-" + bersih.slice(2);
  return String(t || "").trim();
}

function toast(mesej, jenis, ms) {
  var kotak = $("#toastBox");
  if (!kotak) {
    kotak = document.createElement("div");
    kotak.id = "toastBox";
    kotak.className = "toast-box";
    document.body.appendChild(kotak);
  }
  var t = document.createElement("div");
  t.className = "toast toast-" + (jenis || "info");
  t.textContent = mesej;
  kotak.appendChild(t);
  setTimeout(function () { t.remove(); }, ms || 3200);
}

function modal(tajuk, kandungan, lebar) {
  var bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal-kad" style="max-width:' + (lebar || 620) + 'px">' +
    '<div class="modal-tajuk"><h3>' + esc(tajuk) + '</h3>' +
    '<button class="modal-tutup" type="button" aria-label="Tutup">&times;</button></div>' +
    '<div class="modal-isi"></div></div>';
  $(".modal-isi", bg).innerHTML = kandungan;
  var tutup = function () { bg.remove(); };
  $(".modal-tutup", bg).onclick = tutup;
  bg.addEventListener("click", function (e) { if (e.target === bg) tutup(); });
  document.body.appendChild(bg);
  return { el: bg, tutup: tutup };
}

function sahkan(mesej) {
  return new Promise(function (resolve) {
    var m = modal("Pengesahan",
      '<p style="margin:0 0 18px">' + esc(mesej) + '</p>' +
      '<div class="baris-butang"><button class="btn btn-lembut" data-batal>Batal</button>' +
      '<button class="btn btn-bad" data-ok>Ya, teruskan</button></div>', 420);
    $("[data-batal]", m.el).onclick = function () { m.tutup(); resolve(false); };
    $("[data-ok]", m.el).onclick = function () { m.tutup(); resolve(true); };
  });
}

function muatTurun(namaFail, kandungan, jenis) {
  var blob = new Blob([kandungan], { type: jenis || "text/plain;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = namaFail;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function csv(namaFail, tajuk, baris) {
  var bersih = function (v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  var teks = [tajuk].concat(baris).map(function (r) { return r.map(bersih).join(","); }).join("\r\n");
  muatTurun(namaFail + ".csv", "﻿" + teks, "text/csv;charset=utf-8;");
}

function kosong(mesej) { return '<div class="kosong">' + esc(mesej || "Tiada rekod.") + "</div>"; }

/* --------------------------- kiraan sale ------------------------------ */
function kiraSale(s) {
  var total = nom(s.harga) + nom(s.water) + nom(s.electric);
  var dibayar = nom(s.deposit) + nom(s.finalPayment);
  var baki = Math.round((total - dibayar) * 100) / 100;
  var statusBayar = total > 0 && baki <= 0 ? "lunas" : (dibayar > 0 ? "deposit" : "belum");
  return { total: total, dibayar: dibayar, baki: baki, statusBayar: statusBayar };
}

function lencanaBayar(k) {
  if (k.statusBayar === "lunas") return '<span class="badge badge-ok">Lunas</span>';
  if (k.statusBayar === "deposit") return '<span class="badge badge-warn">Baki ' + esc(rm(k.baki)) + "</span>";
  return '<span class="badge badge-bad">Belum bayar</span>';
}

function lencanaKerja(status) {
  var peta = { "Tempahan": "muted", "Inspection Siap": "warn", "Report Submit": "warn", "Selesai": "ok", "Batal": "bad" };
  return '<span class="badge badge-' + (peta[status] || "muted") + '">' + esc(status || "Tempahan") + "</span>";
}

function targetHari(tarikh, tetapan) {
  var d = keDate(tarikh);
  if (!d) return 0;
  var cuti = (tetapan.cuti || []).some(function (c) { return c.tarikh === tarikh; });
  if (cuti) return 0;
  if ((tetapan.hariBekerja || []).indexOf(d.getDay()) === -1) return 0;
  return nom(tetapan.targetHarian);
}

function targetBulan(bulan, tetapan) {
  var bhg = bulan.split("-");
  var tahun = parseInt(bhg[0], 10), bln = parseInt(bhg[1], 10);
  var hariAkhir = new Date(tahun, bln, 0).getDate();
  var jumlah = 0;
  for (var h = 1; h <= hariAkhir; h++) {
    var p = function (x) { return String(x).padStart(2, "0"); };
    jumlah += targetHari(tahun + "-" + p(bln) + "-" + p(h), tetapan);
  }
  return jumlah;
}

function saleBulan(data, bulan) {
  return data.sale.filter(function (s) {
    return String(s.tarikh || "").slice(0, 7) === bulan && s.statusKerja !== "Batal";
  });
}

function ringkasan(senarai) {
  var r = { bil: senarai.length, total: 0, dibayar: 0, baki: 0 };
  senarai.forEach(function (s) {
    var k = kiraSale(s);
    r.total += k.total; r.dibayar += k.dibayar; r.baki += k.baki;
  });
  return r;
}

/* ======================================================================
   HALAMAN 1 — PAPAN UTAMA
   ================================================================== */
var papanBulan = bulanKini();

function lukisPapan(bekas) {
  var data = baca();

  var belumSubmit = data.sale.filter(function (s) {

           s.statusKerja !== "Report Submit";
  }).sort(function (a, b) { return String(a.tarikh).localeCompare(String(b.tarikh)); });

  var adaBaki = senarai.filter(function (s) { return kiraSale(s).baki > 0; })

    '</div>' +

    '<div class="grid grid-4">' +
      kadStat("Jualan " + fmtBulan(papanBulan), rm(r.total), r.bil + " job direkod") +
      kadStat("Deposit Dikutip", rm(r.dibayar), "termasuk bayaran penuh") +
      kadStat("Baki Belum Kutip", rm(r.baki), adaBaki.length + " job ada baki") +
      '<div class="stat"><div class="stat-label">Capai Target</div>' +
        '<div class="stat-nilai">' + peratus + '%</div>' +
        '<div class="stat-nota">' + esc(rm(bakiTarget)) + ' lagi ke ' + esc(rm(sasar)) + '</div>' +
        '<div class="bar-progres' + (peratus >= 100 ? " penuh" : "") + '"><span style="width:' + peratus + '%"></span></div>' +
      "</div>" +
    "</div>" +

    '<div class="grid grid-2">' +
      '<div class="kad tanpa-margin">' +
        '<div class="kad-tajuk"><h3>Hari Ini — ' + esc(namaHari(hariIni)) + ", " + esc(fmtTarikh(hariIni)) + "</h3>" +
          (sasarHariIni === 0 ? '<span class="badge badge-muted">Hari cuti</span>'
            : '<span class="badge ' + (saleHariIni.total >= sasarHariIni ? "badge-ok" : "badge-warn") + '">' +
              esc(rm(saleHariIni.total)) + " / " + esc(rm(sasarHariIni)) + "</span>") +
        "</div>" +
        (jobHariIni.length ? jobHariIni.map(function (s) {
          var k = kiraSale(s);
          return '<div class="senarai-item"><div style="display:flex;justify-content:space-between;gap:10px">' +
            "<div><b>" + esc(s.masaMula || "-") + (s.masaTamat ? " – " + esc(s.masaTamat) : "") + "</b> · " +
            esc(s.nama || "Tanpa nama") + '<div class="kecil">' + esc(s.projek || "-") +
            (s.unit ? " · " + esc(s.unit) : "") + "</div></div>" +
            '<div style="text-align:right"><b>' + esc(rm(k.total)) + "</b><br>" + lencanaKerja(s.statusKerja) + "</div>" +
            "</div></div>";
        }).join("") : kosong("Tiada job hari ini.")) +
      "</div>" +

      '<div class="kad tanpa-margin">' +
        '<div class="kad-tajuk"><h3>Perlu Tindakan</h3></div>' +
        '<div class="tajuk-seksyen">Report belum submit (' + belumSubmit.length + ")</div>" +
        (belumSubmit.length ? belumSubmit.slice(0, 6).map(function (s) {
          return '<div class="jumlah-baris"><span>' + esc(fmtTarikh(s.tarikh)) + " · " + esc(s.nama) +
            "</span>" + lencanaKerja(s.statusKerja) + "</div>";
        }).join("") : '<div class="kecil">Semua report sudah submit.</div>') +
        '<div class="tajuk-seksyen">Baki belum kutip (' + adaBaki.length + ")</div>" +
        (adaBaki.length ? adaBaki.slice(0, 6).map(function (s) {
          return '<div class="jumlah-baris"><span>' + esc(s.nama) + '<span class="kecil"> · ' +
            esc(fmtTarikh(s.tarikh)) + "</span></span><b>" + esc(rm(kiraSale(s).baki)) + "</b></div>";
        }).join("") : '<div class="kecil">Tiada baki tertunggak.</div>') +
      "</div>" +
    "</div>" +

    '<div class="grid grid-2">' +
      kadPrestasi("Jualan Ikut Sales", ikutSales, sasar) +

    "</div>";

  $("#papanBulan").onchange = function (e) { papanBulan = e.target.value; lukisPapan(bekas); };
  $("#btnCepatSale").onclick = function () { borangSale(null); };

function kadStat(label, nilai, nota) {
  return '<div class="stat"><div class="stat-label">' + esc(label) + "</div>" +
    '<div class="stat-nilai">' + esc(nilai) + "</div>" +
    '<div class="stat-nota">' + esc(nota || "") + "</div></div>";
}

function kumpul(senarai, medan) {
  var peta = {};
  senarai.forEach(function (s) {
    var kunci = (s[medan] || "Tidak dinyatakan").trim() || "Tidak dinyatakan";
    if (!peta[kunci]) peta[kunci] = { nama: kunci, bil: 0, total: 0 };
    peta[kunci].bil++;
    peta[kunci].total += kiraSale(s).total;
  });
  return Object.keys(peta).map(function (k) { return peta[k]; })
    .sort(function (a, b) { return b.total - a.total; });
}

function kadPrestasi(tajuk, senarai, sasar) {
  var tertinggi = senarai.length ? senarai[0].total : 0;
  return '<div class="kad tanpa-margin"><div class="kad-tajuk"><h3>' + esc(tajuk) + "</h3>" +
    (sasar ? '<span class="kecil">Target bulan: ' + esc(rm(sasar)) + "</span>" : "") + "</div>" +
    (senarai.length ? senarai.map(function (x) {
      var lebar = tertinggi > 0 ? Math.round((x.total / tertinggi) * 100) : 0;
      return '<div class="senarai-item"><div class="jumlah-baris" style="border:0;padding:0">' +
        "<span><b>" + esc(x.nama) + '</b> <span class="kecil">· ' + x.bil + " job</span></span>" +
        "<b>" + esc(rm(x.total)) + "</b></div>" +
        '<div class="bar-progres"><span style="width:' + lebar + '%"></span></div></div>';
    }).join("") : kosong("Tiada data untuk bulan ini.")) + "</div>";
}

/* ======================================================================

   ================================================================== */
var tapis = { bulan: bulanKini(), cari: "", kerja: "", sales: "" };
var paparanSale = "kalendar";   // "kalendar" atau "senarai"

function saleDitapis(data) {
  var teks = tapis.cari.trim().toLowerCase();
  return data.sale.filter(function (s) {
    if (tapis.bulan && String(s.tarikh || "").slice(0, 7) !== tapis.bulan) return false;
    if (tapis.kerja && (s.statusKerja || "Tempahan") !== tapis.kerja) return false;
    if (tapis.sales && s.closedBy !== tapis.sales) return false;
    if (teks) {
      var gabung = [s.nama, s.telefon, s.email, s.unit, s.projek, s.size, s.catatan,
                    s.invois1, s.invois2].join(" ").toLowerCase();
      if (gabung.indexOf(teks) === -1) return false;
    }
    return true;
  }).sort(function (a, b) {
    var c = String(b.tarikh).localeCompare(String(a.tarikh));
    return c !== 0 ? c : String(a.masaMula).localeCompare(String(b.masaMula));
  });
}

function lukisSale(bekas) {
  var data = baca();
  var senarai = saleDitapis(data);
  var r = ringkasan(senarai.filter(function (s) { return s.statusKerja !== "Batal"; }));
  var sasar = targetBulan(tapis.bulan, data.tetapan);
  var namaSales = data.staf.filter(function (s) { return s.status === "aktif"; })
    .map(function (s) { return s.nama; });

    '<div class="papar-cetak"><h2>' + esc(data.tetapan.namaSyarikat) + " — Jualan " +

    '<div class="kad">' +
      '<div class="kad-tajuk">' +
        '<div class="suis">' +
          '<button type="button" id="suisKalendar"' + (paparanSale === "kalendar" ? ' class="aktif"' : "") + ">Kalendar</button>" +
          '<button type="button" id="suisSenarai"' + (paparanSale === "senarai" ? ' class="aktif"' : "") + ">Senarai</button>" +
        "</div>" +
        '<div class="aksi">' +
          '<button class="btn btn-utama" id="btnSaleBaru">Key-in Sale Baru</button>' +
          '<button class="btn btn-lembut" id="btnEksport">Eksport CSV</button>' +
          '<button class="btn btn-lembut" id="btnCetak">Cetak</button>' +
        "</div>" +
      "</div>" +
      '<div class="penapis">' +
        (paparanSale === "senarai"
          ? '<label>Bulan<input type="month" id="fBulan" value="' + esc(tapis.bulan) + '"></label>' : "") +
        '<label style="min-width:220px">Cari<input type="search" id="fCari" placeholder="Nama, telefon, unit, projek…" value="' + esc(tapis.cari) + '"></label>' +
        "<label>Status Kerja<select id=\"fKerja\"><option value=''>Semua</option>" +
          STATUS_KERJA.map(function (s) {
            return '<option' + (tapis.kerja === s ? " selected" : "") + ">" + esc(s) + "</option>";
          }).join("") + "</select></label>" +
        "<label>Closed By<select id=\"fSales\"><option value=''>Semua</option>" +

        '<button class="btn btn-lembut" id="btnReset">Reset</button>' +
      "</div>" +

      '<div class="grid grid-4" style="margin-bottom:16px">' +
        kadStat("Jumlah Jualan", rm(r.total), r.bil + " job") +
        kadStat("Sudah Dibayar", rm(r.dibayar), "deposit + bayaran penuh") +
        kadStat("Baki", rm(r.baki), "belum dikutip") +
        kadStat("Target Bulan", rm(sasar), sasar > 0 ? Math.round((r.total / sasar) * 100) + "% dicapai" : "tiada target") +
      "</div>" +

      (paparanSale === "kalendar"
        ? kalendarSale(data, senarai)
        : '<div class="jadual-bungkus">' + jadualSale(senarai) + "</div>") +

  $("#suisKalendar").onclick = function () { paparanSale = "kalendar"; lukisSale(bekas); };
  $("#suisSenarai").onclick = function () { paparanSale = "senarai"; lukisSale(bekas); };
  if ($("#fBulan")) $("#fBulan").onchange = function (e) { tapis.bulan = e.target.value; lukisSale(bekas); };
  if (paparanSale === "kalendar") pasangAksiKalendar(bekas);
  $("#fKerja").onchange = function (e) { tapis.kerja = e.target.value; lukisSale(bekas); };
  $("#fSales").onchange = function (e) { tapis.sales = e.target.value; lukisSale(bekas); };
  $("#btnReset").onclick = function () {

          s.closedBy, s.sumber, s.statusKerja || "Tempahan", s.invois1, s.invois2, s.catatan];
      }));
  };

}

/* ------------------------- paparan kalendar --------------------------- */
var HARI_PENDEK = ["Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu", "Ahad"];

function tambahBulan(bulan, langkah) {
  var b = bulan.split("-");
  var d = new Date(parseInt(b[0], 10), parseInt(b[1], 10) - 1 + langkah, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function kalendarSale(data, senarai) {
  var b = tapis.bulan.split("-");
  var tahun = parseInt(b[0], 10), bln = parseInt(b[1], 10);
  var pertama = new Date(tahun, bln - 1, 1);
  var lompang = (pertama.getDay() + 6) % 7;            // Isnin = 0
  var hariAkhir = new Date(tahun, bln, 0).getDate();
  var hariIni = kunciTarikh();

  var peta = {};
  senarai.forEach(function (s) {
    (peta[s.tarikh] = peta[s.tarikh] || []).push(s);
  });
  Object.keys(peta).forEach(function (t) {
    peta[t].sort(function (x, y) { return String(x.masaMula).localeCompare(String(y.masaMula)); });
  });

  var sel = [];
  for (var i = 0; i < lompang; i++) sel.push('<div class="kal-hari kal-luar kal-lompang"></div>');

  for (var h = 1; h <= hariAkhir; h++) {
    var tarikh = tahun + "-" + String(bln).padStart(2, "0") + "-" + String(h).padStart(2, "0");
    var job = peta[tarikh] || [];
    var sah = job.filter(function (x) { return x.statusKerja !== "Batal"; });
    var jumlah = ringkasan(sah).total;
    var sasar = targetHari(tarikh, data.tetapan);
    var cutiInfo = (data.tetapan.cuti || []).filter(function (c) { return c.tarikh === tarikh; })[0];

    var kelas = ["kal-hari"];
    if (sasar === 0) kelas.push("kal-cuti");
    if (tarikh === hariIni) kelas.push("kal-ini");
    if (sasar > 0 && jumlah >= sasar) kelas.push("kal-capai");
    if (job.length) kelas.push("ada-job");

    sel.push('<div class="' + kelas.join(" ") + '" data-hari="' + tarikh + '">' +
      '<div class="kal-atas">' +
        '<span class="kal-tarikh">' + h +
          '<span class="kal-nama-hari">' + HARI_PENDEK[(new Date(tahun, bln - 1, h).getDay() + 6) % 7] + "</span></span>" +
        (sasar > 0
          ? '<span class="kal-sasar">' + esc(nom(sasar).toLocaleString("ms-MY")) + "</span>"
          : '<span class="kal-cuti-label">' + esc(cutiInfo ? (cutiInfo.sebab || "Cuti") : "Rehat") + "</span>") +
      "</div>" +
      job.slice(0, 3).map(function (s) {
        var k = kiraSale(s);
        var gaya = s.statusKerja === "Selesai" ? " j-selesai"
          : s.statusKerja === "Report Submit" ? " j-submit"
          : s.statusKerja === "Batal" ? " j-batal" : "";
        return '<button type="button" class="kal-job' + gaya + '" data-lihat="' + esc(s.id) + '">' +
          "<b>" + esc(s.nama || "Tanpa nama") + "</b>" +
          "<span>" + (s.masaMula ? esc(s.masaMula) + " · " : "") + esc(rm(k.total)) + "</span></button>";
      }).join("") +
      (job.length > 3 ? '<div class="kal-lagi">+ ' + (job.length - 3) + " job lagi</div>" : "") +
      (jumlah > 0
        ? '<div class="kal-jumlah ' + (sasar > 0 && jumlah >= sasar ? "capai" : "kurang") + '">' +
          esc(rm(jumlah)) + "</div>"
        : "") +
    "</div>");
  }

  var baki = (7 - (sel.length % 7)) % 7;
  for (var j = 0; j < baki; j++) sel.push('<div class="kal-hari kal-luar kal-lompang"></div>');

  var jumBulan = ringkasan(senarai.filter(function (x) { return x.statusKerja !== "Batal"; }));
  var sasarBulan = targetBulan(tapis.bulan, data.tetapan);

  return '<div class="kal-bar">' +
      '<div class="kal-nav">' +
        '<button type="button" id="kalSebelum" aria-label="Bulan sebelum">&#8249;</button>' +
        "<h3>" + esc(fmtBulan(tapis.bulan)) + "</h3>" +
        '<button type="button" id="kalSelepas" aria-label="Bulan seterusnya">&#8250;</button>' +
        '<button type="button" id="kalIni" style="width:auto;padding:0 12px">Hari Ini</button>' +
      "</div>" +
      '<div class="petunjuk">' +
        '<span><i style="background:#2563eb"></i>Tempahan</span>' +
        '<span><i style="background:#d97706"></i>Report submit</span>' +
        '<span><i style="background:#16a34a"></i>Selesai</span>' +
        "<span>" + esc(rm(jumBulan.total)) + " / " + esc(rm(sasarBulan)) + "</span>" +
      "</div>" +
    "</div>" +
    '<div class="kal-luar-bungkus"><div class="kal">' +
      HARI_PENDEK.map(function (n) { return '<div class="kal-kepala">' + n + "</div>"; }).join("") +
      sel.join("") +
    "</div></div>" +
    '<p class="kecil" style="margin:12px 0 0">Klik mana-mana tarikh untuk key-in sale pada hari itu. ' +
    "Klik nama client untuk lihat butiran. Nombor kelabu di penjuru kanan ialah target harian.</p>";
}

function pasangAksiKalendar(bekas) {
  var lukisSemula = function () { lukisSale(bekas); };
  $("#kalSebelum").onclick = function () { tapis.bulan = tambahBulan(tapis.bulan, -1); lukisSemula(); };
  $("#kalSelepas").onclick = function () { tapis.bulan = tambahBulan(tapis.bulan, 1); lukisSemula(); };
  $("#kalIni").onclick = function () { tapis.bulan = bulanKini(); lukisSemula(); };

  $$(".kal-hari[data-hari]", bekas).forEach(function (sel) {
    sel.onclick = function (e) {
      var job = e.target.closest ? e.target.closest(".kal-job") : null;
      if (job) return lihatSale(job.getAttribute("data-lihat"));
      borangSale(null, sel.getAttribute("data-hari"));
    };
  });
}

function jadualSale(senarai) {
  if (!senarai.length) return kosong("Tiada rekod jualan. Tekan “+ Key-in Sale Baru” untuk mula.");
  return "<table><thead><tr>" +
    "<th>Tarikh</th><th>Masa</th><th>Client</th><th>Projek / Unit</th>" +
    "<th class='num'>Total</th><th class='num'>Baki</th>" +
    "<th>Sales</th><th>Status</th><th></th></tr></thead><tbody>" +
    senarai.map(function (s) {
      var k = kiraSale(s);
      return "<tr>" +
        "<td>" + esc(fmtTarikh(s.tarikh)) + '<div class="kecil">' + esc(namaHari(s.tarikh)) + "</div></td>" +
        "<td>" + esc(s.masaMula || "-") + (s.masaTamat ? '<div class="kecil">hingga ' + esc(s.masaTamat) + "</div>" : "") + "</td>" +
        '<td class="bungkus"><b>' + esc(s.nama || "-") + "</b>" +

        '<td class="bungkus">' + esc(s.projek || "-") +
          '<div class="kecil">' + esc(s.unit || "-") + (s.size ? " · " + esc(s.size) : "") + "</div></td>" +
        '<td class="num">' + esc(rm(k.total)) + "</td>" +
        '<td class="num">' + esc(rm(k.baki)) + "</td>" +
        "<td>" + esc(s.closedBy || "-") + "</td>" +
        "<td>" + lencanaKerja(s.statusKerja) + "<div style='margin-top:4px'>" + lencanaBayar(k) + "</div></td>" +
        '<td><div class="aksi">' +
          '<button class="btn btn-lembut" data-lihat="' + esc(s.id) + '">Lihat</button>' +
          '<button class="btn btn-lembut" data-sunting="' + esc(s.id) + '">Sunting</button>' +
          '<button class="btn btn-lembut" data-buang="' + esc(s.id) + '">Padam</button>' +
        "</div></td></tr>";
    }).join("") + "</tbody></table>";
}

function pasangAksiJadual(bekas) {
  $$("[data-sunting]", bekas).forEach(function (b) {
    b.onclick = function () { borangSale(b.getAttribute("data-sunting")); };
  });
  $$("[data-lihat]", bekas).forEach(function (b) {
    b.onclick = function () { lihatSale(b.getAttribute("data-lihat")); };
  });
  $$("[data-buang]", bekas).forEach(function (b) {
    b.onclick = function () {
      sahkan("Padam rekod jualan ini? Tindakan ini tidak boleh dibatalkan.").then(function (ya) {
        if (!ya) return;
        var data = baca();
        data.sale = data.sale.filter(function (s) { return s.id !== b.getAttribute("data-buang"); });
        simpan(data);
        toast("Rekod dipadam.", "ok");
        lukis();
      });
    };
  });
}

function lihatSale(rekodId) {
  var data = baca();
  var s = data.sale.filter(function (x) { return x.id === rekodId; })[0];
  if (!s) return;
  var k = kiraSale(s);
  modal("Butiran Jualan — " + (s.nama || "-"),
    '<div class="tajuk-seksyen">Tempahan</div>' +
    '<dl class="kunci-nilai">' +
      baris("Tarikh", fmtTarikh(s.tarikh) + " (" + namaHari(s.tarikh) + ")") +
      baris("Masa", (s.masaMula || "-") + (s.masaTamat ? " – " + s.masaTamat : "")) +
      baris("Status", (s.statusKerja || "Tempahan")) +
    "</dl>" +
    '<div class="tajuk-seksyen">Client</div>' +
    '<dl class="kunci-nilai">' +
      baris("Nama", s.nama) + baris("Telefon", s.telefon) + baris("Email", s.email) +
    "</dl>" +
    '<div class="tajuk-seksyen">Property</div>' +
    '<dl class="kunci-nilai">' +
      baris("Projek", s.projek) + baris("Unit", s.unit) + baris("Size", s.size) +
    "</dl>" +
    '<div class="tajuk-seksyen">Kewangan</div>' +
    '<div class="jumlah-baris"><span>Harga inspection</span><b>' + esc(rm(s.harga)) + "</b></div>" +
    '<div class="jumlah-baris"><span>Water</span><b>' + esc(rm(s.water)) + "</b></div>" +
    '<div class="jumlah-baris"><span>Electric</span><b>' + esc(rm(s.electric)) + "</b></div>" +
    '<div class="jumlah-baris"><span><b>Jumlah</b></span><b>' + esc(rm(k.total)) + "</b></div>" +
    '<div class="jumlah-baris"><span>Deposit</span><b>' + esc(rm(s.deposit)) + "</b></div>" +
    '<div class="jumlah-baris"><span>Final payment</span><b>' + esc(rm(s.finalPayment)) + "</b></div>" +
    '<div class="jumlah-baris"><span><b>Baki</b></span><b>' + esc(rm(k.baki)) + "</b></div>" +
    '<div class="tajuk-seksyen">Lain-lain</div>' +
    '<dl class="kunci-nilai">' +
      baris("Closed by", s.closedBy) + baris("Dari", s.sumber) +
      baris("Invois 1", s.invois1) + baris("Invois 2", s.invois2) +
      baris("Catatan", s.catatan) +
    "</dl>", 560);
}

function baris(label, nilai) {
  return "<dt>" + esc(label) + "</dt><dd>" + (nilai ? esc(nilai) : "-") + "</dd>";
}

/* --------------------- borang key-in / sunting sale -------------------- */
function borangSale(rekodId, tarikhAsal) {
  var data = baca();
  var s = rekodId ? data.sale.filter(function (x) { return x.id === rekodId; })[0] : null;
  var baru = !s;
  s = s || { tarikh: tarikhAsal || kunciTarikh(), statusKerja: "Tempahan" };

  var pilihanSales = data.staf.filter(function (x) { return x.status === "aktif"; })
    .map(function (x) { return x.nama; });

  var m = modal(baru ? "Key-in Sale Baru" : "Sunting Jualan",
    '<form id="borangSale">' +
      '<div class="tajuk-seksyen">Tempahan</div>' +
      '<div class="baris-medan">' +
        medan("Tarikh *", '<input type="date" name="tarikh" value="' + esc(s.tarikh || "") + '" required>') +
        medan("Masa Mula", '<input type="text" name="masaMula" placeholder="9.30am" value="' + esc(s.masaMula || "") + '">') +
        medan("Masa Tamat", '<input type="text" name="masaTamat" placeholder="12.30pm" value="' + esc(s.masaTamat || "") + '">') +
      "</div>" +

      '<div class="tajuk-seksyen">Client</div>' +
      '<div class="baris-medan">' +
        medan("Nama *", '<input type="text" name="nama" value="' + esc(s.nama || "") + '" required>') +
        medan("No. Telefon", '<input type="tel" name="telefon" placeholder="012-3456789" value="' + esc(s.telefon || "") + '">') +
        medan("Email", '<input type="email" name="email" value="' + esc(s.email || "") + '">') +
      "</div>" +

      '<div class="tajuk-seksyen">Property</div>' +
      '<div class="baris-medan">' +
        medan("Projek / Daerah", '<input list="senaraiProjek" name="projek" value="' + esc(s.projek || "") + '">') +
        medan("No. Unit", '<input type="text" name="unit" placeholder="A-19-11 / No. 30" value="' + esc(s.unit || "") + '">') +
        medan("Size", '<input type="text" name="size" placeholder="850 / 32x70" value="' + esc(s.size || "") + '">') +
      "</div>" +
      '<datalist id="senaraiProjek">' + (data.tetapan.projek || []).map(function (p) {
        return "<option>" + esc(p) + "</option>";
      }).join("") + "</datalist>" +

      '<div class="tajuk-seksyen">Kewangan</div>' +
      '<div class="baris-medan">' +
        medan("Harga (RM) *", '<input type="number" step="0.01" min="0" name="harga" value="' + esc(s.harga || "") + '" required>') +
        medan("Water (RM)", '<input type="number" step="0.01" min="0" name="water" value="' + esc(s.water || "") + '">') +
        medan("Electric (RM)", '<input type="number" step="0.01" min="0" name="electric" value="' + esc(s.electric || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Deposit (RM)", '<input type="number" step="0.01" min="0" name="deposit" value="' + esc(s.deposit || "") + '">') +
        medan("Final Payment (RM)", '<input type="number" step="0.01" min="0" name="finalPayment" value="' + esc(s.finalPayment || "") + '">') +
        medan("Baki", '<input type="text" id="paparBaki" readonly value="RM 0.00">') +
      "</div>" +

      '<div class="tajuk-seksyen">Jualan & Status</div>' +
      '<div class="baris-medan">' +
        medan("Closed By", '<input list="senaraiSales" name="closedBy" value="' + esc(s.closedBy || "") + '">') +
        medan("Dari (sumber lead)", '<input list="senaraiSumber" name="sumber" value="' + esc(s.sumber || "") + '">') +
        medan("Status Kerja", "<select name='statusKerja'>" + STATUS_KERJA.map(function (x) {
          return "<option" + ((s.statusKerja || "Tempahan") === x ? " selected" : "") + ">" + esc(x) + "</option>";
        }).join("") + "</select>") +
      "</div>" +
      '<datalist id="senaraiSales">' + pilihanSales.map(function (p) {
        return "<option>" + esc(p) + "</option>";
      }).join("") + "</datalist>" +
      '<datalist id="senaraiSumber">' + (data.tetapan.sumber || []).map(function (p) {
        return "<option>" + esc(p) + "</option>";
      }).join("") + "</datalist>" +
      '<div class="baris-medan">' +
        medan("Invois 1", '<input type="text" name="invois1" value="' + esc(s.invois1 || "") + '">') +
        medan("Invois 2", '<input type="text" name="invois2" value="' + esc(s.invois2 || "") + '">') +
      "</div>" +
      medan("Catatan", '<textarea name="catatan">' + esc(s.catatan || "") + "</textarea>") +

      '<div class="baris-butang" style="margin-top:8px">' +
        '<button type="button" class="btn btn-lembut" data-batal>Batal</button>' +
        '<button type="submit" class="btn btn-utama">' + (baru ? "Simpan Sale" : "Kemas Kini") + "</button>" +
      "</div>" +
    "</form>", 720);

  var borang = $("#borangSale", m.el);

  function kiraPapar() {
    var nilai = ambilNilai(borang);
    var k = kiraSale(nilai);
    $("#paparBaki", m.el).value = rm(k.baki) + "  (jumlah " + rm(k.total) + ")";
  }
  borang.addEventListener("input", kiraPapar);
  kiraPapar();

  $("[data-batal]", m.el).onclick = m.tutup;

  borang.onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai(borang);
    if (!nilai.tarikh) return toast("Sila isi tarikh.", "bad");
    if (!nilai.nama) return toast("Sila isi nama client.", "bad");
    nilai.telefon = telefonKemas(nilai.telefon);

    var simpanan = baca();
    if (baru) {
      nilai.id = id();
      nilai.createdAt = new Date().toISOString();
      simpanan.sale.push(nilai);
    } else {
      nilai.id = rekodId;
      nilai.createdAt = s.createdAt || new Date().toISOString();
      nilai.updatedAt = new Date().toISOString();
      simpanan.sale = simpanan.sale.map(function (x) { return x.id === rekodId ? nilai : x; });
    }
    // Projek & sumber baharu terus masuk senarai cadangan.
    ["projek", "sumber"].forEach(function (medan) {
      var v = (nilai[medan] || "").trim();
      if (v && simpanan.tetapan[medan].indexOf(v) === -1) simpanan.tetapan[medan].push(v);
    });
    if (!simpan(simpanan)) return;
    m.tutup();
    toast(baru ? "Sale berjaya direkod." : "Rekod dikemas kini.", "ok");
    lukis();
  };
}

function medan(label, kawalan) {
  return "<label>" + esc(label) + kawalan + "</label>";
}

function ambilNilai(borang) {
  var hasil = {};
  $$("input,select,textarea", borang).forEach(function (el) {
    if (!el.name) return;
    hasil[el.name] = el.type === "number" ? (el.value === "" ? "" : nom(el.value)) : el.value.trim();
  });
  return hasil;
}

/* ======================================================================
   HALAMAN 3 — STAF
   ================================================================== */
function lukisStaf(bekas) {
  var data = baca();
  var staf = data.staf.slice().sort(function (a, b) {
    return String(a.nama || "").localeCompare(String(b.nama || ""));
  });
  var bulan = bulanKini();
  var jualan = kumpul(saleBulan(data, bulan), "closedBy");
  var petaJualan = {};
  jualan.forEach(function (x) { petaJualan[x.nama] = x; });

  bekas.innerHTML =
    '<div class="kad">' +
      '<div class="kad-tajuk"><h3>Senarai Staf</h3>' +
        '<div class="aksi"><button class="btn btn-utama" id="btnStafBaru">+ Tambah Staf</button>' +
        '<button class="btn btn-lembut" id="btnEksportStaf">Eksport CSV</button></div>' +
      "</div>" +
      '<p class="kecil">Nama staf yang aktif akan muncul dalam pilihan “Closed By” semasa key-in sale. ' +
      "Jualan di bawah adalah untuk bulan " + esc(fmtBulan(bulan)) + ".</p>" +
      '<div class="jadual-bungkus">' +
      (staf.length ? "<table><thead><tr><th>Nama</th><th>Jawatan</th><th>Jabatan</th>" +
        "<th>Telefon</th><th>Email</th><th>Mula Kerja</th><th class='num'>Jualan Bulan Ini</th>" +
        "<th>Status</th><th></th></tr></thead><tbody>" +
        staf.map(function (p) {
          var j = petaJualan[p.nama];
          return "<tr>" +
            "<td><b>" + esc(p.nama) + "</b></td>" +
            "<td>" + esc(p.jawatan || "-") + "</td>" +
            "<td>" + esc(p.jabatan || "-") + "</td>" +
            "<td>" + esc(p.telefon || "-") + "</td>" +
            '<td class="bungkus">' + esc(p.email || "-") + "</td>" +
            "<td>" + (p.tarikhMula ? esc(fmtTarikh(p.tarikhMula)) : "-") + "</td>" +
            '<td class="num">' + esc(rm(j ? j.total : 0)) +
              '<div class="kecil">' + (j ? j.bil : 0) + " job</div></td>" +
            '<td><span class="badge ' + (p.status === "aktif" ? "badge-ok" : "badge-muted") + '">' +
              (p.status === "aktif" ? "Aktif" : "Tidak Aktif") + "</span></td>" +
            '<td><div class="aksi">' +
              '<button class="btn btn-lembut" data-sunting-staf="' + esc(p.id) + '">Sunting</button>' +
              '<button class="btn btn-lembut" data-buang-staf="' + esc(p.id) + '">Padam</button>' +
            "</div></td></tr>";
        }).join("") + "</tbody></table>"
        : kosong("Belum ada staf. Tekan “+ Tambah Staf”.")) +
      "</div></div>";

  $("#btnStafBaru").onclick = function () { borangStaf(null); };
  $("#btnEksportStaf").onclick = function () {
    if (!staf.length) return toast("Tiada staf untuk dieksport.", "warn");
    csv("senarai-staf", ["Nama", "Jawatan", "Jabatan", "Telefon", "Email", "Mula Kerja", "Status"],
      staf.map(function (p) {
        return [p.nama, p.jawatan, p.jabatan, p.telefon, p.email, p.tarikhMula, p.status];
      }));
  };
  $$("[data-sunting-staf]", bekas).forEach(function (b) {
    b.onclick = function () { borangStaf(b.getAttribute("data-sunting-staf")); };
  });
  $$("[data-buang-staf]", bekas).forEach(function (b) {
    b.onclick = function () {
      var sid = b.getAttribute("data-buang-staf");
      sahkan("Padam staf ini? Rekod jualan lama tidak akan terjejas.").then(function (ya) {
        if (!ya) return;
        var d = baca();
        d.staf = d.staf.filter(function (x) { return x.id !== sid; });
        simpan(d);
        toast("Staf dipadam.", "ok");
        lukis();
      });
    };
  });
}

function borangStaf(stafId) {
  var data = baca();
  var p = stafId ? data.staf.filter(function (x) { return x.id === stafId; })[0] : null;
  var baru = !p;
  p = p || { status: "aktif" };

  var m = modal(baru ? "Tambah Staf" : "Sunting Staf",
    '<form id="borangStaf">' +
      '<div class="baris-medan">' +
        medan("Nama Penuh *", '<input type="text" name="nama" value="' + esc(p.nama || "") + '" required>') +
        medan("Jawatan", '<input type="text" name="jawatan" placeholder="Sales / Inspector / Admin" value="' + esc(p.jawatan || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Jabatan", '<input type="text" name="jabatan" placeholder="Jualan / Operasi" value="' + esc(p.jabatan || "") + '">') +
        medan("No. Telefon", '<input type="tel" name="telefon" value="' + esc(p.telefon || "") + '">') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Email", '<input type="email" name="email" value="' + esc(p.email || "") + '">') +
        medan("Tarikh Mula Kerja", '<input type="date" name="tarikhMula" value="' + esc(p.tarikhMula || "") + '">') +
      "</div>" +
      medan("Status", "<select name='status'>" +
        "<option value='aktif'" + (p.status === "aktif" ? " selected" : "") + ">Aktif</option>" +
        "<option value='nonaktif'" + (p.status !== "aktif" ? " selected" : "") + ">Tidak Aktif</option></select>") +
      '<div class="baris-butang"><button type="button" class="btn btn-lembut" data-batal>Batal</button>' +
      '<button type="submit" class="btn btn-utama">' + (baru ? "Tambah" : "Kemas Kini") + "</button></div>" +
    "</form>", 560);

  $("[data-batal]", m.el).onclick = m.tutup;
  $("#borangStaf", m.el).onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangStaf", m.el));
    if (!nilai.nama) return toast("Sila isi nama staf.", "bad");
    nilai.telefon = telefonKemas(nilai.telefon);

    if (baru) {
      nilai.id = id();
      d.staf.push(nilai);

      nilai.id = stafId;
      d.staf = d.staf.map(function (x) { return x.id === stafId ? nilai : x; });
    }
    if (!simpan(d)) return;
    m.tutup();
    toast(baru ? "Staf ditambah." : "Maklumat staf dikemas kini.", "ok");
    lukis();
  };
}

/* ======================================================================
   HALAMAN 4 — TETAPAN
   ================================================================== */

          medan("Target Jualan Harian (RM)",
            '<input type="number" step="1" min="0" name="targetHarian" value="' + esc(t.targetHarian) + '">') +
          '<label>Hari Bekerja</label>' +
          '<div class="senarai-cuti" style="margin-bottom:14px">' +
            NAMA_HARI.map(function (h, i) {
              return '<label class="chip" style="margin:0"><input type="checkbox" class="hariBekerja" value="' + i + '"' +
                ((t.hariBekerja || []).indexOf(i) !== -1 ? " checked" : "") + ">" + esc(h) + "</label>";
            }).join("") +
          "</div>" +
          '<div class="jumlah-baris"><span>Target ' + esc(fmtBulan(bulan)) + " (dikira automatik)</span><b id=\"paparTargetBulan\">" +
            esc(rm(targetBulan(bulan, t))) + "</b></div>" +
          medan("Senarai Projek / Daerah (satu baris satu)",
            '<textarea name="projek">' + esc((t.projek || []).join("\n")) + "</textarea>") +
          medan("Sumber Lead (satu baris satu)",
            '<textarea name="sumber">' + esc((t.sumber || []).join("\n")) + "</textarea>") +
          '<div class="baris-butang"><button type="submit" class="btn btn-utama">Simpan Tetapan</button></div>' +
        "</form>" +
      "</div>" +

      '<div class="kad tanpa-margin">' +
        '<div class="kad-tajuk"><h3>Hari Cuti / Offday</h3></div>' +
        '<p class="kecil">Target harian pada tarikh ini dikira sebagai RM 0 — jadi peratus capaian bulanan kekal tepat.</p>' +
        '<form id="borangCuti" class="baris-medan" style="align-items:end">' +
          medan("Tarikh", '<input type="date" name="tarikh" required>') +
          medan("Sebab", '<input type="text" name="sebab" placeholder="Cuti Umum / Offday">') +
          '<div><button class="btn btn-utama penuh" type="submit">Tambah</button></div>' +
        "</form>" +
        '<div class="senarai-cuti" id="senaraiCuti">' +
          ((t.cuti || []).length ? t.cuti.slice().sort(function (a, b) {
            return String(a.tarikh).localeCompare(String(b.tarikh));
          }).map(function (c) {
            return '<span class="chip">' + esc(fmtTarikh(c.tarikh)) +
              (c.sebab ? " · " + esc(c.sebab) : "") +
              '<button type="button" data-buang-cuti="' + esc(c.tarikh) + '" title="Buang">&times;</button></span>';
          }).join("") : '<span class="kecil">Belum ada hari cuti direkod.</span>') +
        "</div>" +

        '<div class="kad-tajuk" style="margin-top:24px"><h3>Data & Backup</h3></div>' +
        '<p class="kecil">Data sistem disimpan dalam pelayar komputer ini sahaja. Buat backup kerap — ' +
        "kalau padam sejarah pelayar atau tukar komputer, data perlu dipulihkan dari fail backup.</p>" +
        '<div class="aksi" style="flex-wrap:wrap">' +
          '<button class="btn btn-utama" id="btnBackup">Muat Turun Backup</button>' +
          '<button class="btn btn-lembut" id="btnPulih">Pulih dari Fail</button>' +
          '<button class="btn btn-bad" id="btnPadamSemua">Padam Semua Data</button>' +
        "</div>" +
        '<input type="file" id="failPulih" accept="application/json" hidden>' +
        '<div class="jumlah-baris" style="margin-top:16px"><span>Jumlah rekod jualan</span><b>' + data.sale.length + "</b></div>" +
        '<div class="jumlah-baris"><span>Jumlah staf</span><b>' + data.staf.length + "</b></div>" +
      "</div>" +
    "</div>";

  $("#borangTetapan").onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangTetapan"));
    var d = baca();
    d.tetapan.namaSyarikat = nilai.namaSyarikat || "Syarikat Saya";
    d.tetapan.targetHarian = nom(nilai.targetHarian);
    d.tetapan.hariBekerja = $$(".hariBekerja").filter(function (c) { return c.checked; })
      .map(function (c) { return parseInt(c.value, 10); });
    d.tetapan.projek = pecahBaris(nilai.projek);
    d.tetapan.sumber = pecahBaris(nilai.sumber);
    if (!simpan(d)) return;
    toast("Tetapan disimpan.", "ok");
    lukis();
  };

  $("#borangCuti").onsubmit = function (e) {
    e.preventDefault();
    var nilai = ambilNilai($("#borangCuti"));
    if (!nilai.tarikh) return toast("Sila pilih tarikh.", "bad");
    var d = baca();
    d.tetapan.cuti = (d.tetapan.cuti || []).filter(function (c) { return c.tarikh !== nilai.tarikh; });
    d.tetapan.cuti.push({ tarikh: nilai.tarikh, sebab: nilai.sebab || "Offday" });
    if (!simpan(d)) return;
    toast("Hari cuti ditambah.", "ok");
    lukis();
  };

  $$("[data-buang-cuti]").forEach(function (b) {
    b.onclick = function () {
      var d = baca();
      d.tetapan.cuti = (d.tetapan.cuti || []).filter(function (c) {
        return c.tarikh !== b.getAttribute("data-buang-cuti");
      });
      simpan(d);
      lukis();
    };
  });

  $("#btnBackup").onclick = function () {
    muatTurun("backup-sistem-" + kunciTarikh() + ".json",
      JSON.stringify(baca(), null, 2), "application/json");
    toast("Backup dimuat turun.", "ok");
  };

  $("#btnPulih").onclick = function () { $("#failPulih").click(); };
  $("#failPulih").onchange = function (e) {
    var fail = e.target.files[0];
    if (!fail) return;
    var pembaca = new FileReader();
    pembaca.onload = function () {
      try {
        var masuk = JSON.parse(pembaca.result);
        if (!masuk || !Array.isArray(masuk.sale)) throw new Error("Format fail tidak dikenali.");
        sahkan("Pulih data dari fail ini? Semua data semasa akan diganti.").then(function (ya) {
          if (!ya) return;
          simpan(masuk);
          toast("Data dipulihkan.", "ok");
          lukis();
        });
      } catch (err) {
        toast("Gagal baca fail: " + err.message, "bad", 5000);
      }
    };
    pembaca.readAsText(fail);
    e.target.value = "";
  };

  $("#btnPadamSemua").onclick = function () {
    sahkan("Padam SEMUA data jualan, staf dan tetapan? Buat backup dahulu jika perlu.").then(function (ya) {
      if (!ya) return;
      localStorage.removeItem(KUNCI);
      benihkan();
      toast("Semua data dipadam.", "ok");
      lukis();
    });
  };
}

function pecahBaris(teks) {
  return String(teks || "").split("\n").map(function (x) { return x.trim(); })
    .filter(function (x, i, arr) { return x && arr.indexOf(x) === i; });
}

/* ======================================================================
   MENU & PENGHALAAN
   ================================================================== */
var IKON = {
  papan: '<svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>',
  sale: '<svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15l-2.5-1.5L14 21l-2.5-1.5L9 21l-2.5-1.5L4 21V4a1 1 0 0 1 1-1z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  staf: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.5a3.2 3.2 0 0 1 0 6"/><path d="M17.5 14.2A6.5 6.5 0 0 1 21.5 20"/></svg>',
  tetapan: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.9 19.3a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.54 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.7 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.54h.09A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.46 9v.09a1.7 1.7 0 0 0 1.56 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"/></svg>'
};

var HALAMAN = [
  { id: "papan",   label: "Papan Utama",  ikon: IKON.papan,   lukis: lukisPapan },
  { id: "sale",    label: "Key-in Sale",  ikon: IKON.sale,    lukis: lukisSale },
  { id: "staf",    label: "Staf",         ikon: IKON.staf,    lukis: lukisStaf },
  { id: "tetapan", label: "Tetapan",      ikon: IKON.tetapan, lukis: lukisTetapan }
];

function halamanSemasa() {
  var h = (location.hash || "").replace(/^#\/?/, "") || "papan";
  return HALAMAN.filter(function (x) { return x.id === h; })[0] || HALAMAN[0];
}

function binaMenu() {
  var data = baca();
  var hariIni = kunciTarikh();
  var perluTindakan = data.sale.filter(function (s) {
    return s.tarikh <= hariIni && ["Selesai", "Batal", "Report Submit"].indexOf(s.statusKerja || "Tempahan") === -1;
  }).length;

  $("#navMenu").innerHTML = HALAMAN.map(function (h) {
    return '<a class="nav-item" href="#/' + h.id + '" data-nav="' + h.id + '">' +
      '<span class="nav-ikon">' + h.ikon + "</span><span>" + esc(h.label) + "</span>" +
      (h.id === "sale" && perluTindakan ? '<span class="lencana-menu">' + perluTindakan + "</span>" : "") +
      "</a>";
  }).join("");
  $$("#navMenu a").forEach(function (a) {
    a.onclick = function () { $("#sisi").classList.remove("buka"); };
  });
  $("#sisiSyarikat").textContent = data.tetapan.namaSyarikat;
}

function lukis() {
  var h = halamanSemasa();
  binaMenu();
  $$("[data-nav]").forEach(function (a) {
    a.classList.toggle("aktif", a.getAttribute("data-nav") === h.id);
  });
  $("#tajukHalaman").textContent = h.label;
  var bekas = $("#kandungan");
  bekas.innerHTML = "";
  try {
    h.lukis(bekas);
  } catch (err) {
    bekas.innerHTML = '<div class="kad ralat"><h3>Ralat memaparkan halaman</h3><p>' +
      esc(err.message) + "</p></div>";
    console.error(err);
  }
}

function mulakan() {
  benihkan();
  $("#btnMenu").onclick = function () { $("#sisi").classList.toggle("buka"); };
  $("#litup").onclick = function () { $("#sisi").classList.remove("buka"); };
  window.addEventListener("hashchange", lukis);
  lukis();
}

mulakan();
</script>
</body>
</html>
