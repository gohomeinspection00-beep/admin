<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Sistem Pengurusan Syarikat</title>
<style>
/* ============================ GAYA ============================ */
:root{
  --bg:#f1f5f9; --kad:#fff; --teks:#0f172a; --lembut:#64748b; --garis:#e2e8f0;
  --utama:#2563eb; --utama2:#1d4ed8; --gelap:#0f172a;
  --ok:#16a34a; --okbg:#dcfce7; --warn:#d97706; --warnbg:#fef3c7; --bad:#dc2626; --badbg:#fee2e2;
  --bayang:0 1px 3px rgba(15,23,42,.08),0 8px 24px rgba(15,23,42,.06); --bulat:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--teks);font:15px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0 0 12px;line-height:1.25}
a{color:var(--utama)}
[hidden]{display:none!important}

/* --- skrin log masuk --- */
.skrin-log{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(160deg,#1e293b,#0f172a 55%,#1e3a8a)}
.kad-log{width:100%;max-width:420px;background:var(--kad);border-radius:18px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.kad-log.tengah{text-align:center}
.log-jenama{text-align:center;margin-bottom:22px}
.log-jenama h1{font-size:20px;margin:12px 0 4px}
.log-jenama p{margin:0;color:var(--lembut);font-size:13px}
.logo{width:54px;height:54px;margin:0 auto;border-radius:16px;background:var(--utama);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.logo.kecil{width:38px;height:38px;font-size:14px;border-radius:11px;margin:0}
.tab-baris{display:flex;gap:6px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font:inherit;font-weight:600;color:var(--lembut);cursor:pointer}
.tab.aktif{background:var(--kad);color:var(--teks);box-shadow:var(--bayang)}

/* --- borang --- */
label{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--lembut)}
input,select,textarea{width:100%;margin-top:6px;padding:11px 12px;border:1px solid var(--garis);border-radius:10px;font:inherit;color:var(--teks);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--utama);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:middle}
.nota{font-size:12px;color:var(--lembut);text-align:center;margin:14px 0 0}
.baris-medan{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}

/* --- butang --- */
.btn{border:1px solid transparent;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--bg);color:var(--teks)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-utama{background:var(--utama);color:#fff}
.btn-utama:hover:not(:disabled){background:var(--utama2)}
.btn-lembut{background:#fff;border-color:var(--garis)}
.btn-lembut:hover:not(:disabled){background:var(--bg)}
.btn-ok{background:var(--ok);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-kecil{padding:6px 11px;font-size:13px;border-radius:8px}
.penuh{width:100%;display:block}
.baris-butang{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.btn-ikon{border:0;background:transparent;font-size:22px;cursor:pointer;padding:4px 8px;border-radius:8px;color:var(--teks)}

/* --- rangka --- */
.rangka{display:flex;min-height:100vh}
.sisi{width:252px;flex:0 0 252px;background:var(--gelap);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sisi-atas{display:flex;align-items:center;gap:11px;padding:18px 16px;border-bottom:1px solid #1e293b}
.sisi-syarikat{font-weight:700;color:#fff;font-size:14px}
.sisi-sub{font-size:11px;color:#64748b}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:#cbd5e1;text-decoration:none;font-weight:500;margin-bottom:3px}
.nav-item:hover{background:#1e293b;color:#fff}
.nav-item.aktif{background:var(--utama);color:#fff}
.nav-ikon{width:20px;text-align:center}
.lencana-menu{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.sisi-bawah{padding:14px;border-top:1px solid #1e293b}
.pengguna{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--utama);color:#fff;display:grid;place-items:center;font-weight:700;flex:0 0 36px}
.pengguna-nama{color:#fff;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pengguna-peranan{font-size:11px;color:#64748b}
.litup{display:none}
.utama{flex:1;min-width:0;display:flex;flex-direction:column}
.bar-atas{display:flex;align-items:center;gap:10px;padding:14px 22px;background:var(--kad);border-bottom:1px solid var(--garis);position:sticky;top:0;z-index:10}
.bar-atas h2{margin:0;font-size:18px}
.bar-atas .btn-ikon{display:none}
.kandungan{padding:22px;flex:1}

/* --- kad & jadual --- */
.kad{background:var(--kad);border:1px solid var(--garis);border-radius:var(--bulat);padding:18px;box-shadow:var(--bayang);margin-bottom:18px}
.kad-tajuk{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kad-tajuk h3{margin:0;font-size:16px}
.grid{display:grid;gap:14px;margin-bottom:18px}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--kad);border:1px solid var(--garis);border-radius:var(--bulat);padding:16px;box-shadow:var(--bayang)}
.stat-label{font-size:12px;color:var(--lembut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat-nilai{font-size:26px;font-weight:700;margin-top:6px}
.stat-nota{font-size:12px;color:var(--lembut);margin-top:4px}
.jadual-bungkus{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--garis);white-space:nowrap;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--lembut);background:#f8fafc}
tbody tr:hover{background:#f8fafc}
td.bungkus{white-space:normal;min-width:130px;max-width:210px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600}
.badge-ok{background:var(--okbg);color:var(--ok)}
.badge-warn{background:var(--warnbg);color:var(--warn)}
.badge-bad{background:var(--badbg);color:var(--bad)}
.badge-muted{background:var(--bg);color:var(--lembut)}
.kosong{padding:30px;text-align:center;color:var(--lembut)}
.kecil{font-size:12px;color:var(--lembut)}
.penapis{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.penapis label{margin:0}
.senarai-item{padding:12px 0;border-bottom:1px solid var(--garis)}
.senarai-item:last-child{border-bottom:0}

/* --- jam --- */
.jam-kad{text-align:center}
.jam-besar{font-size:40px;font-weight:700;letter-spacing:1px}
.jam-tarikh{color:var(--lembut);margin-bottom:16px}
.jam-butang{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.jam-butang .btn{min-width:150px;padding:14px 18px;font-size:16px}

/* --- modal & toast --- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal-kad{width:100%;background:var(--kad);border-radius:16px;max-height:90vh;overflow-y:auto}
.modal-tajuk{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--garis);position:sticky;top:0;background:var(--kad)}
.modal-tajuk h3{margin:0;font-size:16px}
.modal-tutup{border:0;background:transparent;font-size:26px;line-height:1;cursor:pointer;color:var(--lembut)}
.modal-isi{padding:18px}
.modal-kaki{position:sticky;bottom:-18px;background:var(--kad);padding:14px 0 4px;margin-top:14px;border-top:1px solid var(--garis)}
.toast-box{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:70;display:grid;gap:8px}
.toast{background:var(--gelap);color:#fff;padding:11px 18px;border-radius:10px;box-shadow:var(--bayang);font-size:14px;max-width:90vw;animation:naik .2s ease}
.toast-ok{background:var(--ok)}.toast-bad{background:var(--bad)}.toast-warn{background:var(--warn)}
@keyframes naik{from{opacity:0;transform:translateY(8px)}}

/* --- ikon & kawalan paparan --- */
.nav-ikon{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 18px}
.nav-ikon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.suis{display:inline-flex;background:var(--bg);border:1px solid var(--garis);border-radius:10px;padding:3px}
.suis button{border:0;background:transparent;padding:7px 16px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--lembut);cursor:pointer}
.suis button.aktif{background:#fff;color:var(--teks);box-shadow:0 1px 2px rgba(15,23,42,.1)}

/* --- kalendar --- */
.kal-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.kal-nav{display:flex;align-items:center;gap:8px}
.kal-nav h3{margin:0;font-size:17px;min-width:170px;text-align:center}
.kal-nav button{border:1px solid var(--garis);background:#fff;width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1;color:var(--teks)}
.kal-nav button:hover{background:var(--bg)}
.petunjuk{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--lembut);align-items:center}
.petunjuk i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.petunjuk i.st-s0{color:#2563eb}.petunjuk i.st-s1{color:#4f46e5}.petunjuk i.st-s2{color:#0d9488}.petunjuk i.st-s3{color:#d97706}.petunjuk i.st-s4{color:#ea580c}.petunjuk i.st-s5{color:#db2777}.petunjuk i.st-siap{color:#16a34a}.petunjuk i.st-batal{color:#dc2626}
.kal-luar-bungkus{overflow-x:auto}
.kal{display:grid;grid-template-columns:repeat(7,minmax(140px,1fr));gap:1px;background:var(--garis);border:1px solid var(--garis);border-radius:12px;overflow:hidden}
.kal-kepala{background:#f8fafc;padding:9px 10px;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--lembut);text-align:center}
.kal-hari{background:#fff;min-height:118px;padding:8px;position:relative;cursor:pointer;transition:background .12s}
.kal-hari:hover{background:#f8fafc}
.kal-hari.kal-luar{background:#fafbfc;color:#cbd5e1;cursor:default}
.kal-hari.kal-luar:hover{background:#fafbfc}
.kal-hari.kal-cuti{background:#fbfcfd}
.kal-hari.kal-ini{box-shadow:inset 0 0 0 2px var(--utama)}
.kal-hari.kal-capai,.kal-hari.kal-cuti.kal-capai{box-shadow:inset 3px 0 0 var(--ok)}
.kal-atas{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:6px}
.kal-tarikh{font-size:13px;font-weight:700}
.kal-nama-hari{display:none;margin-left:7px;font-weight:500;color:var(--lembut)}
.kal-nav button{white-space:nowrap}
.kal-hari.kal-ini .kal-tarikh{color:var(--utama)}
.kal-sasar{font-size:10px;color:var(--lembut);text-transform:uppercase;letter-spacing:.3px}
.kal-job{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--utama);background:#eff6ff;border-radius:0 6px 6px 0;padding:4px 6px;margin-bottom:4px;font:inherit;font-size:11.5px;line-height:1.35;cursor:pointer;color:var(--teks)}
.kal-job:hover{background:#dbeafe}
.kal-job.j-selesai{border-left-color:var(--ok);background:#f0fdf4}
.kal-job.j-selesai:hover{background:#dcfce7}
.kal-job.j-submit{border-left-color:var(--warn);background:#fffbeb}
.kal-job.j-submit:hover{background:#fef3c7}
.kal-job.j-batal{border-left-color:var(--bad);background:#fef2f2;text-decoration:line-through;opacity:.7}
.kal-job b{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-weight:600}
.kal-nama{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.kal-job span{color:var(--lembut)}
.kal-job-baris{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kal-masa{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kal-nilai{flex:0 0 auto;font-weight:700;color:var(--teks);font-size:10.5px;font-variant-numeric:tabular-nums}
.kal-lagi{font-size:11px;color:var(--utama);font-weight:600;padding:2px 6px}
.kal-jumlah{position:absolute;left:8px;right:8px;bottom:6px;font-size:11px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.kal-jumlah.kurang{color:var(--lembut)}
.kal-jumlah.capai{color:var(--ok)}
.kal-hari.ada-job{padding-bottom:22px}
.kal-cuti-label{font-size:10px;font-weight:700;color:var(--lembut);text-transform:uppercase;letter-spacing:.4px}
@media(max-width:760px){
  .kal{grid-template-columns:1fr;gap:0}
  .kal-kepala{display:none}
  .kal-hari{min-height:0;border-bottom:1px solid var(--garis);display:flex;flex-direction:column}
  .kal-hari.kal-luar{display:none}
  .kal-hari.kal-lompang{display:none}
  .kal-nama-hari{display:inline;font-size:12px}
  .kal-nav{width:100%;justify-content:space-between}
  .kal-nav h3{min-width:0;flex:1}
  .kal-jumlah{position:static;text-align:left;margin-top:4px}
  .kal-hari.ada-job{padding-bottom:8px}
}
@media print{.kal-hari{break-inside:avoid}.suis,.kal-nav button{display:none!important}}

/* --- menu klik kanan --- */
.menu-konteks{position:fixed;z-index:80;background:#fff;border:1px solid var(--garis);border-radius:11px;box-shadow:0 12px 34px rgba(15,23,42,.18);padding:5px;min-width:210px}
.menu-kepala{padding:8px 11px 6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--lembut);border-bottom:1px solid var(--garis);margin-bottom:4px}
.menu-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 11px;border-radius:8px;font:inherit;font-size:13.5px;color:var(--teks);cursor:pointer}
.menu-item:hover{background:var(--bg)}
.menu-item.bahaya{color:var(--bad)}
.menu-item.bahaya:hover{background:var(--badbg)}
.menu-pisah{height:1px;background:var(--garis);margin:4px 0}

/* --- hari cuti (merah) & nota --- */
.kal-hari.kal-cuti{background:#fdf1f1;box-shadow:inset 3px 0 0 #f87171}
.kal-hari.kal-cuti:hover{background:#fdecec}
.kal-hari.kal-cuti .kal-tarikh{color:var(--bad)}
.kal-cuti-label{font-size:10px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.2px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kal-hari.kal-rehat{background:#fafbfc}
.kal-hari.kal-rehat:hover{background:#f5f7f9}
.kal-rehat-label{font-size:10px;font-weight:700;color:var(--lembut);text-transform:uppercase;letter-spacing:.4px}
.kal-nota{font-size:11px;line-height:1.4;color:var(--warn);background:#fffbeb;border-left:3px solid var(--warn);border-radius:0 6px 6px 0;padding:3px 6px;margin-bottom:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* --- mod pilih tarikh (slot kosong) --- */
.bar-pilih{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:10px 14px;margin-bottom:14px}
.bar-pilih .kecil{color:#1d4ed8}
.kal-hari.dipilih{background:#eff6ff!important;box-shadow:inset 0 0 0 2px var(--utama)!important}
.kal-tik{width:17px;height:17px;border:1.5px solid #cbd5e1;border-radius:5px;background:#fff;flex:0 0 17px;position:relative}
.kal-hari.dipilih .kal-tik{background:var(--utama);border-color:var(--utama)}
.kal-hari.dipilih .kal-tik::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.slot-baris{display:grid;grid-template-columns:1fr 110px 110px;gap:10px;align-items:end;padding:10px 0;border-bottom:1px solid var(--garis)}
.slot-baris label{margin:0}
.slot-tarikh b{display:block}
@media(max-width:560px){.slot-baris{grid-template-columns:1fr 1fr}.slot-tarikh{grid-column:1/-1}}

/* --- resit A4 (format asal syarikat) --- */
#kertasResit{display:none}
body.cetak-resit .rangka,body.cetak-resit .modal-bg,body.cetak-resit .toast-box,body.cetak-resit .menu-konteks{display:none!important}
body.cetak-resit #kertasResit{display:block}
.resit{--jenama:#183a73;width:794px;min-height:1050px;background:#fff;color:#222;margin:0 auto;padding:18px 22px;
  font:13px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.resit + .resit{page-break-before:always;margin-top:24px}
.resit-kepala{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center;border-bottom:3px solid var(--jenama);padding-bottom:10px;margin-bottom:12px}
.resit-kepala img{width:140px;height:auto;object-fit:contain;justify-self:start}
.resit-syarikat{font-size:12px;text-align:right;color:#333;justify-self:end;white-space:pre-line}
.resit-syarikat h2{margin:0 0 4px;font-size:17px}
.resit-tajuk{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.resit-tajuk h2{margin:0;font-size:22px;letter-spacing:1px}
.resit-tajuk .kanan{font-size:13px;text-align:right}
.resit-billto{margin:12px 0;font-size:13px}
.resit table{width:100%;border-collapse:collapse;margin-top:10px;font-size:12.5px}
.resit th,.resit td{border:1px solid #e1e5ea;padding:8px;vertical-align:top;text-align:left;white-space:normal}
.resit th{background:var(--jenama);color:#fff;font-size:12px;letter-spacing:.2px;text-transform:none}
.resit .jumlah-resit{width:100%;max-width:440px;margin-left:auto}
.resit .jumlah-resit td:first-child{font-weight:700}
.resit .jumlah-resit td:last-child{text-align:right}
.resit .baris-diterima td{background:#eaf3ea;color:#14532d;font-weight:700}
.resit-tengah{text-align:center;margin-top:16px;font-size:12.5px;line-height:1.7}
.resit-tandatangan{margin-top:26px;text-align:right}
.resit-tandatangan img{height:64px;display:inline-block}
.resit-seksyen{background:var(--jenama);color:#fff;padding:6px 10px;border-radius:6px;margin-top:14px;font-size:13px;font-weight:600}
.resit .info-resit td:first-child{background:#f4f7fb;font-weight:600;width:46%}
.pratonton{background:#eef2f7;border:1px solid var(--garis);border-radius:10px;padding:10px;overflow:auto;max-height:58vh;margin-bottom:14px}
.pratonton .resit{zoom:.62;box-shadow:0 2px 10px rgba(0,0,0,.12);min-height:auto;padding-bottom:26px}
@media print{
  @page{size:A4;margin:10mm}
  body.cetak-resit{background:#fff}
  .resit{width:auto;min-height:auto;padding:0;box-shadow:none}
}

/* --- kumpulan ikut client (boleh kembang) --- */
.kumpulan{border:1px solid var(--garis);border-radius:12px;margin-bottom:10px;overflow:hidden;background:#fff}
.kumpulan-kepala{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:#f8fafc;border:0;font:inherit;cursor:pointer;text-align:left;color:var(--teks)}
.kumpulan-kepala:hover{background:#f1f5f9}
.kumpulan-panah{transition:transform .15s;color:var(--lembut);font-size:12px;flex:0 0 12px}
.kumpulan.buka .kumpulan-panah{transform:rotate(90deg)}
.kumpulan-nama{font-weight:700}

<script>
"use strict";
/* =========================================================================
   SISTEM PENGURUSAN SYARIKAT — satu fail, tiada pemasangan.
   Data disimpan dalam localStorage pelayar. Gunakan Tetapan > Backup untuk
   simpan salinan fail JSON.
   ====================================================================== */

var KUNCI = "sps_data_v1";

var TETAPAN_ASAL = {
  namaSyarikat: "Go Home Inspection",
  targetHarian: 600,
  hariBekerja: [1, 2, 3, 4, 5, 6],           // 0=Ahad, 1=Isnin ... 6=Sabtu
  projek: ["Panorama", "Impian Emas", "Pulai Mutiara 2", "Clover Pulai Mutiara",
           "Sierra Height", "Midas Seri Alam", "Kempas Utama", "Batu Pahat", "Jasin Melaka"],
  sumber: ["Facebook", "WhatsApp", "Referral", "Walk-in", "Google", "Repeat Client"],
  cuti: [],                                   // [{tarikh:"2025-01-29", sebab:"Tahun Baru Cina"}]
  targetBulan: {},                            // { "2026-09": 20000 } — ganti target bulan tertentu
  statusKerja: ["Tempahan", "Inspection Siap", "Report Siap", "Submit Report",
                "Submit App", "Minta Bayaran", "Selesai", "Batal"],
  statusSelesai: "Selesai",
  statusBatal: "Batal",
  tempohPendingHari: 3,
  resit: {
    namaSyarikat: "GoXpert Solution",
    alamat: "Nook Workspace,\nJalan Aliff 6, Taman Damansara Aliff,\n81200 Johor Bahru, Johor",
    email: "official@goxpert.my",
    ssm: "202503234804 (003768196-A)",
    logoUrl: "https://arleta.site/interactivelink/1453/Logo-Go-Expert-1.png",
    tandatanganUrl: "https://arleta.site/interactivelink/1453/sign-fikri.png",
    namaPenandatangan: "FIKRI RAHMAN",
    jawatanPenandatangan: "(OPERATION STRATEGY MANAGER)",
    bank: "Maybank",
    noAkaun: "551137785563",
    namaAkaun: "Go Xpert Solution",
    nota: "**Receipt needs to be send on WhatsApp: +6011-31446591",
    prefix: "GX",
    nombor: 1,
    prefixInvois: "INV",
    nomborInvois: 1,
    tempohHari: 7,
    notaInvois: "Sila jelaskan bayaran sebelum tarikh akhir di atas.",
    teksInvois: "Salam {nama},\n\n" +
      "Berikut invois {no} untuk {servis}.\n" +
      "Tarikh inspection: {tarikhInspeksi}\n\n" +
      "Jumlah perlu dibayar: {jumlah}\n" +
      "Sila jelaskan sebelum {tarikhAkhir}.\n\n" +
      "Pembayaran:\n{bank}\n{akaun} ({namaAkaun})\n\n" +
      "Mohon hantar bukti pembayaran selepas transaksi. Terima kasih.\n{syarikat}",
    teksResit: "Salam {nama},\n\n" +
      "Terima kasih. Kami telah menerima bayaran {jenis} sebanyak {jumlah}.\n\n" +
      "No. resit: {no}\nTarikh: {tarikh}\nBaki tertunggak: {baki}\n\n" +
      "Resit rasmi dilampirkan. Terima kasih.\n{syarikat}"
  }
};

var JENIS_BAYARAN = ["Deposit", "Bayaran Kedua", "Bayaran Ketiga", "Bayaran Akhir",
                     "Bayaran Penuh", "Bayaran Tambahan", "Lain-lain"];

var KAEDAH_BAYAR = ["Bank Transfer", "Tunai", "DuitNow / QR", "Cek", "Lain-lain"];

var KUMPULAN = ["Operasi", "Management"];

var STATUS_KERJA = ["Tempahan", "Inspection Siap", "Report Siap", "Submit Report",
                    "Submit App", "Minta Bayaran", "Selesai", "Batal"];

// Tetapan semasa dicache supaya jadual besar tidak membaca localStorage berulang.
var CFG = null;
function cfg() { return CFG || (CFG = baca().tetapan); }
function statusSenarai(t) {
  t = t || cfg();
  return (t.statusKerja && t.statusKerja.length) ? t.statusKerja : STATUS_KERJA;
}

// Kelas warna bagi satu status kerja.
function kelasStatus(status, t) {
  t = t || cfg();
  if (status === t.statusBatal) return "st-batal";
  if (status === t.statusSelesai) return "st-siap";
  var i = statusSenarai(t).indexOf(status);
  return "st-s" + (i < 0 ? 0 : i % 6);
}

// Berapa hari sejak tarikh inspeksi (negatif bermakna belum sampai).
function hariSejak(tarikh) {
  var a = keDate(tarikh), b = keDate(kunciTarikh());
  if (!a || !b) return 0;
  return Math.round((b - a) / 86400000);
}

// Kerja tertunggak: sudah lepas tempoh tetapi belum selesai/batal.
function tertunggak(s, t) {
  t = t || cfg();
  var status = s.statusKerja || statusSenarai(t)[0];
  if (status === t.statusSelesai || status === t.statusBatal) return 0;
  var hari = hariSejak(s.tarikh);
  var tempoh = Math.max(0, nom(t.tempohPendingHari));
  return hari > tempoh ? hari : 0;
}

/* ----------------------------- simpanan ------------------------------- */
function nomAwal(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

function baca() {
  var mentah = null;
  try { mentah = JSON.parse(localStorage.getItem(KUNCI)); } catch (e) { mentah = null; }
  if (!mentah || typeof mentah !== "object") {
    mentah = { tetapan: {}, staf: [], sale: [] };
  }
  mentah.tetapan = Object.assign({}, TETAPAN_ASAL, mentah.tetapan || {});
  mentah.tetapan.targetBulan = mentah.tetapan.targetBulan || {};
  mentah.staf = (mentah.staf || []).map(function (x) {
    // Rekod lama tiada kumpulan — teka dari jawatan.
    if (!x.kumpulan) {
      x.kumpulan = /inspect|operasi|teknik|site/i.test(x.jawatan || "") ? "Operasi" : "Management";
    }
    return x;
  });
  mentah.sale = mentah.sale || [];
  mentah.nota = mentah.nota || {};          // { "2026-09-07": "catatan hari" }
  mentah.tanda = mentah.tanda || {};        // tanda cuti dari kalendar sahaja
  mentah.resit = mentah.resit || [];
  mentah.invois = mentah.invois || [];
  mentah.subjob = mentah.subjob || [];      // kerja sub — tidak dikira dalam jualan syarikat
  mentah.sale = (mentah.sale || []).map(function (s) {
    // Rekod lama menyimpan deposit/finalPayment sebagai nombor tunggal.
    // Tukar kepada senarai bayaran supaya satu jualan boleh ada banyak bayaran.
    if (!Array.isArray(s.bayaran)) {
      s.bayaran = [];
      if (nomAwal(s.deposit) > 0) {
        s.bayaran.push({ id: "b" + s.id + "d", tarikh: s.tarikh, jenis: "Deposit",
          jumlah: nomAwal(s.deposit), kaedah: "", rujukan: "", catatan: "", resitId: null });
      }
      if (nomAwal(s.finalPayment) > 0) {
        s.bayaran.push({ id: "b" + s.id + "f", tarikh: s.tarikh, jenis: "Bayaran Akhir",
          jumlah: nomAwal(s.finalPayment), kaedah: "", rujukan: "", catatan: "", resitId: null });
      }
      delete s.deposit;
      delete s.finalPayment;
    }
    return s;
  });
  mentah.tetapan.resit = Object.assign({}, TETAPAN_ASAL.resit, mentah.tetapan.resit || {});
  return mentah;
}

function simpan(data) {
  try {
    localStorage.setItem(KUNCI, JSON.stringify(data));
    CFG = data.tetapan;
    return true;
  } catch (e) {
    toast("Gagal simpan data: " + e.message, "bad", 6000);
    return false;
  }
}

function benihkan() {
  if (localStorage.getItem(KUNCI)) return;
  var data = { tetapan: Object.assign({}, TETAPAN_ASAL), staf: [
    { id: id(), nama: "Dastie", jawatan: "Sales", kumpulan: "Management", jabatan: "Jualan",
      telefon: "", email: "", status: "aktif", tarikhMula: "" },
    { id: id(), nama: "Ummi", jawatan: "Sales", kumpulan: "Management", jabatan: "Jualan",
      telefon: "", email: "", status: "aktif", tarikhMula: "" }
  ], sale: [], resit: [], invois: [], subjob: [], nota: {}, tanda: {} };
  simpan(data);
}

/* ------------------------------ bantuan ------------------------------- */
function id() { return "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }

function esc(v) {
  if (v === null || v === undefined) return "";
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function nom(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }

function rm(n) {
  return "RM " + nom(n).toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// Tukar teks masa ("9.30am", "2:30 pm", "14.00") kepada minit untuk penyusunan.
function masaMinit(teks) {
  var t = String(teks || "").toLowerCase().replace(/\s+/g, "");
  if (!t) return 99999;                       // tiada masa — letak di hujung
  var m = t.match(/^(\d{1,2})[:.]?(\d{2})?(am|pm)?/);
  if (!m) return 99999;
  var jam = parseInt(m[1], 10);
  var minit = parseInt(m[2] || "0", 10);
  if (m[3] === "pm" && jam < 12) jam += 12;
  if (m[3] === "am" && jam === 12) jam = 0;
  return jam * 60 + minit;
}

// Ringgit padat untuk ruang sempit: RM 410 / RM 410.50
function rmPendek(n) {
  var x = nom(n);
  return "RM " + (x % 1 === 0
    ? x.toLocaleString("ms-MY")
    : x.toLocaleString("ms-MY", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
}

function kunciTarikh(d) {
  d = d || new Date();
  var p = function (x) { return String(x).padStart(2, "0"); };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
}

var NAMA_HARI = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
var NAMA_BULAN = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai",
                  "Ogos", "September", "Oktober", "November", "Disember"];

function keDate(t) { var d = new Date(t + "T00:00:00"); return isNaN(d) ? null : d; }
function namaHari(t) { var d = keDate(t); return d ? NAMA_HARI[d.getDay()] : "-"; }

function fmtTarikh(t) {
  var d = keDate(t);
  if (!d) return "-";
  return d.getDate() + " " + NAMA_BULAN[d.getMonth()].slice(0, 3) + " " + d.getFullYear();
}

function fmtBulan(b) {
  var bhg = String(b || "").split("-");
  if (bhg.length < 2) return b;
  return NAMA_BULAN[parseInt(bhg[1], 10) - 1] + " " + bhg[0];
}

function bulanKini() { return kunciTarikh().slice(0, 7); }

function telefonKemas(t) {
  var bersih = String(t || "").replace(/[^\d+]/g, "");
  if (/^01\d{8,9}$/.test(bersih)) return bersih.slice(0, 3) + "-" + bersih.slice(3);
  if (/^0\d{8,9}$/.test(bersih)) return bersih.slice(0, 2) + "-" + bersih.slice(2);
  return String(t || "").trim();
}

function toast(mesej, jenis, ms) {
  var kotak = $("#toastBox");
  if (!kotak) {
    kotak = document.createElement("div");
    kotak.id = "toastBox";
    kotak.className = "toast-box";
    document.body.appendChild(kotak);
  }
  var t = document.createElement("div");
  t.className = "toast toast-" + (jenis || "info");
  t.textContent = mesej;
  kotak.appendChild(t);
  setTimeout(function () { t.remove(); }, ms || 3200);
}

function modal(tajuk, kandungan, lebar) {
  var bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = '<div class="modal-kad" style="max-width:' + (lebar || 620) + 'px">' +
    '<div class="modal-tajuk"><h3>' + esc(tajuk) + '</h3>' +
    '<button class="modal-tutup" type="button" aria-label="Tutup">&times;</button></div>' +

  $(".modal-tutup", bg).onclick = tutup;
  bg.addEventListener("click", function (e) { if (e.target === bg) tutup(); });
  document.body.appendChild(bg);
  return { el: bg, tutup: tutup };
}

function muatTurun(namaFail, kandungan, jenis) {
  var blob = new Blob([kandungan], { type: jenis || "text/plain;charset=utf-8" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = namaFail;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}

function csv(namaFail, tajuk, baris) {
  var bersih = function (v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  var teks = [tajuk].concat(baris).map(function (r) { return r.map(bersih).join(","); }).join("\r\n");
  muatTurun(namaFail + ".csv", "﻿" + teks, "text/csv;charset=utf-8;");
}

function kosong(mesej) { return '<div class="kosong">' + esc(mesej || "Tiada rekod.") + "</div>"; }

/* --------------------------- kiraan sale ------------------------------ */
function kiraSale(s) {
  var total = nom(s.harga) + nom(s.water) + nom(s.electric);
  var dibayar = (s.bayaran || []).reduce(function (j, b) { return j + nom(b.jumlah); }, 0);
  var baki = Math.round((total - dibayar) * 100) / 100;
  var statusBayar = total > 0 && baki <= 0 ? "lunas" : (dibayar > 0 ? "deposit" : "belum");
  return { total: total, dibayar: dibayar, baki: baki, statusBayar: statusBayar };
}

function lencanaBayar(k) {
  if (k.statusBayar === "lunas") return '<span class="badge badge-ok">Lunas</span>';
  if (k.statusBayar === "deposit") return '<span class="badge badge-warn">Baki ' + esc(rm(k.baki)) + "</span>";
  return '<span class="badge badge-bad">Belum bayar</span>';
}

function lencanaKerja(status, t) {
  t = t || cfg();
  var teks = status || statusSenarai(t)[0];
  return '<span class="badge ' + kelasStatus(teks, t) + '">' + esc(teks) + "</span>";
}

function lencanaTunggak(hari) {
  return '<span class="badge st-tunggak">Pending ' + hari + " hari</span>";
}

// Cuti pada satu tarikh: dari senarai Tetapan, atau tanda terus dari kalendar.
function cutiPada(tarikh, data) {
  var rasmi = (data.tetapan.cuti || []).filter(function (c) { return c.tarikh === tarikh; })[0];
  if (rasmi) return { sebab: rasmi.sebab || "Cuti", sumber: "tetapan" };
  var tanda = (data.tanda || {})[tarikh];
  if (tanda) return { sebab: tanda, sumber: "kalendar" };
  return null;
}

// Bilangan hari bekerja (tolak hujung minggu tidak bekerja dan hari cuti).
function hariBekerjaBulan(bulan, data) {
  var bhg = String(bulan).split("-");
  var tahun = parseInt(bhg[0], 10), bln = parseInt(bhg[1], 10);
  if (!tahun || !bln) return 0;
  var hariAkhir = new Date(tahun, bln, 0).getDate();
  var bil = 0;
  for (var h = 1; h <= hariAkhir; h++) {
    var p = function (x) { return String(x).padStart(2, "0"); };
    var tarikh = tahun + "-" + p(bln) + "-" + p(h);
    var d = keDate(tarikh);
    if (!d) continue;
    if (cutiPada(tarikh, data)) continue;
    if ((data.tetapan.hariBekerja || []).indexOf(d.getDay()) === -1) continue;
    bil++;
  }
  return bil;
}

function targetKhasBulan(bulan, data) {
  var nilai = (data.tetapan.targetBulan || {})[bulan];
  return nilai === undefined || nilai === "" ? null : nom(nilai);
}

function targetHari(tarikh, data) {
  var d = keDate(tarikh);
  if (!d) return 0;
  if (cutiPada(tarikh, data)) return 0;
  if ((data.tetapan.hariBekerja || []).indexOf(d.getDay()) === -1) return 0;
  // Bulan yang ada target khas: target harian = target bulan / hari bekerja.
  var khas = targetKhasBulan(String(tarikh).slice(0, 7), data);
  if (khas !== null) {
    var bil = hariBekerjaBulan(String(tarikh).slice(0, 7), data);
    return bil ? Math.round((khas / bil) * 100) / 100 : 0;
  }
  return nom(data.tetapan.targetHarian);
}

function targetBulan(bulan, data) {
  var khas = targetKhasBulan(bulan, data);
  if (khas !== null) return khas;
  return hariBekerjaBulan(bulan, data) * nom(data.tetapan.targetHarian);
}

function saleBulan(data, bulan) {
  return data.sale.filter(function (s) {
    return String(s.tarikh || "").slice(0, 7) === bulan && s.statusKerja !== "Batal";
  });
}

function ringkasan(senarai) {
  var r = { bil: senarai.length, total: 0, dibayar: 0, baki: 0 };
  senarai.forEach(function (s) {
    var k = kiraSale(s);
    r.total += k.total; r.dibayar += k.dibayar; r.baki += k.baki;
  });
  return r;
}

    siteTahun += rB.bil;
    titik.push({ kunci: kunciB, label: NAMA_BULAN[bln - 1].slice(0, 3),
                 nilai: papanMetrik === "site" ? rB.bil : rB.total,

  var idxKini = titik.map(function (x) { return x.kunci; }).indexOf(papanBulan);
  var beza = null;

    var lepas = titik[idxKini - 1].nilai, kini = titik[idxKini].nilai;

          "</div>" +
          "<div>" + Object.keys(petaTunggak).map(function (st) {

          }).join("") + "</div>" +
          '<div class="amaran-senarai">' +
            tunggak.slice(0, 6).map(function (x) {
              var tugas = x.tugasSubmit || x.tugasReport;
              return '<button type="button" class="amaran-item" data-tunggak="' + esc(x.id) + '">' +
                '<span><span class="nama">' + esc(x.nama || "Tanpa nama") + "</span>" +
                '<div class="kecil">' + esc(fmtTarikh(x.tarikh)) + " · " +
                esc(x.projek || "-") + (x.unit ? " " + esc(x.unit) : "") +
                (tugas ? " · " + esc(tugas) : " · belum ditugaskan") +
                (x.jenisSubmit ? " · " + esc(x.jenisSubmit) : "") + "</div></span>" +
                '<span class="kanan">' + lencanaKerja(x.statusKerja, t) +
                lencanaTunggak(hariSejak(x.tarikh)) + "</span></button>";
            }).join("") +
          "</div>" +
          (tunggak.length > 6
            ? '<div class="amaran-lagi">+ ' + (tunggak.length - 6) + " tugasan lagi tertunggak</div>" : "") +
        "</div>"
      : "") +
    '<div class="penapis">' +
      '<label>Bulan<input type="month" id="papanBulan" value="' + esc(papanBulan) + '"></label>' +
      '<button class="btn btn-utama" id="btnCepatSale">+ Key-in Sale Baru</button>' +
    '</div>' +

    '<div class="grid grid-4">' +
      kadStat("Jualan " + fmtBulan(papanBulan), rm(r.total), r.bil + " job direkod") +
      kadStat("Deposit Dikutip", rm(r.dibayar), "termasuk bayaran penuh") +
      kadStat("Baki Belum Kutip", rm(r.baki), adaBaki.length + " job ada baki") +
      kadStat("Site Bulan Ini", String(r.bil), siteTahun + " site sepanjang " + papanTahun) +
      '<div class="stat"><div class="stat-label">Capai Target</div>' +
        '<div class="stat-nilai">' + peratus + '%</div>' +

        "<h3>" + (papanMetrik === "site" ? "Bilangan Site " : "Jualan Bulanan ") + papanTahun + "</h3>" +
        '<div class="aksi">' +
          '<div class="suis">' +
            '<button type="button" id="metrikJualan"' + (papanMetrik === "jualan" ? ' class="aktif"' : "") + ">Jualan (RM)</button>" +
            '<button type="button" id="metrikSite"' + (papanMetrik === "site" ? ' class="aktif"' : "") + ">Site</button>" +
          "</div>" +
          (beza && beza.jumlah > 0

              (beza.naik ? "Naik " : "Turun ") +

      "</div>" +
      cartaTegak(titik, papanBulan, papanMetrik === "site"

      '<div class="carta-paksi"><span>Jumlah setahun: <b>' +
        esc(papanMetrik === "site"
          ? titik.reduce(function (j, x) { return j + x.nilai; }, 0) + " site"
          : rm(titik.reduce(function (j, x) { return j + x.nilai; }, 0))) + "</b></span>" +
        "<span>" + (papanMetrik === "site"
          ? esc(rm(data.sale.filter(function (x) {
              return String(x.tarikh).slice(0, 4) === String(papanTahun) &&
                     x.statusKerja !== t.statusBatal;
            }).reduce(function (j, x) { return j + kiraSale(x).total; }, 0)))
          : siteTahun + " site") +

    "</div>" +

    '<div class="grid grid-2">' +
      '<div class="kad tanpa-margin">' +
        '<div class="kad-tajuk"><h3>Hari Ini — ' + esc(namaHari(hariIni)) + ", " + esc(fmtTarikh(hariIni)) + "</h3>" +
          (sasarHariIni === 0 ? '<span class="badge badge-muted">Hari cuti</span>'
            : '<span class="badge ' + (saleHariIni.total >= sasarHariIni ? "badge-ok" : "badge-warn") + '">' +

        "</div>" +

// Kumpulkan dokumen (resit/invois) ikut nama client, boleh kembang.
function kumpulanClient(senarai, nilaiUtama) {
  var peta = {};
  senarai.forEach(function (r) {
    var kunci = String(r.client && r.client.nama ? r.client.nama : "Tanpa nama").trim().toLowerCase();
    if (!peta[kunci]) {
      peta[kunci] = { nama: (r.client && r.client.nama) || "Tanpa nama", senarai: [], jumlah: 0 };
    }
    peta[kunci].senarai.push(r);
    peta[kunci].jumlah += nom(nilaiUtama(r));
  });
  return Object.keys(peta).map(function (k) { return peta[k]; })
    .sort(function (a, b) { return b.jumlah - a.jumlah; });
}

function pasangKumpulan(bekas) {
  $$(".kumpulan-kepala", bekas).forEach(function (btn) {
    btn.onclick = function () { btn.parentElement.classList.toggle("buka"); };
  });
}

// Carta bar tegak: satu siri, label bulan di bawah, nilai pada bar tertinggi
// dan bar semasa sahaja supaya tidak sesak.
function cartaTegak(titik, penanda, fmt) {
  fmt = fmt || rmPendek;
  var maks = Math.max.apply(null, titik.map(function (x) { return x.nilai; }).concat([1]));
  return '<div class="carta"><div class="carta-tegak">' +
    titik.map(function (x) {
      var tinggi = Math.round((x.nilai / maks) * 100);
      var tunjuk = x.kunci === penanda || (x.nilai === maks && maks > 0);
      return '<div class="carta-lajur' + (x.kunci === penanda ? " kini" : "") +
        '" title="' + esc(x.label + ": " + fmt(x.nilai) + (x.nota ? " · " + x.nota : "")) + '">' +
        '<span class="carta-nilai">' + (tunjuk && x.nilai > 0 ? esc(fmt(x.nilai)) : "") + "</span>" +
        '<span class="carta-batang" style="height:' + Math.max(tinggi, x.nilai > 0 ? 2 : 0) + '%"></span>' +
        '<span class="carta-label">' + esc(x.label) + "</span></div>";
    }).join("") + "</div></div>";
}

// Carta bar mendatar untuk perbandingan antara staf.
function cartaMendatar(baris) {
  var maks = Math.max.apply(null, baris.map(function (x) { return x.nilai; }).concat([1]));
  if (!baris.length) return kosong("Tiada data.");
  return '<div class="carta">' + baris.map(function (x) {
    return '<div class="carta-baris" title="' + esc(x.nama + ": " + x.teks) + '">' +
      '<span class="nama">' + esc(x.nama) + "</span>" +
      '<span class="carta-jalur"><span style="width:' +
        Math.max(2, Math.round((x.nilai / maks) * 100)) + '%"></span></span>' +
      '<span class="nilai">' + esc(x.teks) + "</span></div>";
  }).join("") + "</div>";
}

function kadStat(label, nilai, nota) {
  return '<div class="stat"><div class="stat-label">' + esc(label) + "</div>" +
    '<div class="stat-nilai">' + esc(nilai) + "</div>" +
    '<div class="stat-nota">' + esc(nota || "") + "</div></div>";
}

function kumpul(senarai, medan) {
  var peta = {};
  senarai.forEach(function (s) {
    var kunci = (s[medan] || "Tidak dinyatakan").trim() || "Tidak dinyatakan";
    if (!peta[kunci]) peta[kunci] = { nama: kunci, bil: 0, total: 0 };
    peta[kunci].bil++;
    peta[kunci].total += kiraSale(s).total;
  });
  return Object.keys(peta).map(function (k) { return peta[k]; })
    .sort(function (a, b) { return b.total - a.total; });
}

function kadPrestasi(tajuk, senarai, sasar) {
  var tertinggi = senarai.length ? senarai[0].total : 0;
  return '<div class="kad tanpa-margin"><div class="kad-tajuk"><h3>' + esc(tajuk) + "</h3>" +
    (sasar ? '<span class="kecil">Target bulan: ' + esc(rm(sasar)) + "</span>" : "") + "</div>" +
    (senarai.length ? senarai.map(function (x) {
      var lebar = tertinggi > 0 ? Math.round((x.total / tertinggi) * 100) : 0;
      return '<div class="senarai-item"><div class="jumlah-baris" style="border:0;padding:0">' +
        "<span><b>" + esc(x.nama) + '</b> <span class="kecil">· ' + x.bil + " job</span></span>" +
        "<b>" + esc(rm(x.total)) + "</b></div>" +
        '<div class="bar-progres"><span style="width:' + lebar + '%"></span></div></div>';
    }).join("") : kosong("Tiada data untuk bulan ini.")) + "</div>";
}

/* ======================================================================
   HALAMAN 2 — KEY-IN SALE
   ================================================================== */
var tapis = { bulan: bulanKini(), cari: "", kerja: "", sales: "" };
var paparanSale = "kalendar";   // "kalendar" atau "senarai"
var modPilih = false;           // mod tick tarikh untuk kongsi slot kosong
var tarikhPilih = [];

function saleDitapis(data) {
  var teks = tapis.cari.trim().toLowerCase();
  return data.sale.filter(function (s) {
    if (tapis.bulan && String(s.tarikh || "").slice(0, 7) !== tapis.bulan) return false;
    if (tapis.kerja && (s.statusKerja || "Tempahan") !== tapis.kerja) return false;
    if (tapis.sales && s.closedBy !== tapis.sales) return false;
    if (teks) {
      var gabung = [s.nama, s.telefon, s.email, s.unit, s.projek, s.size, s.catatan,
                    s.invois1, s.invois2].join(" ").toLowerCase();
      if (gabung.indexOf(teks) === -1) return false;
    }
    return true;
  }).sort(function (a, b) {
    var c = String(b.tarikh).localeCompare(String(a.tarikh));
    return c !== 0 ? c : masaMinit(a.masaMula) - masaMinit(b.masaMula);
  });
}

function lukisSale(bekas) {
  var data = baca();
  var senarai = saleDitapis(data);
  var r = ringkasan(senarai.filter(function (s) { return s.statusKerja !== "Batal"; }));
  var sasar = targetBulan(tapis.bulan, data);
  var namaSales = data.staf.filter(function (s) { return s.status === "aktif"; })
    .map(function (s) { return s.nama; });

  bekas.innerHTML =
    '<div class="papar-cetak"><h2>' + esc(data.tetapan.namaSyarikat) + " — Jualan " +
      esc(fmtBulan(tapis.bulan)) + "</h2></div>" +

    '<div class="kad">' +
      '<div class="kad-tajuk">' +
        '<div class="suis">' +
          '<button type="button" id="suisKalendar"' + (paparanSale === "kalendar" ? ' class="aktif"' : "") + ">Kalendar</button>" +
          '<button type="button" id="suisSenarai"' + (paparanSale === "senarai" ? ' class="aktif"' : "") + ">Senarai</button>" +
        "</div>" +
        '<div class="aksi">' +
          '<button class="btn btn-utama" id="btnSaleBaru">Key-in Sale Baru</button>' +
          '<button class="btn btn-lembut" id="btnPasteWS">Isi Auto (WhatsApp)</button>' +
          (paparanSale === "kalendar"
            ? '<button class="btn btn-lembut" id="btnModPilih">' +
              (modPilih ? "Batal Pilih Tarikh" : "Slot Kosong") + "</button>" : "") +
          '<button class="btn btn-lembut" id="btnEksport">Eksport CSV</button>' +
          '<button class="btn btn-lembut" id="btnCetak">Cetak</button>' +
        "</div>" +
      "</div>" +
      '<div class="penapis">' +
        (paparanSale === "senarai"
          ? '<label>Bulan<input type="month" id="fBulan" value="' + esc(tapis.bulan) + '"></label>' : "") +
        '<label style="min-width:220px">Cari<input type="search" id="fCari" placeholder="Nama, telefon, unit, projek…" value="' + esc(tapis.cari) + '"></label>' +
        "<label>Status Kerja<select id=\"fKerja\"><option value=''>Semua</option>" +
          statusSenarai(data.tetapan).map(function (s) {
            return '<option' + (tapis.kerja === s ? " selected" : "") + ">" + esc(s) + "</option>";
          }).join("") + "</select></label>" +
        "<label>Closed By<select id=\"fSales\"><option value=''>Semua</option>" +
          namaSales.map(function (s) {
            return '<option' + (tapis.sales === s ? " selected" : "") + ">" + esc(s) + "</option>";
          }).join("") + "</select></label>" +
        '<button class="btn btn-lembut" id="btnReset">Reset</button>' +
      "</div>" +

      '<div class="grid grid-4" style="margin-bottom:16px">' +
        kadStat("Jumlah Jualan", rm(r.total), r.bil + " job") +
        kadStat("Sudah Dibayar", rm(r.dibayar), "deposit + bayaran penuh") +
        kadStat("Baki", rm(r.baki), "belum dikutip") +
        kadStat("Target Bulan", rm(sasar), sasar > 0 ? Math.round((r.total / sasar) * 100) + "% dicapai" : "tiada target") +
      "</div>" +

      (paparanSale === "kalendar" && modPilih
        ? '<div class="bar-pilih">' +
            '<span class="kecil">Tick tarikh yang ada slot kosong, kemudian tekan ' +
            "<b>Dapatkan Slot</b>. <b id=\"kiraPilih\">" + tarikhPilih.length + "</b> tarikh dipilih.</span>" +
            '<div class="aksi">' +
              '<button class="btn btn-utama btn-kecil" id="btnJanaSlot">Dapatkan Slot</button>' +
              '<button class="btn btn-lembut btn-kecil" id="btnKosongPilih">Kosongkan</button>' +
            "</div>" +
          "</div>" : "") +
      (paparanSale === "kalendar"
        ? kalendarSale(data, senarai)
        : '<div class="jadual-bungkus">' + jadualSale(senarai) + "</div>") +
    "</div>";

  if ($("#btnModPilih")) $("#btnModPilih").onclick = function () {
    modPilih = !modPilih;
    if (!modPilih) tarikhPilih = [];
    lukisSale(bekas);
  };
  if ($("#btnJanaSlot")) $("#btnJanaSlot").onclick = function () {
    if (!tarikhPilih.length) return toast("Tick sekurang-kurangnya satu tarikh dahulu.", "warn");
    borangSlot(bekas);
  };
  if ($("#btnKosongPilih")) $("#btnKosongPilih").onclick = function () {
    tarikhPilih = [];
    lukisSale(bekas);
  };
  $("#suisKalendar").onclick = function () { paparanSale = "kalendar"; lukisSale(bekas); };
  $("#suisSenarai").onclick = function () { paparanSale = "senarai"; lukisSale(bekas); };
  if ($("#fBulan")) $("#fBulan").onchange = function (e) { tapis.bulan = e.target.value; lukisSale(bekas); };
  if (paparanSale === "kalendar") pasangAksiKalendar(bekas);
  $("#fKerja").onchange = function (e) { tapis.kerja = e.target.value; lukisSale(bekas); };
  $("#fSales").onchange = function (e) { tapis.sales = e.target.value; lukisSale(bekas); };
  $("#btnReset").onclick = function () {
    tapis = { bulan: bulanKini(), cari: "", kerja: "", sales: "" };
    lukisSale(bekas);
  };
  var kotakCari = $("#fCari");
  kotakCari.oninput = function (e) {
    tapis.cari = e.target.value;
    var kedudukan = e.target.selectionStart;
    lukisSale(bekas);
    var kotak = $("#fCari", bekas);
    kotak.focus();
    kotak.setSelectionRange(kedudukan, kedudukan);
  };
  $("#btnSaleBaru").onclick = function () { borangSale(null); };
  $("#btnPasteWS").onclick = function () { borangPasteWS(); };
  $("#btnCetak").onclick = function () { window.print(); };
  $("#btnEksport").onclick = function () {
    if (!senarai.length) return toast("Tiada data untuk dieksport.", "warn");
    csv("jualan-" + tapis.bulan,
      ["Tarikh", "Hari", "Masa", "Nama", "Telefon", "Email", "Size", "Unit", "Projek",
       "Harga", "Water", "Electric", "Total", "Jumlah Dibayar", "Bil. Bayaran", "Baki",
       "Closed By", "Staf Inspection", "Dari", "Status Kerja", "Invois 1", "Invois 2", "Catatan"],
      senarai.map(function (s) {
        var k = kiraSale(s);
        return [s.tarikh, namaHari(s.tarikh),
          (s.masaMula || "") + (s.masaTamat ? "-" + s.masaTamat : ""),
          s.nama, s.telefon, s.email, s.size, s.unit, s.projek,
          nom(s.harga), nom(s.water), nom(s.electric), k.total,
          k.dibayar, (s.bayaran || []).length, k.baki,
          s.closedBy, (s.inspector || []).join(" / "), s.sumber, s.statusKerja || "Tempahan",
          s.invois1, s.invois2, s.catatan];
      }));
  };
  if (paparanSale === "senarai") pasangAksiJadual(bekas);
}

/* ------------------------- paparan kalendar --------------------------- */
var HARI_PENDEK = ["Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu", "Ahad"];

function tambahBulan(bulan, langkah) {
  var b = bulan.split("-");
  var d = new Date(parseInt(b[0], 10), parseInt(b[1], 10) - 1 + langkah, 1);
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

function kalendarSale(data, senarai) {
  var b = tapis.bulan.split("-");
  var tahun = parseInt(b[0], 10), bln = parseInt(b[1], 10);
  var pertama = new Date(tahun, bln - 1, 1);
  var lompang = (pertama.getDay() + 6) % 7;            // Isnin = 0
  var hariAkhir = new Date(tahun, bln, 0).getDate();
  var hariIni = kunciTarikh();

  var peta = {};
  senarai.forEach(function (s) {
    (peta[s.tarikh] = peta[s.tarikh] || []).push(s);
  });
  Object.keys(peta).forEach(function (t) {
    peta[t].sort(susunMasa);
  });

  // Sub job dipapar dalam kalendar untuk elak bertindih, tetapi tidak dikira
  // dalam jumlah jualan atau target.
  var petaSub = {};
  data.subjob.forEach(function (j) {
    if (String(j.tarikh).slice(0, 7) !== tapis.bulan) return;
    (petaSub[j.tarikh] = petaSub[j.tarikh] || []).push(j);
  });
  Object.keys(petaSub).forEach(function (t) { petaSub[t].sort(susunMasa); });

  var sel = [];
  for (var i = 0; i < lompang; i++) sel.push('<div class="kal-hari kal-luar kal-lompang"></div>');

  for (var h = 1; h <= hariAkhir; h++) {
    var tarikh = tahun + "-" + String(bln).padStart(2, "0") + "-" + String(h).padStart(2, "0");
    var job = peta[tarikh] || [];
    var sub = petaSub[tarikh] || [];
    var sah = job.filter(function (x) { return x.statusKerja !== "Batal"; });
    var jumlah = ringkasan(sah).total;
    var sasar = targetHari(tarikh, data);
    var cutiInfo = cutiPada(tarikh, data);

    var nota = (data.nota || {})[tarikh];
    var kelas = ["kal-hari"];
    if (cutiInfo) kelas.push("kal-cuti");
    else if (sasar === 0) kelas.push("kal-rehat");
    if (tarikh === hariIni) kelas.push("kal-ini");
    if (sasar > 0 && jumlah >= sasar) kelas.push("kal-capai");
    if (job.length || sub.length) kelas.push("ada-job");
    if (modPilih && tarikhPilih.indexOf(tarikh) !== -1) kelas.push("dipilih");

    sel.push('<div class="' + kelas.join(" ") + '" data-hari="' + tarikh + '">' +
      '<div class="kal-atas">' +
        '<span class="kal-tarikh">' + h +
          '<span class="kal-nama-hari">' + HARI_PENDEK[(new Date(tahun, bln - 1, h).getDay() + 6) % 7] + "</span></span>" +
        (modPilih
          ? '<span class="kal-tik"></span>'
          : cutiInfo
            ? '<span class="kal-cuti-label" title="' + esc(cutiInfo.sebab || "Cuti") + '">' +
              esc(cutiInfo.sebab || "Cuti") + "</span>"
            : sasar > 0
              ? '<span class="kal-sasar">' + esc(Math.round(nom(sasar)).toLocaleString("ms-MY")) + "</span>"
              : '<span class="kal-rehat-label">Rehat</span>') +
      "</div>" +
      (nota ? '<div class="kal-nota" title="' + esc(nota) + '">' + esc(nota) + "</div>" : "") +
      job.slice(0, 3).map(function (s) {
        var k = kiraSale(s);
        var lewat = tertunggak(s, data.tetapan);
        var gaya = " " + kelasStatus(s.statusKerja, data.tetapan) + (lewat ? " tunggak" : "");
        var masa = s.masaMula
          ? esc(s.masaMula) + (s.masaTamat ? " &ndash; " + esc(s.masaTamat) : "")
          : "Masa belum set";
        return '<button type="button" class="kal-job' + gaya + '" data-lihat="' + esc(s.id) + '"' +
          ' title="' + esc((s.nama || "") + " · " + (s.masaMula || "-") +
            (s.masaTamat ? " - " + s.masaTamat : "") + " · " + rm(k.total)) + '">' +
          '<b class="kal-job-baris"><span class="kal-nama">' + esc(s.nama || "Tanpa nama") + "</span>" +
          '<span class="kal-nilai">' + esc(rmPendek(k.total)) + "</span></b>" +
          '<span class="kal-job-baris"><span class="kal-masa">' + masa + "</span>" +
          '<span class="senarai-staf">' +
          (lewat ? '<span class="tag-tunggak" title="Tertunggak ' + lewat + ' hari">' + lewat + "h</span>" : "") +
          ((s.inspector || []).length
            ? s.inspector.slice(0, 3).map(function (n) {
                return '<span class="tag-staf" title="' + esc(n) + '">' + esc(inisial(n)) + "</span>";
              }).join("")
            : '<span class="tag-staf kosong" title="Belum ditugaskan">?</span>') +
          "</span></span></button>";
      }).join("") +
      (job.length > 3 ? '<div class="kal-lagi">+ ' + (job.length - 3) + " job lagi</div>" : "") +
      sub.slice(0, 2).map(function (j) {
        var k = kiraSub(j);
        return '<button type="button" class="kal-job sub" data-subjob="' + esc(j.id) + '"' +
          ' title="' + esc("SUB JOB · " + (j.nama || "") + " · " + rm(k.harga) +
            " · syarikat " + rm(k.syarikat)) + '">' +
          '<b class="kal-job-baris"><span class="kal-nama">' + esc(j.nama || "Sub job") + "</span>" +
          '<span class="kal-nilai">' + esc(rmPendek(k.harga)) + "</span></b>" +
          '<span class="kal-job-baris"><span class="kal-masa">' +
          (j.masaMula ? esc(j.masaMula) : "Sub job") + "</span>" +
          '<span class="senarai-staf"><span class="tag-sub">SUB</span></span></span></button>';
      }).join("") +
      (sub.length > 2 ? '<div class="kal-lagi">+ ' + (sub.length - 2) + " sub job lagi</div>" : "") +
      (jumlah > 0
        ? '<div class="kal-jumlah ' + (sasar > 0 && jumlah >= sasar ? "capai" : "kurang") + '">' +
          esc(rm(jumlah)) + "</div>"
        : "") +
    "</div>");
  }

  var baki = (7 - (sel.length % 7)) % 7;
  for (var j = 0; j < baki; j++) sel.push('<div class="kal-hari kal-luar kal-lompang"></div>');

  var jumBulan = ringkasan(senarai.filter(function (x) { return x.statusKerja !== "Batal"; }));
  var sasarBulan = targetBulan(tapis.bulan, data);

  return '<div class="kal-bar">' +
      '<div class="kal-nav">' +
        '<button type="button" id="kalSebelum" aria-label="Bulan sebelum">&#8249;</button>' +
        "<h3>" + esc(fmtBulan(tapis.bulan)) + "</h3>" +
        '<button type="button" id="kalSelepas" aria-label="Bulan seterusnya">&#8250;</button>' +
        '<button type="button" id="kalIni" style="width:auto;padding:0 12px">Hari Ini</button>' +
      "</div>" +
      '<div class="petunjuk">' +
        statusSenarai(data.tetapan).map(function (x) {
          return '<span><i class="' + kelasStatus(x, data.tetapan) + '" style="background:currentColor"></i>' +
            esc(x) + "</span>";
        }).join("") +
        '<span><i style="background:#dc2626"></i>Pending</span>' +
        "<span>" + esc(rm(jumBulan.total)) + " / " + esc(rm(sasarBulan)) + "</span>" +
      "</div>" +
    "</div>" +
    '<div class="kal-luar-bungkus"><div class="kal">' +
      HARI_PENDEK.map(function (n) { return '<div class="kal-kepala">' + n + "</div>"; }).join("") +
      sel.join("") +
    "</div></div>" +
    '<p class="kecil" style="margin:12px 0 0">Klik kiri pada tarikh untuk key-in sale. ' +
    "Klik kanan (atau tekan lama pada telefon) untuk tandakan cuti, tulis remark, " +
    "atau urus cuti bulan ini. Nombor kelabu di penjuru kanan ialah target harian.</p>";
}

/* --------------------- menu klik kanan kalendar ----------------------- */
var masaMenu = 0;

function tutupMenu() {
  var m = $(".menu-konteks");
  if (m) m.remove();
  // Buang pendengar supaya menu berikutnya tidak ditutup oleh pendengar lama.
  document.removeEventListener("click", tutupMenu);
  document.removeEventListener("contextmenu", tutupMenu);
  window.removeEventListener("scroll", tutupMenu, true);
  window.removeEventListener("resize", tutupMenu);
}

function menuKonteks(x, y, tajuk, item) {
  tutupMenu();
  var m = document.createElement("div");
  m.className = "menu-konteks";
  m.innerHTML = '<div class="menu-kepala">' + esc(tajuk) + "</div>" +
    item.map(function (b, i) {
      return b.pisah ? '<div class="menu-pisah"></div>'
        : '<button type="button" class="menu-item' + (b.bahaya ? " bahaya" : "") +
          '" data-i="' + i + '">' + esc(b.label) + "</button>";
    }).join("");
  document.body.appendChild(m);

  // kekal dalam skrin
  var kotak = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - kotak.width - 8)) + "px";
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - kotak.height - 8)) + "px";

  $$(".menu-item", m).forEach(function (btn) {
    btn.onclick = function () {
      var pilih = item[parseInt(btn.getAttribute("data-i"), 10)];
      tutupMenu();
      if (pilih && pilih.aksi) pilih.aksi();
    };
  });

  setTimeout(function () {
    document.addEventListener("click", tutupMenu);
    document.addEventListener("contextmenu", tutupMenu);
    window.addEventListener("scroll", tutupMenu, true);
    window.addEventListener("resize", tutupMenu);
  }, 0);
}

document.addEventListener("keydown", function (e) { if (e.key === "Escape") tutupMenu(); });

function menuHari(x, y, tarikh, bekas) {
  var data = baca();
  var cutiInfo = cutiPada(tarikh, data);
  var nota = (data.nota || {})[tarikh];
  var adaJob = data.sale.some(function (s) { return s.tarikh === tarikh; });
  var item = [];

  item.push({ label: "Key-in sale pada hari ini", aksi: function () { borangSale(null, tarikh); } });
  item.push({ label: "Sub job baharu pada hari ini", aksi: function () { borangSubJob(null, tarikh); } });
  item.push({ pisah: true });

  if (cutiInfo) {
    item.push({
      label: cutiInfo.sumber === "kalendar" ? "Tukar tanda cuti" : "Tukar sebab cuti",
      aksi: function () { borangCuti(tarikh, cutiInfo.sebab, bekas); }
    });
    item.push({ label: "Buang tanda cuti", bahaya: true, aksi: function () { buangCuti(tarikh, bekas); } });
  } else {
    item.push({ label: "Tandakan Cuti Hujung Minggu",
      aksi: function () { tandaCutiKalendar(tarikh, "Cuti Hujung Minggu", bekas); } });
    item.push({ label: "Tandakan cuti (pilih sebab)…", aksi: function () { borangCuti(tarikh, "", bekas); } });
  }

  item.push({ pisah: true });
  item.push({ label: nota ? "Sunting remark" : "Tambah remark", aksi: function () { borangNota(tarikh, bekas); } });
  if (nota) {
    item.push({ label: "Buang remark", bahaya: true, aksi: function () {
      var d = baca();
      delete d.nota[tarikh];
      simpan(d);
      toast("Remark dibuang.", "ok");
      lukisSale(bekas);
    } });
  }

  item.push({ pisah: true });
  item.push({ label: "Urus cuti bulan " + fmtBulan(tapis.bulan), aksi: function () { urusCutiBulan(bekas); } });
  if (adaJob) {
    item.push({ label: "Lihat semua job hari ini", aksi: function () { jobHari(tarikh); } });
  }

  menuKonteks(x, y, namaHari(tarikh) + ", " + fmtTarikh(tarikh), item);
}

// Tanda cuti terus dari kalendar — merah pada kalendar, tetapi tidak masuk
// senarai "Hari Cuti / Offday" dalam Tetapan.
function tandaCutiKalendar(tarikh, sebab, bekas) {
  var d = baca();
  d.tanda = d.tanda || {};
  d.tanda[tarikh] = sebab;
  if (!simpan(d)) return;
  toast(fmtTarikh(tarikh) + " ditanda " + sebab + ".", "ok");
  lukisSale(bekas);
}

function buangCuti(tarikh, bekas) {
  var d = baca();
  d.tetapan.cuti = (d.tetapan.cuti || []).filter(function (c) { return c.tarikh !== tarikh; });
  if (d.tanda) delete d.tanda[tarikh];
  if (!simpan(d)) return;
  toast(fmtTarikh(tarikh) + " bukan lagi hari cuti.", "ok");
  lukisSale(bekas);
}

var SEBAB_CUTI = ["Cuti Hujung Minggu", "Cuti Umum", "Offday", "Cuti Peristiwa", "Cuti Syarikat"];

function borangCuti(tarikh, sebabAsal, bekas) {
  var m = modal(sebabAsal ? "Tukar Sebab Cuti" : "Tandakan Hari Cuti",
    '<p class="kecil" style="margin:0 0 14px">' + esc(namaHari(tarikh) + ", " + fmtTarikh(tarikh)) +
      " — target jualan hari ini akan dikira sebagai RM 0.</p>" +
    '<form id="borangCutiHari">' +
      medan("Sebab", '<input type="text" name="sebab" value="' + esc(sebabAsal || "") +
        '" placeholder="Cuti Umum" autofocus>') +
      '<div style="margin:-6px 0 14px">' + SEBAB_CUTI.map(function (x) {
        return '<button type="button" class="chip" data-sebab="' + esc(x) + '" style="cursor:pointer">' +
          esc(x) + "</button>";
      }).join("") + "</div>" +
      '<label style="font-weight:500;color:var(--teks)"><input type="checkbox" name="keTetapan">' +

/* ------------------- slot kosong untuk dikongsi ----------------------- */

// Tukar minit kepada teks masa gaya tempatan: 540 -> "9.00am"
function masaTeks(minit) {
  var jam = Math.floor(minit / 60), min = minit % 60;
  var ap = jam >= 12 ? "pm" : "am";
  var jam12 = jam % 12;
  if (jam12 === 0) jam12 = 12;
  return jam12 + "." + String(min).padStart(2, "0") + ap;
}

// Cari ruang kosong terbesar dalam waktu kerja pada satu tarikh.
function slotDicadang(tarikh, data) {
  var mula = masaMinit(data.tetapan.waktuMasuk);
  var tamat = masaMinit(data.tetapan.waktuKeluar);
  if (mula >= 99999 || tamat >= 99999 || tamat <= mula) { mula = 9 * 60; tamat = 18 * 60; }

  var sibuk = data.sale.filter(function (s) {
    return s.tarikh === tarikh && s.statusKerja !== "Batal";
  }).map(function (s) {
    var a = masaMinit(s.masaMula);
    if (a >= 99999) return null;
    var b = s.masaTamat ? masaMinit(s.masaTamat) : a + 180;   // anggap 3 jam bila tiada masa tamat
    if (b >= 99999 || b <= a) b = a + 180;
    return [a, b];
  }).filter(Boolean).sort(function (x, y) { return x[0] - y[0]; });

  var ruang = [], kursor = mula;
  sibuk.forEach(function (j) {
    if (j[0] - kursor >= 60) ruang.push([kursor, j[0]]);
    if (j[1] > kursor) kursor = j[1];
  });
  if (tamat - kursor >= 60) ruang.push([kursor, tamat]);
  if (!ruang.length) return null;

  ruang.sort(function (x, y) { return (y[1] - y[0]) - (x[1] - x[0]); });
  return { mula: masaTeks(ruang[0][0]), tamat: masaTeks(ruang[0][1]) };
}

// Nombor telefon staf dari senarai staf (untuk buka WhatsApp terus).
function telefonStaf(nama, data) {
  var x = (data.staf || []).filter(function (p) {
    return String(p.nama).toLowerCase() === String(nama).toLowerCase();
  })[0];
  return x ? String(x.telefon || "").replace(/[^\d]/g, "") : "";
}

var TUGAS_JENIS = {
  inspection: { tajuk: "TUGASAN INSPECTION", medan: "inspector", label: "Staf inspection" },
  report:     { tajuk: "TUGASAN REPORT",     medan: "tugasReport", label: "Report" },
  submit:     { tajuk: "TUGASAN SUBMISSION", medan: "tugasSubmit", label: "Submission" }
};

// Bina teks tugasan — tidak sekali-kali menyertakan harga atau bayaran.
function teksTugasan(s, jenis, penerima, remark, sertakanLogin, data) {
  var j = TUGAS_JENIS[jenis];
  var b = [j.tajuk, ""];
  b.push("Client: " + (s.nama || "-"));
  b.push("Tarikh inspection: " + fmtTarikh(s.tarikh) + " (" + namaHari(s.tarikh) + ")");
  if (s.masaMula) b.push("Masa: " + s.masaMula + (s.masaTamat ? " – " + s.masaTamat : ""));
  if (s.projek) b.push("Projek: " + s.projek);
  if (s.unit) b.push("Unit: " + s.unit);
  if (s.size) b.push("Size: " + s.size);
  if (s.telefon) b.push("Telefon client: " + s.telefon);

  if (jenis === "inspection") {
    b.push("Staf bertugas: " + (penerima.join(", ") || "-"));
  } else if (jenis === "report") {
    b.push("Report disediakan oleh: " + (penerima.join(", ") || "-"));
    if ((s.inspector || []).length) b.push("Inspection oleh: " + s.inspector.join(", "));
  } else {
    b.push("Submission oleh: " + (penerima.join(", ") || "-"));
    if (s.jenisSubmit) b.push("Jenis submission: " + s.jenisSubmit);
    if (s.submitPortal) b.push("Portal / App: " + s.submitPortal);
    if (sertakanLogin && (s.submitUser || s.submitPass)) {
      b.push("Username: " + (s.submitUser || "-"));
      b.push("Password: " + (s.submitPass || "-"));
    }
    if (s.submitNota) b.push("Nota: " + s.submitNota);
  }
  if (remark) b.push("", "Remark: " + remark);
  b.push("", (data.tetapan.namaSyarikat || ""));
  return b.join("\n");
}

  jenis = TUGAS_JENIS[jenis] ? jenis : "inspection";

  var ditugaskan = jenis === "inspection"
    ? (s.inspector || []).slice()
    : (s[j.medan] ? [s[j.medan]] : []);
  var semua = ditugaskan.slice();
  data.staf.filter(function (x) { return x.status === "aktif"; }).forEach(function (x) {

  var data = baca();

    return String(a.tarikh).localeCompare(String(b.tarikh));
  });
  if (!senarai.length) {
    return '<div class="kecil" style="padding:8px 0">Belum ada bayaran direkod.</div>';

  return '<div class="jadual-bungkus"><table><thead><tr><th>Tarikh</th><th>Jenis</th>' +
    "<th class='num'>Jumlah</th><th>Kaedah</th><th>Resit</th><th></th></tr></thead><tbody>" +
    senarai.map(function (b) {

      return "<tr>" +
        "<td>" + esc(fmtTarikh(b.tarikh)) + "</td>" +
        "<td>" + esc(b.jenis) + "</td>" +
        '<td class="num"><b>' + esc(rm(b.jumlah)) + "</b></td>" +

          ? '<button class="btn btn-lembut btn-kecil" data-buka-resit="' + esc(resit.id) + '">' +
            esc(resit.no) + "</button>"
          : '<button class="btn btn-ok btn-kecil" data-resit-bayar="' + esc(b.id) + '">Buat Resit</button>') +
        "</td>" +
        '<td><button class="btn btn-lembut btn-kecil" data-sunting-bayar="' + esc(b.id) + '">Sunting</button></td>' +
      "</tr>";
    }).join("") + "</tbody></table></div>";

// Cadang jenis bayaran seterusnya ikut bilangan bayaran sedia ada.

}

function borangBayaran(saleId, bayaranId, opsi) {
  opsi = opsi || {};
  var data = baca();
  var s = data.sale.filter(function (x) { return x.id === saleId; })[0];
  if (!s) return;
  var b = bayaranId ? (s.bayaran || []).filter(function (x) { return x.id === bayaranId; })[0] : null;
  var baru = !b;
  var k = kiraSale(s);
  var bakiSemasa = baru ? k.baki : k.baki + nom(b.jumlah);

  b = b || { tarikh: kunciTarikh(), jenis: jenisSeterusnya((s.bayaran || []).length),
             jumlah: opsi.jumlah !== undefined ? nom(opsi.jumlah) : bakiSemasa,
             kaedah: KAEDAH_BAYAR[0], rujukan: "",
             catatan: opsi.invoisId ? "Bayaran bagi invois" : "" };

  var m = modal((baru ? "Rekod Bayaran" : "Sunting Bayaran") + " — " + (s.nama || "-"),
    '<div class="jumlah-baris"><span>Jumlah invois</span><b>' + esc(rm(k.total)) + "</b></div>" +
    '<div class="jumlah-baris"><span>Sudah dibayar sebelum ini</span><b>' +
      esc(rm(k.dibayar - (baru ? 0 : nom(b.jumlah)))) + "</b></div>" +
    '<div class="jumlah-baris" style="margin-bottom:14px"><span><b>Baki belum bayar</b></span><b>' +
      esc(rm(bakiSemasa)) + "</b></div>" +
    '<form id="borangBayaran">' +
      '<div class="baris-medan">' +
        medan("Tarikh Bayaran *", '<input type="date" name="tarikh" value="' + esc(b.tarikh) + '" required>') +
        medan("Jenis Bayaran", "<select name='jenis'>" + JENIS_BAYARAN.map(function (x) {
          return "<option" + (b.jenis === x ? " selected" : "") + ">" + esc(x) + "</option>";
        }).join("") + "</select>") +
        medan("Jumlah (RM) *",
          '<input type="number" step="0.01" min="0" name="jumlah" value="' + esc(b.jumlah) + '" required>') +
      "</div>" +
      '<div class="baris-medan">' +
        medan("Kaedah", "<select name='kaedah'>" + KAEDAH_BAYAR.map(function (x) {
          return "<option" + (b.kaedah === x ? " selected" : "") + ">" + esc(x) + "</option>";
        }).join("") + "</select>") +
        medan("Rujukan / No. Transaksi", '<input type="text" name="rujukan" value="' + esc(b.rujukan || "") + '">') +
      "</div>" +
      medan("Catatan", '<input type="text" name="catatan" value="' + esc(b.catatan || "") + '">') +
      '<div id="bakiSelepas" class="jumlah-baris" style="margin-bottom:8px"></div>' +
      '<div class="baris-butang modal-kaki">' +
        (baru ? "" : '<button type="button" class="btn btn-bad" id="btnPadamBayar">Padam</button>') +
        '<button type="button" class="btn btn-lembut" data-batal>Batal</button>' +
        '<button type="submit" class="btn btn-utama">' +
          (baru ? "Simpan & Buat Resit" : "Kemas Kini") + "</button>" +
      "</div>" +
    "</form>", 560);

  var borang = $("#borangBayaran", m.el);
  function kiraPapar() {
    var v = ambilNilai(borang);
    var baki = Math.max(bakiSemasa - nom(v.jumlah), 0);
    var lebih = nom(v.jumlah) - bakiSemasa;
    $("#bakiSelepas", m.el).innerHTML = "<span>Baki selepas bayaran ini</span><b>" +
      esc(rm(baki)) + (lebih > 0.005 ? ' <span class="kecil" style="color:var(--warn)">(lebih bayar ' +
      esc(rm(lebih)) + ")</span>" : "") + "</b>";
  }
  borang.addEventListener("input", kiraPapar);
  kiraPapar();

  $("[data-batal]", m.el).onclick = function () { m.tutup(); lihatSale(saleId); };
  if ($("#btnPadamBayar", m.el)) {
    $("#btnPadamBayar", m.el).onclick = function () {
      sahkan("Padam bayaran ini? Resit yang sudah dijana tidak akan dipadam.").then(function (ya) {
        if (!ya) return;
        var d = baca();
        d.sale = d.sale.map(function (x) {
          if (x.id !== saleId) return x;
          x.bayaran = (x.bayaran || []).filter(function (y) { return y.id !== bayaranId; });
          return x;
        });
        simpan(d);
        m.tutup();
        toast("Bayaran dipadam.", "ok");
        lukis();
        lihatSale(saleId);
      });
    };
  }

  borang.onsubmit = function (e) {
    e.preventDefault();
    var v = ambilNilai(borang);
    if (nom(v.jumlah) <= 0) return toast("Jumlah bayaran mesti lebih daripada sifar.", "bad");
    var d = baca();
    var idBaru = bayaranId || id();
    d.sale = d.sale.map(function (x) {
      if (x.id !== saleId) return x;
      x.bayaran = x.bayaran || [];
      var rekod = { id: idBaru, tarikh: v.tarikh, jenis: v.jenis, jumlah: nom(v.jumlah),
        kaedah: v.kaedah, rujukan: v.rujukan, catatan: v.catatan,
        resitId: b.resitId || null };
      if (bayaranId) {
        x.bayaran = x.bayaran.map(function (y) { return y.id === bayaranId ? rekod : y; });
      } else {
        x.bayaran.push(rekod);
      }
      return x;
    });
    if (!simpan(d)) return;
    m.tutup();
    toast(bayaranId ? "Bayaran dikemas kini." : "Bayaran direkod.", "ok");
    lukis();
    if (bayaranId) lihatSale(saleId);
    else borangDok("resit", { saleId: saleId, bayaranId: idBaru, invoisId: opsi.invoisId || null });
  };
}

var MEDAN_WS = [
  ["Tarikh", "tarikh"], ["Masa", "masa"], ["Nama Client", "nama"], ["No. Telefon", "telefon"],
  ["Email", "email"], ["Projek", "projek"], ["No. Unit", "unit"], ["Size", "size"],
  ["Harga (RM)", "harga"], ["Water (RM)", "water"], ["Electric (RM)", "electric"],
  ["Deposit (RM)", "depositAwal"], ["Closed By", "closedBy"], ["Dari (sumber)", "sumber"],
  ["Staf Inspection", "inspector"], ["Catatan", "catatan"]
];

function formatWS(contoh) {
  var isi = {
    "Tarikh": "8/9/2026", "Masa": "9.30am - 12.30pm", "Nama Client": "Ahmad Faiz",
    "No. Telefon": "012-3456789", "Email": "faiz@gmail.com", "Projek": "Panorama",
    "No. Unit": "A-07-07", "Size": "950", "Harga (RM)": "500", "Water (RM)": "50",
    "Electric (RM)": "0", "Deposit (RM)": "100", "Closed By": "Dastie",
    "Dari (sumber)": "Facebook", "Staf Inspection": "Fikri, Haziq", "Catatan": "Client minta pagi"
  };
  return "KEY-IN SALE\n" + MEDAN_WS.map(function (m) {
    return m[0] + ": " + (contoh ? (isi[m[0]] || "") : "");
  }).join("\n");
}

// Tukar teks tarikh (8/9/2026, 08-09-2026, 2026-09-08) kepada YYYY-MM-DD.
function tarikhDariTeks(teks) {
  var t = String(teks || "").trim();
  var a = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if (a) return a[1] + "-" + String(a[2]).padStart(2, "0") + "-" + String(a[3]).padStart(2, "0");
  var b = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if (b) {
    var tahun = b[3].length === 2 ? "20" + b[3] : b[3];
    return tahun + "-" + String(b[2]).padStart(2, "0") + "-" + String(b[1]).padStart(2, "0");
  }
  return "";
}

function huraiWS(teks) {
  var baris = String(teks || "").replace(/\r/g, "").split("\n");
  var hasil = {};
  baris.forEach(function (b) {
    var pisah = b.indexOf(":");
    if (pisah === -1) return;
    var label = b.slice(0, pisah).replace(/[*_]/g, "").trim().toLowerCase();
    var nilai = b.slice(pisah + 1).trim();
    if (!nilai) return;
    MEDAN_WS.forEach(function (m) {
      var padanan = m[0].toLowerCase();
      var ringkas = padanan.replace(/\s*\(rm\)/, "").replace(/\s*\(sumber\)/, "");
      if (label === padanan || label === ringkas ||
          (m[1] === "nama" && (label === "nama" || label === "client")) ||
          (m[1] === "telefon" && (label === "telefon" || label === "no telefon" || label === "phone")) ||
          (m[1] === "projek" && (label === "projek" || label === "daerah" || label === "projek/daerah")) ||
          (m[1] === "unit" && (label === "unit" || label === "no unit")) ||
          (m[1] === "inspector" && (label === "inspector" || label === "staf")) ) {
        hasil[m[1]] = nilai;
      }
    });
  });

  var awal = {};
  if (hasil.tarikh) awal.tarikh = tarikhDariTeks(hasil.tarikh) || kunciTarikh();
  if (hasil.masa) {
    var bhg = hasil.masa.split(/\s*(?:-|–|hingga|until|to)\s*/i);
    awal.masaMula = (bhg[0] || "").trim();
    awal.masaTamat = (bhg[1] || "").trim();
  }
  ["nama", "telefon", "email", "projek", "unit", "size", "closedBy", "sumber", "catatan"]
    .forEach(function (k) { if (hasil[k]) awal[k] = hasil[k]; });
  ["harga", "water", "electric", "depositAwal"].forEach(function (k) {
    if (hasil[k]) awal[k] = nom(String(hasil[k]).replace(/[^\d.\-]/g, ""));
  });
  if (hasil.inspector) {
    awal.inspector = hasil.inspector.split(/[,\/]+/).map(function (x) { return x.trim(); })
      .filter(Boolean);
  }
  return { awal: awal, bilangan: Object.keys(hasil).length };
}

// Senarai staf aktif + sebarang nama yang sudah ditugaskan pada rekod ini.
function pilihanInspektor(data, dipilih) {
  dipilih = dipilih || [];
  var nama = data.staf.filter(function (x) {
    return x.status === "aktif" && x.kumpulan === "Operasi";
  }).map(function (x) { return x.nama; });
  dipilih.forEach(function (n) { if (nama.indexOf(n) === -1) nama.push(n); });
  if (!nama.length) {
    return '<p class="kecil">Belum ada staf kumpulan <b>Operasi</b>. ' +
      "Tambah staf di menu Staf dan pilih kumpulan Operasi.</p>";
  }
  return nama.map(function (n) {
    return '<label class="chip pilih-chip"><input type="checkbox" class="inspektorPilih" value="' +
      esc(n) + '"' + (dipilih.indexOf(n) !== -1 ? " checked" : "") + ">" + esc(n) + "</label>";
  }).join("");
}

function inisial(nama) {
  var bhg = String(nama || "").trim().split(/\s+/);
  var teks = bhg.length > 1
    ? bhg[0].charAt(0) + bhg[bhg.length - 1].charAt(0)
    : (bhg[0] || "").slice(0, 2);
  return teks.toUpperCase();
}

function medan(label, kawalan) {
  return "<label>" + esc(label) + kawalan + "</label>";
}

function ambilNilai(borang) {
  var hasil = {};
  $$("input,select,textarea", borang).forEach(function (el) {
    if (!el.name) return;
    hasil[el.name] = el.type === "number" ? (el.value === "" ? "" : nom(el.value)) : el.value.trim();
  });
  return hasil;
}

/* ======================================================================
   RESIT — format A4 syarikat (boleh cetak / simpan PDF / kongsi)
   ================================================================== */

function nomborResitBaharu(data) {
  var t = data.tetapan.resit;
  var nombor = Math.max(1, parseInt(t.nombor, 10) || 1);
  var ada = data.resit.map(function (r) { return r.no; });
  var calon;
  do {
    calon = t.prefix + "-" + String(nombor).padStart(4, "0");
    nombor++;
  } while (ada.indexOf(calon) !== -1);
  return { no: calon, seterusnya: nombor };
}

function nomborInvoisBaharu(data) {
  var t = data.tetapan.resit;
  var nombor = Math.max(1, parseInt(t.nomborInvois, 10) || 1);
  var ada = data.invois.map(function (x) { return x.no; });
  var calon;
  do {
    calon = t.prefixInvois + "-" + String(nombor).padStart(4, "0");
    nombor++;
  } while (ada.indexOf(calon) !== -1);
  return { no: calon, seterusnya: nombor };
}

function kiraResit(r) {
  var gross = nom(r.qty) * nom(r.harga);
  var sub = gross - (gross * nom(r.diskaun) / 100);
  var terdahulu = (r.sebelum && r.sebelum.length)
    ? r.sebelum.reduce(function (j, x) { return j + nom(x.jumlah); }, 0)
    : nom(r.bayaranTerdahulu);
  var baki = Math.max(sub - terdahulu - nom(r.jumlahDiterima), 0);
  return { gross: gross, sub: sub, terdahulu: terdahulu,
           jumlahDibayar: terdahulu + nom(r.jumlahDiterima), baki: baki };
}
